<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PauseKreyol</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --border: #E4E0D8;
      --border2: #CCC9BF;
      --text: #1A1916;
      --text2: #6B6860;
      --text3: #9C9A94;
      --accent: #2D5016;
      --accent-light: #EBF2E3;
      --accent-mid: #5A8A32;
      --warn: #92400E;
      --warn-light: #FEF3C7;
      --danger: #7F1D1D;
      --danger-light: #FEE2E2;
      --info: #1E3A5F;
      --info-light: #DBEAFE;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout */
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.3px;
    }
    .sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .sidebar-nav { padding: 12px 10px; flex: 1; }
    .nav-section { margin-bottom: 16px; }
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text2);
      transition: all 0.15s;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
    }
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .user-name { font-size: 12px; font-weight: 500; }
    .user-role { font-size: 11px; color: var(--text3); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface2); }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #243F12; }

    .content { padding: 24px 28px; flex: 1; overflow-y: auto; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }

    /* Metric cards */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .metric-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 26px; font-weight: 500; margin-top: 4px; letter-spacing: -1px; }
    .metric-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .metric-card.accent-green { border-left: 3px solid var(--accent-mid); }
    .metric-card.accent-warn { border-left: 3px solid #D97706; }
    .metric-card.accent-danger { border-left: 3px solid #DC2626; }
    .metric-card.accent-info { border-left: 3px solid #3B82F6; }
    .metric-card[style*="cursor: pointer"]:hover, .metric-card[style*="cursor:pointer"]:hover {
      background: var(--surface2);
      transform: translateY(-1px);
      transition: all 0.15s;
    }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-green { background: var(--accent-light); color: var(--accent); }
    .badge-warn { background: var(--warn-light); color: var(--warn); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-info { background: var(--info-light); color: var(--info); }
    .badge-gray { background: var(--surface2); color: var(--text2); }

    /* Client list */
    .client-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .client-row:last-child { border-bottom: none; }
    .client-row:hover { opacity: 0.75; }
    .client-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .client-info { flex: 1; min-width: 0; }
    .client-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .client-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .client-right { text-align: right; flex-shrink: 0; }

    /* Alert list */
    .alert-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .alert-row:last-child { border-bottom: none; }
    .alert-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .dot-danger { background: #DC2626; }
    .dot-warn { background: #D97706; }
    .dot-ok { background: var(--accent-mid); }
    .dot-gray { background: var(--text3); }
    .alert-label { font-size: 13px; font-weight: 500; }
    .alert-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

    /* Progress bar */
    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; display: block; }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s;
    }
    .form-input:focus { outline: none; border-color: var(--accent-mid); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* Pipeline subventions */
    .pipeline { display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; }
    .pipeline-col { flex: 1; min-width: 110px; }
    .pipeline-header {
      font-size: 11px; font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 0 8px;
      white-space: nowrap;
    }
    .pipeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .pipeline-card-name { font-weight: 500; }
    .pipeline-card-sub { color: var(--text3); margin-top: 2px; font-size: 11px; }

    /* Calendar strip */
    .calendar-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .cal-day {
      flex-shrink: 0;
      width: 40px;
      text-align: center;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .cal-day-name { font-size: 10px; color: var(--text3); text-transform: uppercase; }
    .cal-day-num { font-size: 15px; font-weight: 500; margin-top: 2px; }
    .cal-day.today { background: var(--accent); color: white; }
    .cal-day.today .cal-day-name { color: rgba(255,255,255,0.7); }
    .cal-day.has-event { position: relative; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-mid); margin: 3px auto 0; }
    .cal-day.today .cal-dot { background: white; }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    .empty-text { font-size: 13px; }

    /* Tâches */
    .task-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-check {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border2);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: var(--accent); border-color: var(--accent); }
    .task-body { flex: 1; }
    .task-title { font-size: 13px; font-weight: 500; }
    .task-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-right { flex-shrink: 0; }

    /* Section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title { font-size: 15px; font-weight: 600; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const API = 'https://web-production-ac84a.up.railway.app';

// ── Mock data (utilisé si l'API n'est pas encore lancée) ─────────────────────
const MOCK = {
  dashboard: {
    nb_clients: 2,
    nb_alertes_urgentes: 3,
    clients: [
      { slug: 'House_of_Bastet__HOB_', nom: 'House of Bastet (HOB)', siret: '93280087300014', nb_projets: 1, created_at: '2026-03-20' },
      { slug: 'Cie_Tropik', nom: 'Cie Tropik', siret: '88412034500021', nb_projets: 2, created_at: '2026-02-10' },
    ],
    alertes: [
      { organisme: 'Licence spectacle Type 1', statut: 'EXPIRÉ', client: 'Cie Tropik', date_expiration: '2026-01-15' },
      { organisme: 'URSSAF — dernier paiement', statut: 'URGENT', client: 'House of Bastet (HOB)', date_expiration: '2026-04-05' },
      { organisme: 'Mutuelle obligatoire', statut: 'Attention', client: 'Cie Tropik', date_expiration: '2026-06-01' },
      { organisme: 'GUSO — compte actif', statut: 'OK', client: 'House of Bastet (HOB)', date_expiration: '2027-01-01' },
    ]
  },
  taches: [
    { id: 1, titre: 'Valider les modifications du budget HOB', client: 'House of Bastet (HOB)', priorite: 'URGENT', date: '2026-03-25', done: false, source: 'Gmail' },
    { id: 2, titre: 'Dossier Mairie Paris — deadline 16 avril', client: 'House of Bastet (HOB)', priorite: 'URGENT', date: '2026-04-16', done: false, source: 'IA' },
    { id: 3, titre: 'Renouveler licence Cie Tropik', client: 'Cie Tropik', priorite: 'Attention', date: '2026-04-30', done: false, source: 'Alerte' },
    { id: 4, titre: 'Collecter statuts de Cie Tropik', client: 'Cie Tropik', priorite: 'Normal', date: '2026-05-01', done: true, source: 'Manuel' },
  ],
  pipeline: {
    'À préparer': [
      { nom: 'DRAC IDF', client: 'House of Bastet (HOB)', montant: '15 000€' },

    ],
    'Déposée': [
      { nom: 'Mairie Paris AAP', client: 'House of Bastet (HOB)', montant: '10 000€' },
    ],
    'En instruction': [
      { nom: 'CNM', client: 'Cie Tropik', montant: '5 000€' },
    ],
    'Accordée': [
      { nom: 'CAF93', client: 'Cie Tropik', montant: '3 500€' },
    ],
    'Versée': [
      { nom: 'FDVA', client: 'House of Bastet (HOB)', montant: '2 000€' },
    ],
  }
};

// ── Helpers ──────────────────────────────────────────────────────────────────

function initials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function Badge({ statut }) {
  const map = {
    'EXPIRÉ': 'badge-danger',
    'URGENT': 'badge-warn',
    'Attention': 'badge-warn',
    'OK': 'badge-green',
    '—': 'badge-gray',
    'en_construction': 'badge-info',
    'Normal': 'badge-gray',
  };
  return <span className={`badge ${map[statut] || 'badge-gray'}`}>{statut}</span>;
}

function AlertDot({ statut }) {
  const map = { 'EXPIRÉ': 'dot-danger', 'URGENT': 'dot-warn', 'Attention': 'dot-warn', 'OK': 'dot-ok' };
  return <div className={`alert-dot ${map[statut] || 'dot-gray'}`} />;
}

// ── Calendar strip ────────────────────────────────────────────────────────────

function CalendarStrip() {
  const today = new Date();
  const days = [];
  for (let i = -2; i <= 12; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }
  const names = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const events = [today.getDate() + 2, today.getDate() + 7, today.getDate() + 10];

  return (
    <div className="calendar-strip">
      {days.map((d, i) => {
        const isToday = d.toDateString() === today.toDateString();
        const hasEvent = events.includes(d.getDate());
        return (
          <div key={i} className={`cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}`}>
            <div className="cal-day-name">{names[d.getDay()]}</div>
            <div className="cal-day-num">{d.getDate()}</div>
            {hasEvent && <div className="cal-dot" />}
          </div>
        );
      })}
    </div>
  );
}

// ── Dashboard view ────────────────────────────────────────────────────────────

function DashboardView({ data, taches, onNewClient, setView }) {
  const urgentes = (data?.alertes || []).filter(a => a.statut === 'EXPIRÉ' || a.statut === 'URGENT');
  const tachesEnCours = taches.filter(t => !t.done);

  return (
    <div>
      <div className="metrics-grid">
        <div className="metric-card accent-info" onClick={() => setView('clients')} style={{ cursor: 'pointer' }}>
          <div className="metric-label">Clients actifs</div>
          <div className="metric-value">{data?.nb_clients || 0}</div>
          <div className="metric-sub">associations suivies</div>
        </div>
        <div className="metric-card accent-warn" onClick={() => setView('alertes')} style={{ cursor: 'pointer' }}>
          <div className="metric-label">Alertes urgentes</div>
          <div className="metric-value">{urgentes.length}</div>
          <div className="metric-sub">à traiter maintenant</div>
        </div>
        <div className="metric-card accent-green" onClick={() => setView('taches')} style={{ cursor: 'pointer' }}>
          <div className="metric-label">Tâches en cours</div>
          <div className="metric-value">{tachesEnCours.length}</div>
          <div className="metric-sub">dont {tachesEnCours.filter(t => t.priorite === 'URGENT').length} urgentes</div>
        </div>
        <div className="metric-card accent-info" onClick={() => setView('subventions')} style={{ cursor: 'pointer' }}>
          <div className="metric-label">Subventions pipeline</div>
          <div className="metric-value">{data?.nb_subventions || 0}</div>
          <div className="metric-sub">toutes associations</div>
        </div>
      </div>

      <div className="grid-2" style={{ marginBottom: 16 }}>
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">Prochaines échéances</div>
              <div className="card-subtitle">Issues des alertes de conformité</div>
            </div>
          </div>
          {(() => {
            const upcoming = (data?.alertes || [])
              .filter(a => a.date_expiration && a.statut !== 'OK' && a.statut !== '—')
              .sort((a, b) => new Date(a.date_expiration) - new Date(b.date_expiration))
              .slice(0, 5);
            if (upcoming.length === 0) return (
              <div className="empty" style={{ padding: '20px 0' }}>
                <div className="empty-text">Aucune échéance — renseignez les dates dans les Excel sur Drive.</div>
              </div>
            );
            return upcoming.map((a, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <AlertDot statut={a.statut} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 500 }}>{a.organisme}</div>
                  <div style={{ fontSize: 11, color: 'var(--text3)' }}>{a.client}</div>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text2)', whiteSpace: 'nowrap' }}>
                  {new Date(a.date_expiration).toLocaleDateString('fr-FR')}
                </div>
              </div>
            ));
          })()}
        </div>

        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">Alertes conformité</div>
              <div className="card-subtitle">Toutes associations</div>
            </div>
            <button className="btn" onClick={() => setView('alertes')} style={{ fontSize: 12 }}>Voir tout</button>
          </div>
          {(data?.alertes || []).slice(0, 5).map((a, i) => (
            <div key={i} className="alert-row">
              <AlertDot statut={a.statut} />
              <div>
                <div className="alert-label">{a.organisme}</div>
                <div className="alert-sub">{a.client} {a.date_expiration ? `— ${a.date_expiration}` : ''}</div>
              </div>
              <Badge statut={a.statut} />
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-header">
          <div>
            <div className="card-title">Tâches en attente</div>
            <div className="card-subtitle">Créées par l'agent IA ou manuellement</div>
          </div>
          <button className="btn" onClick={() => setView('taches')} style={{ fontSize: 12 }}>Voir tout</button>
        </div>
        {tachesEnCours.slice(0, 3).map(t => (
          <div key={t.id} className="task-row">
            <div className="task-check" />
            <div className="task-body">
              <div className="task-title">{t.titre}</div>
              <div className="task-meta">{t.client} · Source : {t.source} · Deadline : {t.date}</div>
            </div>
            <Badge statut={t.priorite} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Client detail view ────────────────────────────────────────────────────────

function ClientDetailView({ slug, onBack, onRefresh }) {
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('infos');
  const [showNewProject, setShowNewProject] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [selectedProjet, setSelectedProjet] = useState(null);

  function load() {
    setLoading(true);
    fetch(`${API}/clients/${slug}`)
      .then(r => r.json())
      .then(d => { setDetail(d); setLoading(false); })
      .catch(() => setLoading(false));
  }

  function handleSaved(updatedMeta) {
    if (updatedMeta && updatedMeta.client_data) {
      setDetail(updatedMeta);
    } else {
      load();
    }
    if (onRefresh) onRefresh();
  }

  useEffect(() => { load(); }, [slug]);

  if (loading) return <div className="empty"><div className="empty-text">Chargement...</div></div>;
  if (!detail) return <div className="empty"><div className="empty-text">Client introuvable.</div></div>;

  const cd = detail.client_data || {};
  const projets = detail.projets || [];
  const typeLabel = cd.type_structure === 'sas_senegal' ? '🇸🇳 SAS OHADA — Sénégal' : '🇫🇷 Association loi 1901 — France';

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn" onClick={onBack} style={{ padding: '6px 10px' }}>← Retour</button>
        <div className="client-avatar" style={{ width: 40, height: 40, borderRadius: 10, fontSize: 15 }}>{initials(cd.nom_usuel || cd.nom_officiel || '?')}</div>
        <div>
          <div style={{ fontSize: 17, fontWeight: 600 }}>{cd.nom_usuel || cd.nom_officiel}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>{typeLabel}</div>
        </div>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setShowNewProject(true)}>+ Nouveau projet</button>
        <button className="btn" onClick={() => setShowImport(true)}>📊 Importer Excel</button>
        <button className="btn" onClick={() => setShowEdit(true)}>✏️ Modifier</button>
      </div>

      {showNewProject && <NewProjectModal slug={slug} onClose={() => setShowNewProject(false)} onCreated={() => { load(); if (onRefresh) onRefresh(); }} />}
      {showEdit && detail && <EditClientModal detail={detail} onClose={() => setShowEdit(false)} onSaved={handleSaved} onDeleted={() => { if (onRefresh) onRefresh(); onBack(); }} />}
      {showImport && <ImportExcelModal slug={slug} onClose={() => setShowImport(false)} onDone={handleSaved} />}

      {/* Tabs */}
      <div className="tabs">
        {[['infos', 'Informations'], ['projets', `Projets (${projets.length})`], ['alertes', 'Alertes'], ['documents', 'Documents'], ['historique', 'Historique']].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {/* Infos */}
      {tab === 'infos' && (
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><div className="card-title">Identité</div></div>
            {[
              ['Nom officiel', cd.nom_officiel],
              ['Nom usuel', cd.nom_usuel],
              cd.siret && ['SIRET', cd.siret],
              cd.ninea && ['NINEA', cd.ninea],
              cd.rccm && ['RCCM', cd.rccm],
              cd.date_creation && ['Date de création', cd.date_creation],
              cd.adresse_siege && ['Adresse', cd.adresse_siege],
            ].filter(Boolean).map(([label, val], i) => val && (

                <span style={{ color: 'var(--text3)' }}>{label}</span>

              </div>

          </div>

          <div className="card">

              cd.tresorier && ['Trésorier(e)', cd.tresorier],
              cd.email_contact && ['Email', cd.email_contact],
              cd.telephone && ['Téléphone', cd.telephone],
              cd.licence_type1 && ['Licence Type 1', cd.licence_type1],
              cd.licence_type2 && ['Licence Type 2', cd.licence_type2],
            ].filter(Boolean).map(([label, val], i) => val && (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span style={{ color: 'var(--text3)' }}>{label}</span>
                <span style={{ fontWeight: 500 }}>{val}</span>
              </div>
            ))}
            {cd.emails_surveillance?.length > 0 && (
              <div style={{ padding: '10px 0' }}>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.5px', fontWeight: 600 }}>📧 Emails surveillés par l'agent</div>

              <div className="client-info">

                <div className="client-meta">
                  Créé le {p.created_at?.slice(0, 10)}
                  {p.lieu && ` · ${p.lieu}`}
                  {p.dates?.debut && ` · ${p.dates.debut}`}
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <Badge statut={
                  p.statut === 'realise' ? 'OK' :
                  p.statut === 'depose' ? 'Attention' :
                  p.statut === 'en_construction' ? 'Normal' : 'Normal'

                <span style={{ fontSize: 18, color: 'var(--text3)' }}>›</span>
              </div>
            </div>

        </div>
      )}

      {/* Détail projet */}
      {tab === 'projets' && selectedProjet && (
        <ProjetDetailView

          clientMeta={detail}
          onBack={() => setSelectedProjet(null)}

            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <a href={`https://drive.google.com/drive/folders/${detail.drive_folder_id}`} target="_blank" style={{ color: 'var(--accent)', fontSize: 13 }}>
                Ouvrir le dossier Drive →
              </a>
            </div>
          )}
        </div>
      )}

      {/* Documents */}
      {tab === 'documents' && (
        <div className="card">
          <div className="card-header">
            <div className="card-title">Fichiers Google Drive</div>
            <div className="card-subtitle">Cliquez pour ouvrir et éditer directement</div>
          </div>

          {/* Fichier association */}
          {detail.drive_asso_id && (
            <a
              href={`https://docs.google.com/spreadsheets/d/${detail.drive_asso_id}/edit`}
              target="_blank"
              rel="noopener noreferrer"
              style={{ textDecoration: 'none' }}
            >
              <div className="client-row" style={{ cursor: 'pointer' }}>
                <div className="client-avatar" style={{ background: '#E8F5E9', color: '#2E7D32', borderRadius: 8, fontSize: 12 }}>XLS</div>
                <div className="client-info">
                  <div className="client-name">Fiche Association / Structure</div>
                  <div className="client-meta">Identité, caisses, finances, RH, dashboard alertes</div>
                </div>
                <span style={{ fontSize: 12, color: 'var(--accent)' }}>Ouvrir dans Sheets →</span>
              </div>
            </a>
          )}

          {/* Budgets projets */}
          {(detail.projets || []).map((p, i) => (
            <div key={i}>
              <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.5px', padding: '10px 0 6px', borderTop: i > 0 ? '1px solid var(--border)' : 'none' }}>
                📋 {p.nom}
              </div>
              <a href={`https://drive.google.com/drive/folders/${detail.drive_projets_folder_id}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer', paddingLeft: 8 }}>
                  <div className="client-avatar" style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 8, fontSize: 11 }}>PRO</div>
                  <div className="client-info">
                    <div className="client-name">Fiche prospect — {p.nom}</div>
                    <div className="client-meta">Collecte infos · Artistes · Faisabilité</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Sheets →</span>
                </div>
              </a>
              <a href={`https://drive.google.com/drive/folders/${detail.drive_projets_folder_id}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>

            <div className="card-subtitle">Toutes les opérations sur ce dossier</div>
          </div>
          {(() => {
            const history = detail?.timestamps?.history || [];
            const labels = {
              creation_dossier: '📁 Dossier créé',
              creation_projet: '📋 Projet créé',
              modification_infos: '✏️ Infos modifiées',
              upload_excel: '📊 Excel mis à jour',
              suppression: '🗑 Suppression',
              tache_creee: '✅ Tâche créée',
              tache_validee: '✔️ Tâche validée',
            };
            if (history.length === 0) return (
              <div className="empty"><div className="empty-text">Aucun événement enregistré.</div></div>
            );
            return [...history].reverse().map((evt, i) => (
              <div key={i} className="alert-row">
                <div style={{ flex: 1 }}>
                  <div className="alert-label">{labels[evt.event] || evt.event}</div>
                  <div className="alert-sub">
                    {new Date(evt.at).toLocaleString('fr-FR')}
                    {evt.details?.nom_projet && ` — ${evt.details.nom_projet}`}
                    {evt.details?.champs_modifiés?.length > 0 && ` — ${evt.details.champs_modifiés.join(', ')}`}
                  </div>
                </div>
              </div>
            ));
          })()}

      )}

// ── Vue détail projet ─────────────────────────────────────────────────────────

function ProjetDetailView({ projet, clientMeta, onBack, onRefresh, driveProjetsFolderId }) {
  const [tab, setTab] = useState('infos');
  const [subventions, setSubventions] = useState(projet.subventions || []);
  const [showAddSub, setShowAddSub] = useState(false);
  const [statut, setStatut] = useState(projet.statut || 'en_construction');
  const [savingStatut, setSavingStatut] = useState(false);
  const [syncing, setSyncing] = useState(false);

  const cd = clientMeta.client_data || {};
  const slug = clientMeta.slug;

  const STATUTS = [
    { val: 'en_construction', label: 'En construction', color: 'badge-gray' },
    { val: 'en_cours', label: 'En cours', color: 'badge-info' },
    { val: 'depose', label: 'Déposé', color: 'badge-warn' },
    { val: 'realise', label: 'Réalisé', color: 'badge-green' },
    { val: 'archive', label: 'Archivé', color: 'badge-gray' },
  ];

  const SUB_STATUTS = ['À préparer', 'Déposée', 'En instruction', 'Accordée', 'Refusée', 'Versée'];

  async function saveStatut(newStatut) {
    setSavingStatut(true);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/statut`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
      setStatut(newStatut);
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
    finally { setSavingStatut(false); }
  }

  async function addSubvention(sub) {
    const updated = [...subventions, { ...sub, id: Date.now() }];
    setSubventions(updated);
    setShowAddSub(false);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub),
      });
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
  }

  async function updateSubStatut(id, newStatut) {
    setSubventions(prev => prev.map(s => s.id === id ? { ...s, statut: newStatut } : s));
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
    } catch (e) { console.error(e); }
  }

  const totalDemande = subventions.reduce((s, x) => s + (Number(x.montant_demande) || 0), 0);
  const totalAccorde = subventions.reduce((s, x) => s + (Number(x.montant_accorde) || 0), 0);

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn" onClick={onBack} style={{ padding: '6px 10px' }}>← Projets</button>
        <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, width: 40, height: 40 }}>
          {projet.nom?.slice(0, 2).toUpperCase()}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{projet.nom}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>
            {cd.nom_usuel || cd.nom_officiel}
            {projet.lieu && ` · ${projet.lieu}`}
            {projet.dates?.debut && ` · ${projet.dates.debut}`}
          </div>
        </div>
        {/* Sélecteur statut */}
        <select
          value={statut}
          onChange={e => saveStatut(e.target.value)}
          disabled={savingStatut}
          style={{ padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border2)', fontSize: 12, background: 'var(--surface)', cursor: 'pointer' }}
        >
          {STATUTS.map(s => <option key={s.val} value={s.val}>{s.label}</option>)}
        </select>
      </div>

      <div className="tabs">
        {[['infos', 'Informations'], ['subventions', `Subventions (${subventions.length})`], ['fichiers', 'Fichiers Drive'], ['artistes', 'Artistes']].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {/* Infos */}
      {tab === 'infos' && (
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><div className="card-title">Détails du projet</div></div>
            {[
              ['Nom', projet.nom],
              ['Lieu', projet.lieu],
              ['Date début', projet.dates?.debut],
              ['Date fin', projet.dates?.fin],
              ['Code AAP', projet.code_aap],
              ['Statut', STATUTS.find(s => s.val === statut)?.label],
              ['Créé le', projet.created_at?.slice(0, 10)],
            ].filter(([, v]) => v).map(([label, val], i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span style={{ color: 'var(--text3)' }}>{label}</span>
                <span style={{ fontWeight: 500 }}>{val}</span>
              </div>
            ))}
          </div>
          <div className="card">
            <div className="card-header"><div className="card-title">Synthèse financière</div></div>
            <div className="metric-card" style={{ marginBottom: 10 }}>
              <div className="metric-label">Total demandé</div>
              <div className="metric-value" style={{ fontSize: 20 }}>{totalDemande.toLocaleString('fr-FR')} €</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Total accordé</div>
              <div className="metric-value" style={{ fontSize: 20, color: 'var(--accent)' }}>{totalAccorde.toLocaleString('fr-FR')} €</div>
            </div>
            {totalDemande > 0 && (
              <div style={{ marginTop: 10 }}>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 4 }}>Taux d'obtention</div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${Math.min(100, totalAccorde / totalDemande * 100)}%`, background: 'var(--accent-mid)' }} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>{Math.round(totalAccorde / totalDemande * 100)}%</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Subventions */}
      {tab === 'subventions' && (
        <div>
          <div className="section-header">
            <div className="section-title" style={{ fontSize: 14 }}>Demandes de subvention</div>
            <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowAddSub(true)}>+ Ajouter</button>
          </div>
          <div className="card">
            {subventions.length === 0 && (
              <div className="empty"><div className="empty-text">Aucune demande. Ajoutez les financeurs sollicités.</div></div>
            )}
            {subventions.map((s, i) => (
              <div key={i} className="client-row">
                <div className="client-avatar" style={{ background: 'var(--accent-light)', color: 'var(--accent)', borderRadius: 8, fontSize: 11 }}>
                  {s.financeur?.slice(0, 3).toUpperCase()}
                </div>
                <div className="client-info">
                  <div className="client-name">{s.financeur}</div>
                  <div className="client-meta">
                    Demandé : {Number(s.montant_demande || 0).toLocaleString('fr-FR')} €
                    {s.montant_accorde && ` · Accordé : ${Number(s.montant_accorde).toLocaleString('fr-FR')} €`}
                    {s.deadline && ` · Deadline : ${s.deadline}`}
                  </div>
                </div>
                <select
                  value={s.statut || 'À préparer'}
                  onChange={e => updateSubStatut(s.id, e.target.value)}
                  style={{ padding: '4px 8px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border2)', fontSize: 11, background: 'var(--surface)' }}
                >
                  {SUB_STATUTS.map(st => <option key={st} value={st}>{st}</option>)}
                </select>
              </div>
            ))}
          </div>

          {showAddSub && <AddSubventionModal onClose={() => setShowAddSub(false)} onAdd={addSubvention} />}
        </div>
      )}

      {/* Fichiers Drive */}
      {tab === 'fichiers' && (
        <div>
          <div className="card" style={{ marginBottom: 12 }}>
            <div className="card-header">
              <div className="card-title">Fichiers Google Drive</div>
              <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setSyncing(true)}>
                🔄 Synchroniser
              </button>
            </div>

            {projet.drive?.fiche_prospect_id ? (

// ── Modal synchronisation Excel ───────────────────────────────────────────────

function SyncModal({ projet, clientMeta, onClose, onTaskCreated }) {
  const [step, setStep] = useState('confirm'); // confirm | loading | result
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const slug = clientMeta.slug;

  async function runSync() {
    setStep('loading');
    try {
      const res = await fetch(`${API}/clients/${slug}/projets/${projet.slug}/sync`, {
        method: 'POST',
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setResult(data);
      setStep('result');
    } catch (e) {
      setError(e.message);
      setStep('confirm');
    }
  }

  async function valider() {
    try {
      await fetch(`${API}/taches/${result.task_id}/valider`, { method: 'POST' });
      onTaskCreated();
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">🔄 Synchroniser les Excel</div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {step === 'confirm' && (
          <>
            <div className="modal-sub">
              Claude va analyser les deux fichiers Excel du projet et l'Excel Association, vérifier la cohérence des données, et proposer les mises à jour nécessaires.
            </div>
            <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', fontSize: 13, marginBottom: 16 }}>
              <div style={{ fontWeight: 500, marginBottom: 8 }}>Ce qui sera vérifié :</div>
              <div style={{ color: 'var(--text2)', lineHeight: 1.8 }}>
                • Les infos de l'Association (SIRET, nom, contacts) sont-elles à jour dans le Dossier Subvention ?<br/>
                • Les taux de charges correspondent-ils aux paramètres actuels ?<br/>
                • Le bilan de l'Association reflète-t-il les données du projet ?<br/>
                • Des informations manquantes ou incohérentes ?
              </div>
            </div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16 }}>
              📖 <a href="https://docs.google.com/spreadsheets" target="_blank" style={{ color: 'var(--accent)' }}>Consulter la documentation de synchronisation</a> pour comprendre les règles appliquées.
            </div>
            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Annuler</button>
              <button className="btn btn-primary" onClick={runSync}>Lancer l'analyse →</button>
            </div>
          </>
        )}

        {step === 'loading' && (
          <div className="empty" style={{ padding: '40px 0' }}>
            <div style={{ fontSize: 24, marginBottom: 12 }}>⏳</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Claude analyse les fichiers…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Lecture des Excel Association + Projet en cours</div>
          </div>
        )}

        {step === 'result' && result && (
          <>
            <div style={{ background: result.nb_ecarts > 0 ? 'var(--warn-light)' : 'var(--accent-light)', borderRadius: 6, padding: '10px 14px', marginBottom: 14, fontSize: 13 }}>
              {result.nb_ecarts > 0
                ? <><strong>{result.nb_ecarts} écart(s) détecté(s)</strong> — une tâche de validation a été créée</>
                : <><strong>✅ Tout est synchronisé</strong> — aucune modification nécessaire</>
              }
            </div>

            {result.ecarts && result.ecarts.length > 0 && (
              <div style={{ maxHeight: 250, overflowY: 'auto', marginBottom: 14 }}>
                {result.ecarts.map((e, i) => (
                  <div key={i} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                    <div style={{ fontWeight: 500 }}>{e.description}</div>
                    <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{e.fichier} · {e.champ}</div>
                    {e.valeur_asso && <div style={{ fontSize: 12, color: 'var(--accent)', marginTop: 2 }}>Association : {e.valeur_asso} → Projet : {e.valeur_projet}</div>}
                  </div>
                ))}
              </div>
            )}

            {result.analyse_claude && (
              <div style={{ background: 'var(--surface2)', borderRadius: 6, padding: '10px 14px', fontSize: 12, color: 'var(--text2)', marginBottom: 14 }}>
                <div style={{ fontWeight: 600, marginBottom: 4 }}>Analyse Claude :</div>
                {result.analyse_claude}
              </div>
            )}

            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Fermer</button>
              {result.task_id && (
                <button className="btn btn-primary" onClick={valider}>
                  ✓ Valider et appliquer →
                </button>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Tâches view ───────────────────────────────────────────────────────────────

function TachesView({ taches, setTaches }) {
  const [filter, setFilter] = useState('all');

  const filtered = taches.filter(t => {
    if (filter === 'pending') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  function toggle(id) {
    setTaches(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
    const task = taches.find(t => t.id === id);
    if (task) {
      fetch(`${API}/taches/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !task.done }),
      }).catch(() => {});
    }
  }

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Tâches</div>
        <button className="btn btn-primary">+ Nouvelle tâche</button>
      </div>
      <div className="tabs">
        {[['all', 'Toutes'], ['pending', 'En cours'], ['done', 'Terminées']].map(([k, l]) => (
          <button key={k} className={`tab ${filter === k ? 'active' : ''}`} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>
      <div className="card">
        {filtered.map(t => (
          <div key={t.id} className="task-row">
            <div className={`task-check ${t.done ? 'done' : ''}`} onClick={() => toggle(t.id)}>
              {t.done && <svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" /></svg>}
            </div>
            <div className="task-body" style={{ opacity: t.done ? 0.45 : 1 }}>
              <div className="task-title" style={{ textDecoration: t.done ? 'line-through' : 'none' }}>{t.titre}</div>
              <div className="task-meta">{t.client} · Source : {t.source} · Deadline : {t.date}</div>
            </div>
            <Badge statut={t.done ? 'OK' : t.priorite} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Modal nouveau client ──────────────────────────────────────────────────────

function NewClientModal({ onClose, onCreated }) {
  const [form, setForm] = useState({
    type_structure: '',
    nom_officiel: '', nom_usuel: '',
    siret: '', ninea: '', rccm: '',
    president: '', email_contact: '', telephone: '',
    adresse_siege: '', licence_type1: ''
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  function set(k, v) { setForm(prev => ({ ...prev, [k]: v })); }

  const TYPES = [
    { value: 'asso_france', label: '🇫🇷 Association loi 1901 — France' },
    { value: 'sas_senegal', label: '🇸🇳 SAS OHADA — Sénégal' },
  ];

  const isFrance = form.type_structure === 'asso_france';
  const isSenegal = form.type_structure === 'sas_senegal';
  const typeSelected = isFrance || isSenegal;

  async function submit() {
    if (!form.type_structure) { setError('Sélectionnez un type de structure.'); return; }
    if (!form.nom_officiel) { setError('Nom officiel obligatoire.'); return; }
    setLoading(true);
    try {
      const res = await fetch(`${API}/clients`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      if (!res.ok) throw new Error(await res.text());
      onCreated();
      onClose();
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Nouveau dossier client</div>
        <div className="modal-sub">Les Excel seront générés et synchronisés sur Google Drive automatiquement.</div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {/* Sélecteur type de structure */}
        <div className="form-group">
          <label className="form-label">Type de structure *</label>
          <div style={{ display: 'flex', gap: 8 }}>
            {TYPES.map(t => (
              <div
                key={t.value}
                onClick={() => set('type_structure', t.value)}
                style={{
                  flex: 1, padding: '10px 12px', borderRadius: 'var(--radius-sm)',
                  border: `1.5px solid ${form.type_structure === t.value ? 'var(--accent-mid)' : 'var(--border2)'}`,
                  background: form.type_structure === t.value ? 'var(--accent-light)' : 'var(--surface)',
                  cursor: 'pointer', fontSize: 13, fontWeight: form.type_structure === t.value ? 500 : 400,
                  color: form.type_structure === t.value ? 'var(--accent)' : 'var(--text)',
                  transition: 'all 0.15s',
                }}
              >
                {t.label}
              </div>
            ))}
          </div>
        </div>

        {typeSelected && <>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Nom officiel *</label>
              <input className="form-input" value={form.nom_officiel} onChange={e => set('nom_officiel', e.target.value)} placeholder={isFrance ? "Association XYZ" : "SAS XYZ"} />
            </div>
            <div className="form-group">
              <label className="form-label">Nom usuel / commercial</label>
              <input className="form-input" value={form.nom_usuel} onChange={e => set('nom_usuel', e.target.value)} />
            </div>
          </div>

          <div className="form-grid">
            {isFrance && <>
              <div className="form-group">
                <label className="form-label">SIRET</label>
                <input className="form-input" value={form.siret} onChange={e => set('siret', e.target.value)} placeholder="12345678900000" />
              </div>
              <div className="form-group">
                <label className="form-label">Licence spectacle (Type 1)</label>
                <input className="form-input" value={form.licence_type1} onChange={e => set('licence_type1', e.target.value)} placeholder="PLATESV-D-20XX-XXXXXX" />

            </>}
            {isSenegal && <>
              <div className="form-group">
                <label className="form-label">NINEA</label>
                <input className="form-input" value={form.ninea} onChange={e => set('ninea', e.target.value)} placeholder="NINEA Sénégal" />
              </div>
              <div className="form-group">
                <label className="form-label">N° RCCM</label>
                <input className="form-input" value={form.rccm} onChange={e => set('rccm', e.target.value)} placeholder="SN-DKR-20XX-..." />

  alertes: <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" className="nav-icon"><path d="M8 1L1 14h14L8 1z"/><line x1="8" y1="6" x2="8" y2="9"/><circle cx="8" cy="12" r="0.5" fill="currentColor"/></svg>,
};

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState('dashboard');
  const [selectedClient, setSelectedClient] = useState(null);
  const [data, setData] = useState({ nb_clients: 0, nb_alertes_urgentes: 0, clients: [], alertes: [] });
  const [taches, setTaches] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [showImport, setShowImport] = useState(false);

  async function fetchTaches() {
    try {
      const res = await fetch(`${API}/taches`);
      if (res.ok) {
        const data = await res.json();
        if (data.length > 0) setTaches(data);
      }
    } catch { /* utilise le mock */ }
  }

  async function fetchDashboard() {
    try {
      const res = await fetch(`${API}/dashboard`);
      if (res.ok) setData(await res.json());
    } catch { /* utilise le mock */ }
  }

  useEffect(() => {
    fetchDashboard();
    fetchTaches();
    // Rafraîchit toutes les 2 minutes
    const interval = setInterval(() => {
      fetchDashboard();
      fetchTaches();
    }, 120000);
    return () => clearInterval(interval);
  }, []);

  const urgentCount = taches.filter(t => !t.done && t.priorite === 'URGENT').length;

  const navItems = [
    { key: 'dashboard', label: 'Tableau de bord', icon: icons.dashboard },
    { key: 'clients', label: 'Dossiers clients', icon: icons.clients },
    { key: 'taches', label: 'Tâches', icon: icons.taches, badge: urgentCount || null },
    { key: 'subventions', label: 'Subventions', icon: icons.subventions },
    { key: 'alertes', label: 'Alertes', icon: icons.alertes, badge: data?.nb_alertes_urgentes || null },
  ];

  const titles = { dashboard: 'Tableau de bord', clients: 'Dossiers clients', taches: 'Tâches', subventions: 'Pipeline subventions', alertes: 'Alertes conformité' };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1>PauseKreyol</h1>
          <p>Administration culturelle</p>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">
            {navItems.map(item => (
              <button key={item.key} className={`nav-item ${view === item.key ? 'active' : ''}`} onClick={() => { setView(item.key); setSelectedClient(null); }}>
                {item.icon}
                {item.label}
                {item.badge ? <span className="nav-badge">{item.badge}</span> : null}
              </button>
            ))}
          </div>
        </nav>
        <div className="sidebar-bottom">
          <div className="user-chip">
            <div className="avatar">PK</div>
            <div>
              <div className="user-name">Pause Kreyol</div>
              <div className="user-role">Admin de production</div>
            </div>
          </div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div className="topbar-title">{titles[view]}</div>
          <div className="topbar-right">
            {view === 'clients' && !selectedClient && <>
              <button className="btn" onClick={() => setShowImport(true)}>📥 Importer un Excel</button>
              <button className="btn btn-primary" onClick={() => setShowModal(true)}>+ Nouveau client</button>
            </>}
          </div>
        </header>

        <main className="content">
          {view === 'dashboard' && <DashboardView data={data} taches={taches} onNewClient={() => setShowModal(true)} setView={setView} />}
          {view === 'clients' && !selectedClient && <ClientsView clients={data?.clients || []} onNewClient={() => setShowModal(true)} onOpenClient={slug => setSelectedClient(slug)} />}
          {view === 'clients' && selectedClient && <ClientDetailView slug={selectedClient} onBack={() => setSelectedClient(null)} onRefresh={fetchDashboard} />}
          {view === 'taches' && <TachesView taches={taches} setTaches={setTaches} />}
          {view === 'subventions' && <SubventionsView />}
          {view === 'alertes' && <AlertesView data={data} />}
        </main>
      </div>

      {showModal && <NewClientModal onClose={() => setShowModal(false)} onCreated={fetchDashboard} />}
      {showImport && <ImportExcelModal slug={null} onClose={() => setShowImport(false)} onDone={() => { fetchDashboard(); setShowImport(false); }} />}
    </div>
  );
}

// ── Modal import Excel ────────────────────────────────────────────────────────

function ImportExcelModal({ slug, onClose, onDone }) {
  const [step, setStep] = useState('upload'); // upload → preview → done
  const [parsed, setParsed] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const isUpdate = !!slug;

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    setError('');
    try {
      const formData = new FormData();
      formData.append('file', file);
      const url = isUpdate
        ? `${API}/import/update-client/${slug}`
        : `${API}/import/parse`;
      const res = await fetch(url, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setParsed(data);
      setStep('preview');
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  async function confirm() {
    setLoading(true);
    try {
      if (isUpdate) {
        // Applique les modifications
        const updates = {};
        Object.entries(parsed.modifications || {}).forEach(([k, v]) => {
          updates[k] = v['après'];
        });
        const res = await fetch(`${API}/clients/${slug}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        if (!res.ok) throw new Error(await res.text());
        const updated = await res.json();
        onDone(updated);
      } else {
        // Crée le client — re-upload le fichier
        const input = document.getElementById('excel-import-input');
        const formData = new FormData();
        formData.append('file', input.files[0]);
        const res = await fetch(`${API}/import/create-client`, { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        onDone(await res.json());
      }
      onClose();
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  const LABELS = {
    nom_officiel: 'Nom officiel', nom_usuel: 'Nom usuel', siret: 'SIRET',
    ninea: 'NINEA', rccm: 'RCCM', date_creation: 'Date création',
    adresse_siege: 'Adresse', president: 'Président(e)', tresorier: 'Trésorier(e)',
    email_contact: 'Email', telephone: 'Téléphone', licence_type1: 'Licence Type 1',
    numero_urssaf: 'N° URSSAF', numero_guso: 'N° GUSO',
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">{isUpdate ? '📊 Mettre à jour depuis un Excel' : '📥 Créer un client depuis un Excel'}</div>
        <div className="modal-sub">
          {isUpdate
            ? 'Importez une fiche client remplie — les modifications seront prévisualisées avant application.'
            : 'Importez un fichier COLLECTE_CLIENT.xlsx ou STRUCTURE_xxx.xlsx rempli par le client pour créer automatiquement son dossier.'}
        </div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {step === 'upload' && (
          <div>
            <div style={{
              border: '2px dashed var(--border2)', borderRadius: 'var(--radius)',
              padding: '30px', textAlign: 'center', cursor: 'pointer',
              background: 'var(--surface2)'
            }} onClick={() => document.getElementById('excel-import-input').click()}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>📊</div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>Cliquez pour sélectionner un fichier Excel</div>
              <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>
                FICHE_CLIENT.xlsx, STRUCTURE_xxx.xlsx (.xlsx uniquement)
              </div>
            </div>
            <input id="excel-import-input" type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleFile} />
            {loading && <div style={{ textAlign: 'center', padding: 16, color: 'var(--text3)' }}>Analyse en cours...</div>}
          </div>
        )}

        {step === 'preview' && parsed && (
          <div>
            <div style={{ background: 'var(--accent-light)', padding: '10px 14px', borderRadius: 6, marginBottom: 14, fontSize: 13 }}>
              {isUpdate
                ? <><strong>{parsed.nb_modifications}</strong> modification(s) détectée(s) — source : {parsed.source}</>
                : <><strong>{parsed.champs_importes}</strong> champ(s) importé(s) — source : {parsed.source}</>
              }
            </div>

            {isUpdate && parsed.modifications && Object.keys(parsed.modifications).length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Modifications détectées :</div>
                {Object.entries(parsed.modifications).map(([key, change], i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 12 }}>
                    <span style={{ color: 'var(--text3)', width: 140, flexShrink: 0 }}>{LABELS[key] || key}</span>
                    <span style={{ color: 'var(--danger)', textDecoration: 'line-through', flex: 1 }}>{change.avant || '—'}</span>
                    <span style={{ color: 'var(--accent)', flex: 1, fontWeight: 500 }}>→ {change['après']}</span>
                  </div>
                ))}
              </div>
            )}

            {!isUpdate && parsed.client_data && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Données extraites :</div>
                {Object.entries(parsed.client_data).slice(0, 8).map(([key, val], i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, padding: '5px 0', borderBottom: '1px solid var(--border)', fontSize: 12 }}>
                    <span style={{ color: 'var(--text3)', width: 160, flexShrink: 0 }}>{LABELS[key] || key}</span>
                    <span style={{ fontWeight: 500 }}>{val}</span>
                  </div>
                ))}
                {parsed.projet_data?.nom_projet && (
                  <div style={{ marginTop: 8, padding: '8px', background: 'var(--info-light)', borderRadius: 6, fontSize: 12 }}>
                    📋 Projet détecté : <strong>{parsed.projet_data.nom_projet}</strong> — sera créé automatiquement
                  </div>
                )}
              </div>
            )}

            {isUpdate && parsed.nb_modifications === 0 && (
              <div style={{ textAlign: 'center', padding: 20, color: 'var(--text3)', fontSize: 13 }}>
                Aucune modification détectée — le dossier est déjà à jour.
              </div>
            )}
          </div>
        )}

        <div className="modal-footer">
          <button className="btn" onClick={() => step === 'preview' ? setStep('upload') : onClose()}>
            {step === 'preview' ? '← Retour' : 'Annuler'}
          </button>
          {step === 'preview' && (isUpdate ? parsed?.nb_modifications > 0 : parsed?.champs_importes > 0) && (
            <button className="btn btn-primary" onClick={confirm} disabled={loading}>
              {loading ? 'Application...' : isUpdate ? `Appliquer ${parsed.nb_modifications} modification(s) →` : 'Créer le dossier →'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function NewProjectModal({ slug, onClose, onCreated }) {
  const [form, setForm] = useState({ nom_projet: '', date_debut_projet: '', date_fin_projet: '', lieu_projet: '', code_aap: '' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  function set(k, v) { setForm(prev => ({ ...prev, [k]: v })); }

  async function submit() {
    if (!form.nom_projet) { setError('Nom du projet obligatoire.'); return; }
    setLoading(true);
    try {
      const res = await fetch(`${API}/clients/${slug}/projets`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      if (!res.ok) throw new Error(await res.text());
      onCreated();
      onClose();
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Nouveau projet</div>
        <div className="modal-sub">Un budget Excel sera généré et synchronisé sur Drive.</div>
        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}
        <div className="form-group">
          <label className="form-label">Nom du projet *</label>
          <input className="form-input" value={form.nom_projet} onChange={e => set('nom_projet', e.target.value)} placeholder="Bastet Festival #6 — Oct 2027" autoFocus />
        </div>
        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Date de début</label>
            <input className="form-input" type="date" value={form.date_debut_projet} onChange={e => set('date_debut_projet', e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Date de fin</label>
            <input className="form-input" type="date" value={form.date_fin_projet} onChange={e => set('date_fin_projet', e.target.value)} />
          </div>
        </div>
        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Lieu</label>
            <input className="form-input" value={form.lieu_projet} onChange={e => set('lieu_projet', e.target.value)} placeholder="La Place, Paris" />
          </div>
          <div className="form-group">
            <label className="form-label">Code appel à projets</label>
            <input className="form-input" value={form.code_aap} onChange={e => set('code_aap', e.target.value)} placeholder="HHP27S1" />
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Création…' : 'Créer le projet →'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Modal édition client ──────────────────────────────────────────────────────

function EditClientModal({ detail, onClose, onSaved, onDeleted }) {
  const cd = detail.client_data || {};
  const [form, setForm] = useState({
    ...cd,
    emails_surveillance: (cd.emails_surveillance || []).join(', '),
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [deleteStep, setDeleteStep] = useState(0); // 0=caché, 1=première confirmation, 2=deuxième confirmation

  function set(k, v) { setForm(prev => ({ ...prev, [k]: v })); }

  async function submit() {
    setLoading(true);
    try {
      const payload = {
        ...form,
        emails_surveillance: form.emails_surveillance
          ? form.emails_surveillance.split(',').map(e => e.trim()).filter(Boolean)
          : [],
      };
      const res = await fetch(`${API}/clients/${detail.slug}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
      const updated = await res.json();
      onSaved(updated);
      onClose();
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  async function confirmDelete() {
    setLoading(true);
    try {
      const res = await fetch(`${API}/clients/${detail.slug}?confirm=SUPPRIMER`, {
        method: 'DELETE',
      });
      if (!res.ok) throw new Error(await res.text());
      onDeleted();
      onClose();
    } catch (e) {
      setError('Erreur suppression : ' + e.message);
      setDeleteStep(0);
    } finally {
      setLoading(false);
    }
  }

  const isFrance = cd.type_structure === 'asso_france';

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Modifier le dossier</div>
        <div className="modal-sub">{cd.nom_usuel || cd.nom_officiel}</div>
        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Nom officiel</label>
            <input className="form-input" value={form.nom_officiel || ''} onChange={e => set('nom_officiel', e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Nom usuel</label>
            <input className="form-input" value={form.nom_usuel || ''} onChange={e => set('nom_usuel', e.target.value)} />
          </div>
        </div>

        {isFrance && <div className="form-grid">
          <div className="form-group">
            <label className="form-label">SIRET</label>
            <input className="form-input" value={form.siret || ''} onChange={e => set('siret', e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Licence Type 1</label>
            <input className="form-input" value={form.licence_type1 || ''} onChange={e => set('licence_type1', e.target.value)} />
          </div>
        </div>}

        <div className="form-group">
          <label className="form-label">{isFrance ? 'Président(e)' : 'Directeur(rice) Général(e)'}</label>
          <input className="form-input" value={form.president || ''} onChange={e => set('president', e.target.value)} />
        </div>
        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Email principal</label>
            <input className="form-input" value={form.email_contact || ''} onChange={e => set('email_contact', e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Téléphone</label>
            <input className="form-input" value={form.telephone || ''} onChange={e => set('telephone', e.target.value)} />
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Adresse du siège</label>
          <input className="form-input" value={form.adresse_siege || ''} onChange={e => set('adresse_siege', e.target.value)} />
        </div>

        <div className="divider" />

        <div className="form-group">
          <label className="form-label">📧 Emails surveillés par l'agent IA</label>
          <input
            className="form-input"
            value={form.emails_surveillance || ''}
            onChange={e => set('emails_surveillance', e.target.value)}
            placeholder="contact@asso.fr, artiste@gmail.com, ..."
          />
          <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 4 }}>
            Sépare les adresses par des virgules. L'agent rattachera automatiquement les mails reçus de ces adresses à ce client.
          </div>
        </div>

        <div className="modal-footer" style={{ justifyContent: 'space-between' }}>
          {/* Zone suppression */}
          <div>
            {deleteStep === 0 && (
              <button className="btn" style={{ color: 'var(--danger)', borderColor: 'var(--danger)' }} onClick={() => setDeleteStep(1)}>
                🗑 Supprimer
              </button>
            )}
            {deleteStep === 1 && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: 'var(--danger)' }}>Archiver et supprimer définitivement ?</span>
                <button className="btn" style={{ fontSize: 12 }} onClick={() => setDeleteStep(0)}>Non</button>
                <button className="btn" style={{ fontSize: 12, color: 'var(--danger)', borderColor: 'var(--danger)' }} onClick={() => setDeleteStep(2)}>Oui, continuer</button>
              </div>
            )}
            {deleteStep === 2 && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: 'var(--danger)', fontWeight: 500 }}>⚠️ Dernière confirmation — cette action est irréversible</span>
                <button className="btn" style={{ fontSize: 12 }} onClick={() => setDeleteStep(0)}>Annuler</button>
                <button className="btn" style={{ fontSize: 12, background: 'var(--danger)', color: 'white', borderColor: 'var(--danger)' }} onClick={confirmDelete} disabled={loading}>
                  {loading ? '...' : 'Supprimer définitivement'}
                </button>
              </div>
            )}
          </div>

          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn" onClick={onClose}>Annuler</button>
            <button className="btn btn-primary" onClick={submit} disabled={loading}>
              {loading ? 'Sauvegarde…' : 'Sauvegarder →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
