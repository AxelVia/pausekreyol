<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PauseKreyol</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --border: #E4E0D8;
      --border2: #CCC9BF;
      --text: #1A1916;
      --text2: #6B6860;
      --text3: #9C9A94;
      --accent: #2D5016;
      --accent-light: #EBF2E3;
      --accent-mid: #5A8A32;
      --warn: #92400E;
      --warn-light: #FEF3C7;
      --danger: #7F1D1D;
      --danger-light: #FEE2E2;
      --info: #1E3A5F;
      --info-light: #DBEAFE;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout */
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.3px;
    }
    .sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .sidebar-nav { padding: 12px 10px; flex: 1; }
    .nav-section { margin-bottom: 16px; }
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text2);
      transition: all 0.15s;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
    }
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .user-name { font-size: 12px; font-weight: 500; }
    .user-role { font-size: 11px; color: var(--text3); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface2); }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #243F12; }

    .content { padding: 24px 28px; flex: 1; overflow-y: auto; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }

    /* Metric cards */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .metric-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 26px; font-weight: 500; margin-top: 4px; letter-spacing: -1px; }
    .metric-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .metric-card.accent-green { border-left: 3px solid var(--accent-mid); }
    .metric-card.accent-warn { border-left: 3px solid #D97706; }
    .metric-card.accent-danger { border-left: 3px solid #DC2626; }
    .metric-card.accent-info { border-left: 3px solid #3B82F6; }
    .metric-card[style*="cursor: pointer"]:hover, .metric-card[style*="cursor:pointer"]:hover {
      background: var(--surface2);
      transform: translateY(-1px);
      transition: all 0.15s;
    }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-green { background: var(--accent-light); color: var(--accent); }
    .badge-warn { background: var(--warn-light); color: var(--warn); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-info { background: var(--info-light); color: var(--info); }
    .badge-gray { background: var(--surface2); color: var(--text2); }

    /* Client list */
    .client-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .client-row:last-child { border-bottom: none; }
    .client-row:hover { opacity: 0.75; }
    .client-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .client-info { flex: 1; min-width: 0; }
    .client-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .client-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .client-right { text-align: right; flex-shrink: 0; }

    /* Alert list */
    .alert-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .alert-row:last-child { border-bottom: none; }
    .alert-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .dot-danger { background: #DC2626; }
    .dot-warn { background: #D97706; }
    .dot-ok { background: var(--accent-mid); }
    .dot-gray { background: var(--text3); }
    .alert-label { font-size: 13px; font-weight: 500; }
    .alert-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }

    /* Progress bar */
    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; display: block; }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s;
    }
    .form-input:focus { outline: none; border-color: var(--accent-mid); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* Pipeline subventions */
    .pipeline { display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; }
    .pipeline-col { flex: 1; min-width: 110px; }
    .pipeline-header {
      font-size: 11px; font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 0 8px;
      white-space: nowrap;
    }
    .pipeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .pipeline-card-name { font-weight: 500; }
    .pipeline-card-sub { color: var(--text3); margin-top: 2px; font-size: 11px; }

    /* Calendar strip */
    .calendar-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .cal-day {
      flex-shrink: 0;
      width: 40px;
      text-align: center;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .cal-day-name { font-size: 10px; color: var(--text3); text-transform: uppercase; }
    .cal-day-num { font-size: 15px; font-weight: 500; margin-top: 2px; }
    .cal-day.today { background: var(--accent); color: white; }
    .cal-day.today .cal-day-name { color: rgba(255,255,255,0.7); }
    .cal-day.has-event { position: relative; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-mid); margin: 3px auto 0; }
    .cal-day.today .cal-dot { background: white; }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    .empty-text { font-size: 13px; }

    /* Tâches */
    .task-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-check {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border2);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: var(--accent); border-color: var(--accent); }
    .task-body { flex: 1; }
    .task-title { font-size: 13px; font-weight: 500; }
    .task-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-right { flex-shrink: 0; }

    /* Section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title { font-size: 15px; font-weight: 600; }

    /* ── RESPONSIVE MOBILE ─────────────────────────────────────────────── */
    @media (max-width: 768px) {

      /* Layout : sidebar cachée, nav en bas */
      .app { flex-direction: column; }

      .sidebar {
        display: none; /* cachée sur mobile */
      }

      .main { flex: 1; padding-bottom: 64px; } /* espace pour la nav du bas */

      /* Topbar allégée */
      .topbar {
        padding: 0 16px;
        height: 48px;
      }
      .topbar-title { font-size: 14px; }

      /* Masque tous les boutons d'action en mode mobile (read-only) */
      .topbar-right { display: none; }
      .btn-primary { display: none !important; }
      button.btn:not(.btn-tab):not(.btn-back):not(.btn-toggle) { display: none; }

      /* Contenu */
      .content { padding: 12px; }

      /* Grilles : tout en colonne */
      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: 1fr !important;
        gap: 10px;
      }

      /* Cards */
      .card { padding: 12px; border-radius: 8px; margin-bottom: 10px; }
      .card-header { flex-wrap: wrap; gap: 6px; }

      /* Métriques */
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px;
      }
      .metric-card { padding: 12px; }
      .metric-value { font-size: 22px; }

      /* Rows clients/tâches */
      .client-row { padding: 10px 0; }
      .client-right { display: none; } /* masque badge + date sur mobile */

      /* Tabs */
      .tabs { overflow-x: auto; white-space: nowrap; padding-bottom: 2px; gap: 4px; }
      .tab { padding: 6px 12px; font-size: 12px; }

      /* Modal : plein écran sur mobile */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }
      .modal {
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 16px 16px 0 0;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px 16px 32px;
      }
      .modal-footer { flex-direction: column-reverse; gap: 8px; }
      .modal-footer .btn { width: 100%; justify-content: center; }

      /* Pipeline subventions */
      .pipeline { flex-direction: column; }
      .pipeline-col { min-width: unset; }

      /* Alertes */
      .alert-row { flex-wrap: wrap; gap: 6px; }

      /* Section header */
      .section-header { margin-bottom: 12px; }
      .section-title { font-size: 14px; }

      /* Cacher le bouton retour desktop, montrer version mobile */
      .btn-back-mobile { display: flex !important; }
      /* Masque les boutons retour desktop dans les vues détail */
      .btn-desktop-back { display: none !important; }

      /* Tables dans les détails */
      table { font-size: 12px; }
    }

    /* ── BARRE DE NAVIGATION MOBILE EN BAS ─────────────────────────────── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding: 0 4px;
    }
    .mobile-nav-inner {
      display: flex;
      align-items: stretch;
      height: 100%;
    }
    .mobile-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      color: var(--text3);
      font-size: 10px;
      font-weight: 500;
      padding: 6px 4px;
      border-radius: 8px;
      transition: all 0.15s;
      position: relative;
    }
    .mobile-nav-item.active { color: var(--accent); }
    .mobile-nav-item svg { width: 20px; height: 20px; }
    .mobile-nav-badge {
      position: absolute;
      top: 4px; right: calc(50% - 14px);
      background: var(--danger);
      color: white;
      font-size: 9px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
    }

    @media (max-width: 768px) {
      .mobile-nav { display: flex; }
    }

    /* Bannière read-only sur mobile */
    .mobile-readonly-banner {
      display: none;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .mobile-readonly-banner { display: block; }
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const API = 'https://web-production-ac84a.up.railway.app';

// ── Mock data (utilisé si l'API n'est pas encore lancée) ─────────────────────
const MOCK = {

    clients: [

    { id: 2, titre: 'Dossier Mairie Paris — deadline 16 avril', client: 'House of Bastet (HOB)', priorite: 'URGENT', date: '2026-04-16', done: false, source: 'IA' },
    { id: 3, titre: 'Renouveler licence Cie Tropik', client: 'Cie Tropik', priorite: 'Attention', date: '2026-04-30', done: false, source: 'Alerte' },
    { id: 4, titre: 'Collecter statuts de Cie Tropik', client: 'Cie Tropik', priorite: 'Normal', date: '2026-05-01', done: true, source: 'Manuel' },
  ],

    ],

    ],
    'Accordée': [

};

// ── Helpers ──────────────────────────────────────────────────────────────────

function initials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function Badge({ statut }) {
  const map = {
    'EXPIRÉ': 'badge-danger',
    'URGENT': 'badge-warn',
    'Attention': 'badge-warn',
    'OK': 'badge-green',
    '—': 'badge-gray',
    'en_construction': 'badge-info',
    'Normal': 'badge-gray',
  };
  return <span className={`badge ${map[statut] || 'badge-gray'}`}>{statut}</span>;
}

function AlertDot({ statut }) {
  const map = { 'EXPIRÉ': 'dot-danger', 'URGENT': 'dot-warn', 'Attention': 'dot-warn', 'OK': 'dot-ok' };
  return <div className={`alert-dot ${map[statut] || 'dot-gray'}`} />;
}

// ── Calendar strip ────────────────────────────────────────────────────────────

function CalendarStrip() {
  const today = new Date();
  const days = [];
  for (let i = -2; i <= 12; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }
  const names = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const events = [today.getDate() + 2, today.getDate() + 7, today.getDate() + 10];

  return (
    <div className="calendar-strip">
      {days.map((d, i) => {
        const isToday = d.toDateString() === today.toDateString();
        const hasEvent = events.includes(d.getDate());
        return (
          <div key={i} className={`cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}`}>
            <div className="cal-day-name">{names[d.getDay()]}</div>
            <div className="cal-day-num">{d.getDate()}</div>
            {hasEvent && <div className="cal-dot" />}
          </div>
        );
      })}
    </div>
  );
}

// ── Client detail view ────────────────────────────────────────────────────────

function ClientDetailView({ slug, onBack, onRefresh }) {
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('infos');
  const [showNewProject, setShowNewProject] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [selectedProjet, setSelectedProjet] = useState(null);

  function load() {
    setLoading(true);
    fetch(`${API}/clients/${slug}`)
      .then(r => r.json())
      .then(d => { setDetail(d); setLoading(false); })
      .catch(() => setLoading(false));
  }

  function handleSaved(updatedMeta) {
    if (updatedMeta && updatedMeta.client_data) {
      setDetail(updatedMeta);
    } else {
      load();
    }
    if (onRefresh) onRefresh();
  }

  useEffect(() => { load(); }, [slug]);

  if (loading) return <div className="empty"><div className="empty-text">Chargement...</div></div>;
  if (!detail) return <div className="empty"><div className="empty-text">Client introuvable.</div></div>;

  const cd = detail.client_data || {};
  const projets = detail.projets || [];
  const typeLabel = cd.type_structure === 'sas_senegal' ? '🇸🇳 SAS OHADA — Sénégal' : '🇫🇷 Association loi 1901 — France';

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn btn-desktop-back" onClick={onBack} style={{ padding: '6px 10px' }}>← Retour</button>
        <div className="client-avatar" style={{ width: 40, height: 40, borderRadius: 10, fontSize: 15 }}>{initials(cd.nom_usuel || cd.nom_officiel || '?')}</div>
        <div>
          <div style={{ fontSize: 17, fontWeight: 600 }}>{cd.nom_usuel || cd.nom_officiel}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>{typeLabel}</div>
        </div>
        <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setShowNewProject(true)}>+ Nouveau projet</button>
        <button className="btn" onClick={() => setShowImport(true)}>📊 Importer Excel</button>
        <button className="btn" onClick={() => setShowEdit(true)}>✏️ Modifier</button>
      </div>

      {showNewProject && <NewProjectModal slug={slug} clientMeta={detail} onClose={() => setShowNewProject(false)} onCreated={() => { load(); if (onRefresh) onRefresh(); }} />}
      {showEdit && detail && <EditClientModal detail={detail} onClose={() => setShowEdit(false)} onSaved={handleSaved} onDeleted={() => { if (onRefresh) onRefresh(); onBack(); }} />}

                  <div className="alert-sub">
                    {new Date(evt.at).toLocaleString('fr-FR')}
                    {evt.details?.nom_projet && ` — ${evt.details.nom_projet}`}
                    {evt.details?.champs_modifiés?.length > 0 && ` — ${evt.details.champs_modifiés.join(', ')}`}
                  </div>
                </div>
              </div>
            ));
          })()}
        </div>
      )}
    </div>
  );
}

// ── Facturation par client ────────────────────────────────────────────────────

function FacturationClient({ slug, nomClient }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showNewDevis, setShowNewDevis] = useState(false);

  async function load() {
    setLoading(true);
    try {
      const [devisRes, factRes] = await Promise.all([
        fetch(`${API}/devis`),
        fetch(`${API}/factures`),
      ]);
      const allDevis = devisRes.ok ? await devisRes.json() : [];
      const allFact = factRes.ok ? await factRes.json() : [];
      setData({
        devis: allDevis.filter(d => d.client_slug === slug),
        factures: allFact.filter(f => f.client_slug === slug),
      });
    } catch {}
    setLoading(false);
  }

  useEffect(() => { load(); }, [slug]);

  const STATUT_DEVIS = {
    brouillon: { label: 'Brouillon', bg: 'var(--surface2)', color: 'var(--text3)' },
    envoyé:    { label: 'Envoyé',    bg: 'var(--info-light)', color: 'var(--info)' },
    signé:     { label: 'Signé',     bg: 'var(--warn-light)', color: 'var(--warn)' },
    validé:    { label: 'Validé',    bg: 'var(--accent-light)', color: 'var(--accent)' },
    facturé:   { label: 'Facturé',   bg: '#E8F5E9', color: '#1B5E20' },
    annulé:    { label: 'Annulé',    bg: 'var(--danger-light)', color: 'var(--danger)' },
  };
  const STATUT_FACT = {
    à_faire:   { label: 'À faire',   bg: 'var(--warn-light)',   color: 'var(--warn)' },
    envoyée:   { label: 'Envoyée',   bg: 'var(--info-light)',   color: 'var(--info)' },
    payée:     { label: 'Payée',     bg: 'var(--accent-light)', color: 'var(--accent)' },
    annulée:   { label: 'Annulée',   bg: 'var(--danger-light)', color: 'var(--danger)' },
    en_retard: { label: 'En retard', bg: 'var(--danger-light)', color: 'var(--danger)' },
  };

  function Badge({ statut, map }) {
    const s = map[statut] || { label: statut, bg: 'var(--surface2)', color: 'var(--text3)' };
    return <span style={{ background: s.bg, color: s.color, padding: '2px 8px', borderRadius: 10, fontSize: 11, fontWeight: 600 }}>{s.label}</span>;
  }

  async function changeStatut(type, id, statut) {
    await fetch(`${API}/${type}/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ statut }),
    });
    load();
  }

  async function creerFacture(devis) {
    await fetch(`${API}/factures`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ devis_id: devis.id }),
    });
    load();
  }

  if (loading) return <div className="empty"><div className="empty-text">Chargement...</div></div>;

  const devis = data?.devis || [];
  const factures = data?.factures || [];
  const totalEncaisse = factures.filter(f => f.statut === 'payée').reduce((s, f) => s + (f.total_ht || 0), 0);
  const totalAttente = factures.filter(f => ['envoyée', 'à_faire'].includes(f.statut)).reduce((s, f) => s + (f.solde_a_payer || 0), 0);

  return (
    <div>
      {/* Métriques client */}
      <div className="metrics-grid" style={{ marginBottom: 14 }}>
        <div className="metric-card accent-green">
          <div className="metric-label">CA encaissé</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{totalEncaisse.toLocaleString('fr-FR')} €</div>
        </div>
        <div className="metric-card accent-warn">
          <div className="metric-label">En attente</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{totalAttente.toLocaleString('fr-FR')} €</div>
        </div>
        <div className="metric-card">
          <div className="metric-label">Devis</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{devis.length}</div>
        </div>
        <div className="metric-card">
          <div className="metric-label">Factures</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{factures.length}</div>
        </div>
      </div>

      {/* Devis */}
      <div className="card" style={{ marginBottom: 12 }}>
        <div className="card-header">
          <div className="card-title">Devis</div>
          <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowNewDevis(true)}>+ Nouveau devis</button>
        </div>
        {devis.length === 0
          ? <div className="empty"><div className="empty-text">Aucun devis pour ce client.</div></div>
          : devis.map(d => (
            <div key={d.id} className="client-row" style={{ padding: '10px 0', alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 3 }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{d.numero}</span>
                  <Badge statut={d.statut} map={STATUT_DEVIS} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>{d.periode || '—'}</div>
                <div style={{ fontSize: 11, color: 'var(--text3)' }}>
                  {(d.prestations || []).slice(0, 2).map(p => p.description).filter(Boolean).join(' · ')}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontWeight: 700, color: 'var(--accent)', fontSize: 14 }}>{(d.total_ht || 0).toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6 }}>Acompte : {d.acompte_montant || 0} €</div>
                <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end' }}>
                  {d.statut === 'brouillon' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'envoyé')}>📤 Envoyer</button>}
                  {d.statut === 'envoyé' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'signé')}>✍️ Signé</button>}
                  {d.statut === 'signé' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'validé')}>✅ Valider</button>}
                  {['validé', 'signé'].includes(d.statut) && !d.factures_liees?.length && (
                    <button className="btn btn-primary" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => creerFacture(d)}>🧾 Facturer</button>
                  )}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {/* Factures */}
      <div className="card">
        <div className="card-header">
          <div className="card-title">Factures</div>
        </div>
        {factures.length === 0
          ? <div className="empty"><div className="empty-text">Aucune facture. Créez un devis et validez-le pour générer une facture.</div></div>
          : factures.map(f => (
            <div key={f.id} className="client-row" style={{ padding: '10px 0', alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 3 }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{f.numero}</span>
                  <Badge statut={f.statut} map={STATUT_FACT} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>{f.periode || '—'}</div>
                {f.devis_numero && <div style={{ fontSize: 11, color: 'var(--text3)' }}>Devis lié : {f.devis_numero}</div>}
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontWeight: 700, color: 'var(--accent)', fontSize: 14 }}>{(f.total_ht || 0).toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6 }}>Solde : {f.solde_a_payer || 0} €</div>
                <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end' }}>
                  {f.statut === 'à_faire' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('factures', f.id, 'envoyée')}>📤 Envoyer</button>}
                  {f.statut === 'envoyée' && <button className="btn btn-primary" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('factures', f.id, 'payée')}>✅ Payée</button>}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {showNewDevis && (
        <NewDevisModal
          onClose={() => setShowNewDevis(false)}
          onCreated={() => { load(); setShowNewDevis(false); }}
          defaultClientSlug={slug}
          defaultClientNom={nomClient}
        />
      )}
    </div>
  );
}

// ── Vue détail projet ─────────────────────────────────────────────────────────

function ProjetDetailView({ projet, clientMeta, onBack, onRefresh, driveProjetsFolderId }) {
  const [tab, setTab] = useState('infos');
  const [subventions, setSubventions] = useState(projet.subventions || []);
  const [showAddSub, setShowAddSub] = useState(false);
  const [statut, setStatut] = useState(projet.statut || 'en_construction');
  const [savingStatut, setSavingStatut] = useState(false);
  const [syncing, setSyncing] = useState(false);

  const cd = clientMeta.client_data || {};
  const slug = clientMeta.slug;

  const STATUTS = [
    { val: 'en_construction', label: 'En construction', color: 'badge-gray' },
    { val: 'en_cours', label: 'En cours', color: 'badge-info' },
    { val: 'depose', label: 'Déposé', color: 'badge-warn' },
    { val: 'realise', label: 'Réalisé', color: 'badge-green' },
    { val: 'archive', label: 'Archivé', color: 'badge-gray' },
  ];

  const SUB_STATUTS = ['À préparer', 'Déposée', 'En instruction', 'Accordée', 'Refusée', 'Versée'];

  async function saveStatut(newStatut) {
    setSavingStatut(true);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/statut`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
      setStatut(newStatut);
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
    finally { setSavingStatut(false); }
  }

  async function addSubvention(sub) {
    const updated = [...subventions, { ...sub, id: Date.now() }];
    setSubventions(updated);
    setShowAddSub(false);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub),
      });
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
  }

  async function updateSubStatut(id, newStatut) {
    setSubventions(prev => prev.map(s => s.id === id ? { ...s, statut: newStatut } : s));
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
    } catch (e) { console.error(e); }
  }

  const totalDemande = subventions.reduce((s, x) => s + (Number(x.montant_demande) || 0), 0);
  const totalAccorde = subventions.reduce((s, x) => s + (Number(x.montant_accorde) || 0), 0);

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn btn-desktop-back" onClick={onBack} style={{ padding: '6px 10px' }}>← Projets</button>
        <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, width: 40, height: 40 }}>
          {projet.nom?.slice(0, 2).toUpperCase()}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{projet.nom}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>
            {cd.nom_usuel || cd.nom_officiel}
            {projet.lieu && ` · ${projet.lieu}`}
            {projet.dates?.debut && ` · ${projet.dates.debut}`}
          </div>
        </div>
        {/* Sélecteur statut */}
        <select
          value={statut}
          onChange={e => saveStatut(e.target.value)}
          disabled={savingStatut}
          style={{ padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border2)', fontSize: 12, background: 'var(--surface)', cursor: 'pointer' }}
        >
          {STATUTS.map(s => <option key={s.val} value={s.val}>{s.label}</option>)}
        </select>
      </div>

      <div className="tabs">
        {[['infos', 'Informations'], ['subventions', `Subventions (${subventions.length})`], ['fichiers', 'Fichiers Drive'], ['artistes', 'Artistes']].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {/* Infos */}
      {tab === 'infos' && (
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><div className="card-title">Détails du projet</div></div>
            {[
              ['Nom', projet.nom],
              ['Lieu', projet.lieu],
              ['Date début', projet.dates?.debut],
              ['Date fin', projet.dates?.fin],
              ['Code AAP', projet.code_aap],
              ['Statut', STATUTS.find(s => s.val === statut)?.label],
              ['Créé le', projet.created_at?.slice(0, 10)],
            ].filter(([, v]) => v).map(([label, val], i) => (
              <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                <span style={{ color: 'var(--text3)' }}>{label}</span>
                <span style={{ fontWeight: 500 }}>{val}</span>
              </div>
            ))}
          </div>
          <div className="card">
            <div className="card-header"><div className="card-title">Synthèse financière</div></div>
            <div className="metric-card" style={{ marginBottom: 10 }}>
              <div className="metric-label">Total demandé</div>
              <div className="metric-value" style={{ fontSize: 20 }}>{totalDemande.toLocaleString('fr-FR')} €</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Total accordé</div>
              <div className="metric-value" style={{ fontSize: 20, color: 'var(--accent)' }}>{totalAccorde.toLocaleString('fr-FR')} €</div>
            </div>
            {totalDemande > 0 && (
              <div style={{ marginTop: 10 }}>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 4 }}>Taux d'obtention</div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${Math.min(100, totalAccorde / totalDemande * 100)}%`, background: 'var(--accent-mid)' }} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>{Math.round(totalAccorde / totalDemande * 100)}%</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Subventions */}
      {tab === 'subventions' && (
        <div>
          <div className="section-header">
            <div className="section-title" style={{ fontSize: 14 }}>Demandes de subvention</div>
            <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowAddSub(true)}>+ Ajouter</button>
          </div>
          <div className="card">
            {subventions.length === 0 && (
              <div className="empty"><div className="empty-text">Aucune demande. Ajoutez les financeurs sollicités.</div></div>
            )}
            {subventions.map((s, i) => (
              <div key={i} className="client-row">
                <div className="client-avatar" style={{ background: 'var(--accent-light)', color: 'var(--accent)', borderRadius: 8, fontSize: 11 }}>
                  {s.financeur?.slice(0, 3).toUpperCase()}
                </div>
                <div className="client-info">
                  <div className="client-name">{s.financeur}</div>
                  <div className="client-meta">
                    Demandé : {Number(s.montant_demande || 0).toLocaleString('fr-FR')} €
                    {s.montant_accorde && ` · Accordé : ${Number(s.montant_accorde).toLocaleString('fr-FR')} €`}
                    {s.deadline && ` · Deadline : ${s.deadline}`}
                  </div>
                </div>
                <select
                  value={s.statut || 'À préparer'}
                  onChange={e => updateSubStatut(s.id, e.target.value)}
                  style={{ padding: '4px 8px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border2)', fontSize: 11, background: 'var(--surface)' }}
                >
                  {SUB_STATUTS.map(st => <option key={st} value={st}>{st}</option>)}
                </select>
              </div>
            ))}
          </div>

          {showAddSub && <AddSubventionModal onClose={() => setShowAddSub(false)} onAdd={addSubvention} />}
        </div>
      )}

      {/* Fichiers Drive */}
      {tab === 'fichiers' && (
        <div>
          <div className="card" style={{ marginBottom: 12 }}>
            <div className="card-header">
              <div className="card-title">Fichiers Google Drive</div>
              <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setSyncing(true)}>
                🔄 Synchroniser
              </button>
            </div>

            {projet.drive?.fiche_prospect_id ? (
              <a href={`https://docs.google.com/spreadsheets/d/${projet.drive.fiche_prospect_id}/edit`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer' }}>
                  <div className="client-avatar" style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 8, fontSize: 11 }}>PRO</div>
                  <div className="client-info">
                    <div className="client-name">Fiche prospect — {projet.nom}</div>
                    <div className="client-meta">Collecte infos · Artistes · Faisabilité</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Ouvrir dans Sheets →</span>
                </div>
              </a>
            ) : driveProjetsFolderId && (
              <a href={`https://drive.google.com/drive/folders/${driveProjetsFolderId}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer' }}>
                  <div className="client-avatar" style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 8, fontSize: 11 }}>PRO</div>
                  <div className="client-info">
                    <div className="client-name">Fiche prospect — {projet.nom}</div>
                    <div className="client-meta">Collecte infos · Artistes · Faisabilité</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Dossier Drive →</span>
                </div>
              </a>
            )}

            {projet.drive?.dossier_subvention_id ? (
              <a href={`https://docs.google.com/spreadsheets/d/${projet.drive.dossier_subvention_id}/edit`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer' }}>
                  <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, fontSize: 11 }}>SUB</div>
                  <div className="client-info">
                    <div className="client-name">Dossier subvention — {projet.nom}</div>
                    <div className="client-meta">Budget maître · Salaires · ETPT · Mairie · Partenaires</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Ouvrir dans Sheets →</span>
                </div>
              </a>
            ) : driveProjetsFolderId && (
              <a href={`https://drive.google.com/drive/folders/${driveProjetsFolderId}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer' }}>
                  <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, fontSize: 11 }}>SUB</div>
                  <div className="client-info">
                    <div className="client-name">Dossier subvention — {projet.nom}</div>
                    <div className="client-meta">Budget maître · Salaires · ETPT · Mairie · Partenaires</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Dossier Drive →</span>
                </div>
              </a>
            )}

            {!driveProjetsFolderId && !projet.drive && (
              <div className="empty"><div className="empty-text">Fichiers non synchronisés sur Drive.</div></div>
            )}
          </div>

          {syncing && (
            <SyncModal
              projet={projet}
              clientMeta={clientMeta}
              onClose={() => setSyncing(false)}
              onTaskCreated={() => { setSyncing(false); if (onRefresh) onRefresh(); }}

      )}

      {/* Artistes */}
      {tab === 'artistes' && (
        <div className="card">
          <div className="empty">
            <div className="empty-text">La liste des artistes est dans la Fiche Prospect sur Drive.</div>
            {driveProjetsFolderId && (
              <div style={{ marginTop: 8 }}>
                <a href={`https://drive.google.com/drive/folders/${driveProjetsFolderId}`} target="_blank" style={{ color: 'var(--accent)', fontSize: 13 }}>
                  Ouvrir sur Drive →
                </a>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Modal synchronisation Excel ───────────────────────────────────────────────

function SyncModal({ projet, clientMeta, onClose, onTaskCreated }) {
  const [step, setStep] = useState('confirm'); // confirm | loading | result
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const slug = clientMeta.slug;

  async function runSync() {
    setStep('loading');
    try {
      const res = await fetch(`${API}/clients/${slug}/projets/${projet.slug}/sync`, {
        method: 'POST',
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setResult(data);
      setStep('result');
    } catch (e) {
      setError(e.message);
      setStep('confirm');
    }
  }

  async function valider() {
    try {
      await fetch(`${API}/taches/${result.task_id}/valider`, { method: 'POST' });
      onTaskCreated();
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">🔄 Synchroniser les Excel</div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {step === 'confirm' && (
          <>
            <div className="modal-sub">
              Claude va analyser les deux fichiers Excel du projet et l'Excel Association, vérifier la cohérence des données, et proposer les mises à jour nécessaires.
            </div>
            <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', fontSize: 13, marginBottom: 16 }}>
              <div style={{ fontWeight: 500, marginBottom: 8 }}>Ce qui sera vérifié :</div>
              <div style={{ color: 'var(--text2)', lineHeight: 1.8 }}>
                • Les infos de l'Association (SIRET, nom, contacts) sont-elles à jour dans le Dossier Subvention ?<br/>
                • Les taux de charges correspondent-ils aux paramètres actuels ?<br/>
                • Le bilan de l'Association reflète-t-il les données du projet ?<br/>
                • Des informations manquantes ou incohérentes ?
              </div>
            </div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16 }}>
              📖 <a href="https://docs.google.com/spreadsheets" target="_blank" style={{ color: 'var(--accent)' }}>Consulter la documentation de synchronisation</a> pour comprendre les règles appliquées.
            </div>
            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Annuler</button>
              <button className="btn btn-primary" onClick={runSync}>Lancer l'analyse →</button>
            </div>
          </>
        )}

        {step === 'loading' && (
          <div className="empty" style={{ padding: '40px 0' }}>
            <div style={{ fontSize: 24, marginBottom: 12 }}>⏳</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Claude analyse les fichiers…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Lecture des Excel Association + Projet en cours</div>
          </div>
        )}

        {step === 'result' && result && (
          <>
            <div style={{ background: result.nb_ecarts > 0 ? 'var(--warn-light)' : 'var(--accent-light)', borderRadius: 6, padding: '10px 14px', marginBottom: 14, fontSize: 13 }}>
              {result.nb_ecarts > 0
                ? <><strong>{result.nb_ecarts} écart(s) détecté(s)</strong> — une tâche de validation a été créée</>
                : <><strong>✅ Tout est synchronisé</strong> — aucune modification nécessaire</>
              }
            </div>

            {result.ecarts && result.ecarts.length > 0 && (
              <div style={{ maxHeight: 250, overflowY: 'auto', marginBottom: 14 }}>
                {result.ecarts.map((e, i) => (
                  <div key={i} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                    <div style={{ fontWeight: 500 }}>{e.description}</div>
                    <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{e.fichier} · {e.champ}</div>
                    {e.valeur_asso && <div style={{ fontSize: 12, color: 'var(--accent)', marginTop: 2 }}>Association : {e.valeur_asso} → Projet : {e.valeur_projet}</div>}
                  </div>
                ))}
              </div>
            )}

            {result.analyse_claude && (
              <div style={{ background: 'var(--surface2)', borderRadius: 6, padding: '10px 14px', fontSize: 12, color: 'var(--text2)', marginBottom: 14 }}>
                <div style={{ fontWeight: 600, marginBottom: 4 }}>Analyse Claude :</div>
                {result.analyse_claude}
              </div>
            )}

            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Fermer</button>
              {result.task_id && (
                <button className="btn btn-primary" onClick={valider}>
                  ✓ Valider et appliquer →
                </button>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Tâches view ───────────────────────────────────────────────────────────────

function TachesView({ taches, setTaches }) {
  const [filter, setFilter] = useState('all');

  const filtered = taches.filter(t => {
    if (filter === 'pending') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  function toggle(id) {
    setTaches(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
    const task = taches.find(t => t.id === id);
    if (task) {
      fetch(`${API}/taches/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !task.done }),
      }).catch(() => {});
    }
  }

  return (
    <div>
      <div className="section-header">
        <div className="section-title">Tâches</div>
        <button className="btn btn-primary">+ Nouvelle tâche</button>
      </div>
      <div className="tabs">
        {[['all', 'Toutes'], ['pending', 'En cours'], ['done', 'Terminées']].map(([k, l]) => (
          <button key={k} className={`tab ${filter === k ? 'active' : ''}`} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>
      <div className="card">
        {filtered.map(t => (
          <div key={t.id} className="task-row">
            <div className={`task-check ${t.done ? 'done' : ''}`} onClick={() => toggle(t.id)}>
              {t.done && <svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" /></svg>}
            </div>
            <div className="task-body" style={{ opacity: t.done ? 0.45 : 1 }}>
              <div className="task-title" style={{ textDecoration: t.done ? 'line-through' : 'none' }}>{t.titre}</div>
              <div className="task-meta">{t.client} · Source : {t.source} · Deadline : {t.date}</div>
            </div>
            <Badge statut={t.done ? 'OK' : t.priorite} />
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Calendriers ───────────────────────────────────────────────────────────────

function CalendrierView({ alertes, clients }) {
  const [tab, setTab] = useState('formalites');
  const [mois, setMois] = useState(new Date().getMonth());
  const [annee, setAnnee] = useState(new Date().getFullYear());
  const [events, setEvents] = useState(() => {
    try { return JSON.parse(localStorage.getItem('pk_cal_events') || '[]'); }
    catch { return []; }
  });
  const [showAdd, setShowAdd] = useState(false);
  const [selectedDay, setSelectedDay] = useState(null);
  const [newEvent, setNewEvent] = useState({ titre: '', type: 'formalite', client: '', couleur: '#2D5016', note: '' });

  function saveEvents(evts) {
    setEvents(evts);
    try { localStorage.setItem('pk_cal_events', JSON.stringify(evts)); } catch {}
  }

  function addEvent() {
    if (!newEvent.titre || !selectedDay) return;
    const evt = {
      id: Date.now(),
      date: selectedDay,
      ...newEvent,
      created_at: new Date().toISOString(),
    };
    // Persiste sur Drive
    fetch(`${API}/calendrier/event`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(evt),
    }).catch(() => {});
    saveEvents([...events, evt]);
    setShowAdd(false);
    setNewEvent({ titre: '', type: tab === 'formalites' ? 'formalite' : 'culturel', client: '', couleur: '#2D5016', note: '' });
  }

  function removeEvent(id) {
    fetch(`${API}/calendrier/event/${id}`, { method: 'DELETE' }).catch(() => {});
    saveEvents(events.filter(e => e.id !== id));
  }

  // Génère les événements automatiques depuis les alertes
  function getAutoEvents() {
    const auto = [];
    (alertes || []).forEach(a => {
      if (!a.date_expiration) return;
      auto.push({
        id: `auto_${a.organisme}_${a.client}`,
        date: a.date_expiration,
        titre: `${a.organisme} — ${a.client}`,
        type: 'formalite',
        couleur: a.statut === 'EXPIRÉ' ? '#B71C1C' : a.statut === 'URGENT' ? '#E65100' : '#1565C0',
        auto: true,
        statut: a.statut,
      });
    });
    return auto;
  }

  const allEvents = [...getAutoEvents(), ...events.filter(e => e.type === tab || tab === 'formalites' ? e.type === 'formalite' : e.type === 'culturel')];
  const filteredEvents = tab === 'formalites'
    ? [...getAutoEvents(), ...events.filter(e => e.type === 'formalite')]
    : events.filter(e => e.type === 'culturel');

  // Calendrier
  const firstDay = new Date(annee, mois, 1).getDay(); // 0=dim
  const daysInMonth = new Date(annee, mois + 1, 0).getDate();
  const firstDayAdj = (firstDay + 6) % 7; // Lundi=0
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const MOIS_LABELS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  function dayStr(d) {
    return `${annee}-${String(mois+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function eventsForDay(d) {
    const ds = dayStr(d);
    return filteredEvents.filter(e => e.date === ds || e.date?.startsWith(ds));
  }

  const TYPE_COLORS = {
    formalite: '#1565C0', deadline: '#B71C1C', rdv: '#6A1B9A',
    culturel: '#2D5016', festival: '#E65100', formation: '#00695C',
  };

  // Liste des événements du mois
  const monthEvents = filteredEvents
    .filter(e => e.date?.startsWith(`${annee}-${String(mois+1).padStart(2,'0')}`))
    .sort((a,b) => a.date.localeCompare(b.date));

  // Événements à venir (tous mois)
  const upcoming = filteredEvents
    .filter(e => e.date >= todayStr)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 8);

  return (
    <div>
      <div className="tabs" style={{ marginBottom: 16 }}>
        <button className={`tab ${tab === 'formalites' ? 'active' : ''}`} onClick={() => setTab('formalites')}>📋 Formalités & Échéances</button>
        <button className={`tab ${tab === 'culturel' ? 'active' : ''}`} onClick={() => setTab('culturel')}>🎭 Calendrier Culturel</button>
      </div>

      <div className="grid-2" style={{ alignItems: 'start' }}>
        {/* Calendrier */}
        <div className="card">
          {/* Navigation mois */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
            <button className="btn" style={{ padding: '4px 10px' }}
              onClick={() => { if (mois === 0) { setMois(11); setAnnee(a => a-1); } else setMois(m => m-1); }}>←</button>
            <div style={{ fontWeight: 600, fontSize: 15 }}>{MOIS_LABELS[mois]} {annee}</div>
            <button className="btn" style={{ padding: '4px 10px' }}
              onClick={() => { if (mois === 11) { setMois(0); setAnnee(a => a+1); } else setMois(m => m+1); }}>→</button>
          </div>

          {/* Grille jours de la semaine */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, marginBottom: 4 }}>
            {JOURS.map(j => (
              <div key={j} style={{ textAlign: 'center', fontSize: 10, fontWeight: 600, color: 'var(--text3)', padding: '2px 0' }}>{j}</div>
            ))}
          </div>

          {/* Grille jours */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
            {Array(firstDayAdj).fill(null).map((_, i) => <div key={`e${i}`} />)}
            {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
              const ds = dayStr(d);
              const dayEvts = eventsForDay(d);
              const isToday = ds === todayStr;
              const isSel = ds === selectedDay;
              return (
                <div key={d}
                  onClick={() => { setSelectedDay(ds); setShowAdd(true); }}
                  style={{
                    minHeight: 44, padding: '3px 4px', borderRadius: 6, cursor: 'pointer',
                    background: isToday ? 'var(--accent)' : isSel ? 'var(--accent-light)' : dayEvts.length > 0 ? '#F3F8FF' : 'var(--surface2)',
                    border: isSel ? '1.5px solid var(--accent-mid)' : isToday ? 'none' : '1px solid transparent',
                    transition: 'all 0.1s',
                  }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: isToday ? 'white' : 'var(--text)', marginBottom: 2 }}>{d}</div>
                  {dayEvts.slice(0, 2).map((e, ei) => (
                    <div key={ei} style={{
                      fontSize: 9, background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)',
                      color: 'white', borderRadius: 3, padding: '1px 3px', marginBottom: 1,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                    }}>{e.titre}</div>
                  ))}
                  {dayEvts.length > 2 && <div style={{ fontSize: 9, color: 'var(--text3)' }}>+{dayEvts.length-2}</div>}
                </div>
              );
            })}
          </div>

          {/* Légende */}
          <div style={{ marginTop: 12, display: 'flex', flexWrap: 'wrap', gap: 8, fontSize: 11, color: 'var(--text3)' }}>
            {tab === 'formalites' ? <>
              <span><span style={{ color: '#B71C1C' }}>●</span> Expiré</span>
              <span><span style={{ color: '#E65100' }}>●</span> Urgent</span>
              <span><span style={{ color: '#1565C0' }}>●</span> Échéance</span>
            </> : <>
              <span><span style={{ color: '#2D5016' }}>●</span> Événement</span>
              <span><span style={{ color: '#E65100' }}>●</span> Festival</span>
              <span><span style={{ color: '#6A1B9A' }}>●</span> RDV</span>
            </>}
          </div>
        </div>

        {/* Panneau droite */}
        <div>
          {/* Prochains événements */}
          <div className="card" style={{ marginBottom: 12 }}>
            <div className="card-header">
              <div className="card-title">À venir</div>
              <button className="btn btn-primary" style={{ fontSize: 12 }}
                onClick={() => { setSelectedDay(todayStr); setShowAdd(true); }}>
                + Ajouter
              </button>
            </div>
            {upcoming.length === 0 ? (
              <div className="empty"><div className="empty-text">Aucun événement à venir.</div></div>
            ) : upcoming.map((e, i) => {
              const d = new Date(e.date + 'T00:00:00');
              const diff = Math.round((d - today) / 86400000);
              return (
                <div key={e.id} style={{ display: 'flex', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--border)', alignItems: 'flex-start' }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: 'white', lineHeight: 1 }}>{d.getDate()}</div>
                    <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.8)' }}>{MOIS_LABELS[d.getMonth()].slice(0,3)}</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500, fontSize: 13 }}>{e.titre}</div>
                    {e.client && <div style={{ fontSize: 11, color: 'var(--text3)' }}>{e.client}</div>}
                    {e.note && <div style={{ fontSize: 11, color: 'var(--text3)', fontStyle: 'italic' }}>{e.note}</div>}
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: diff <= 7 ? '#B71C1C' : diff <= 30 ? '#E65100' : 'var(--text3)' }}>
                      {diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain' : `J-${diff}`}
                    </div>
                    {!e.auto && (
                      <button onClick={() => removeEvent(e.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)', fontSize: 11 }}>✕</button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Événements du mois */}
          {monthEvents.length > 0 && (
            <div className="card">
              <div className="card-header">
                <div className="card-title">Ce mois — {MOIS_LABELS[mois]}</div>
              </div>
              {monthEvents.map((e, i) => (
                <div key={e.id} style={{ display: 'flex', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 13, alignItems: 'center' }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)', flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <span style={{ fontWeight: 500 }}>{e.date?.slice(8,10)}/{e.date?.slice(5,7)}</span>
                    <span style={{ marginLeft: 8 }}>{e.titre}</span>
                    {e.client && <span style={{ color: 'var(--text3)', fontSize: 11, marginLeft: 6 }}>— {e.client}</span>}
                  </div>
                  {!e.auto && <button onClick={() => removeEvent(e.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)', fontSize: 11 }}>✕</button>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Modal ajout événement */}
      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal">
            <div className="modal-title">{tab === 'formalites' ? '📋 Ajouter une échéance' : '🎭 Ajouter un événement culturel'}</div>
            <div className="modal-sub">Date : {selectedDay?.split('-').reverse().join('/')}</div>

            <div className="form-group">
              <label className="form-label">Titre *</label>
              <input className="form-input" value={newEvent.titre} onChange={e => setNewEvent(p => ({ ...p, titre: e.target.value }))}
                placeholder={tab === 'formalites' ? "Renouvellement licence, URSSAF..." : "Festival, concert, répétition..."} autoFocus />
            </div>

            <div className="form-grid">
              <div className="form-group">
                <label className="form-label">Type</label>
                <select className="form-input" value={newEvent.type} onChange={e => setNewEvent(p => ({ ...p, type: e.target.value }))}>
                  {tab === 'formalites' ? <>
                    <option value="formalite">Formalité administrative</option>
                    <option value="deadline">Deadline / Date limite</option>
                    <option value="rdv">Rendez-vous</option>
                  </> : <>
                    <option value="culturel">Événement culturel</option>
                    <option value="festival">Festival / Spectacle</option>
                    <option value="formation">Formation / Résidence</option>
                    <option value="rdv">Rendez-vous</option>
                  </>}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Client associé</label>
                <select className="form-input" value={newEvent.client} onChange={e => setNewEvent(p => ({ ...p, client: e.target.value }))}>
                  <option value="">— Aucun —</option>
                  {clients.map(c => <option key={c.slug} value={c.nom}>{c.nom}</option>)}
                </select>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Couleur</label>
              <div style={{ display: 'flex', gap: 8 }}>
                {['#2D5016','#1565C0','#B71C1C','#E65100','#6A1B9A','#00695C','#F57F17'].map(c => (
                  <div key={c} onClick={() => setNewEvent(p => ({ ...p, couleur: c }))}
                    style={{ width: 28, height: 28, borderRadius: '50%', background: c, cursor: 'pointer',
                      border: newEvent.couleur === c ? '3px solid var(--text)' : '2px solid transparent' }} />
                ))}
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Note</label>
              <input className="form-input" value={newEvent.note} onChange={e => setNewEvent(p => ({ ...p, note: e.target.value }))}
                placeholder="Détails, contacts, liens..." />
            </div>

            <div className="modal-footer">
              <button className="btn" onClick={() => setShowAdd(false)}>Annuler</button>
              <button className="btn btn-primary" onClick={addEvent} disabled={!newEvent.titre}>Ajouter →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NewDevisModal({ onClose, onCreated, defaultClientSlug = '', defaultClientNom = '' }) {
  const [clients, setClients] = useState([]);
  const [tarifs, setTarifs] = useState([]);
  const [form, setForm] = useState({
    client_slug: defaultClientSlug,
    client_nom: defaultClientNom,
    periode: '',
    acompte_pct: 30, facilite_paiement: '1x', notes: '',
  });
  const [prestations, setPrestations] = useState([
    { description: '', type: '', quantite: 1, tarif_unitaire: 0, sous_total: 0 }
  ]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    fetch(`${API}/clients`).then(r => r.json()).then(d => setClients(d || [])).catch(() => {});
    fetch(`${API}/devis/tarifs`).then(r => r.json()).then(d => setTarifs(d || [])).catch(() => {});
  }, []);

  function setF(k, v) { setForm(p => ({ ...p, [k]: v })); }

  function updatePresta(i, k, v) {
    setPrestations(prev => {
      const next = [...prev];
      next[i] = { ...next[i], [k]: v };
      if (k === 'quantite' || k === 'tarif_unitaire') {
        next[i].sous_total = (parseFloat(next[i].quantite) || 0) * (parseFloat(next[i].tarif_unitaire) || 0);
      }
      if (k === 'type') {
        const tarif = tarifs.find(t => t.label === v);
        if (tarif) {
          next[i].tarif_unitaire = tarif.tarif;
          next[i].sous_total = (parseFloat(next[i].quantite) || 1) * tarif.tarif;
          if (!next[i].description) next[i].description = v;
        }
      }
      return next;
    });
  }

  function addLine() {
    setPrestations(p => [...p, { description: '', type: '', quantite: 1, tarif_unitaire: 0, sous_total: 0 }]);
  }

  function removeLine(i) {
    setPrestations(p => p.filter((_, idx) => idx !== i));
  }

  const total = prestations.reduce((s, p) => s + (parseFloat(p.sous_total) || 0), 0);
  const acompte = Math.round(total * (parseFloat(form.acompte_pct) || 0) / 100 * 100) / 100;
  const solde = Math.round((total - acompte) * 100) / 100;

  async function submit() {
    if (!form.client_nom) { setError('Client obligatoire'); return; }
    if (!prestations.some(p => p.description)) { setError('Au moins une prestation obligatoire'); return; }
    setLoading(true);
    try {
      const res = await fetch(`${API}/devis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...form, prestations, total_ht: total }),
      });
      if (!res.ok) throw new Error(await res.text());
      onCreated();
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ width: 640, maxHeight: '90vh', overflowY: 'auto' }}>
        <div className="modal-title">📝 Nouveau devis</div>
        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 12 }}>{error}</div>}

        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Client *</label>
            <select className="form-input" value={form.client_slug}
              onChange={e => {
                const c = clients.find(x => x.slug === e.target.value);
                setF('client_slug', e.target.value);
                setF('client_nom', c ? (c.nom || c.nom_officiel) : '');
              }}>
              <option value="">Sélectionner...</option>
              {clients.map(c => <option key={c.slug} value={c.slug}>{c.nom || c.nom_officiel}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Période</label>
            <input className="form-input" value={form.periode} onChange={e => setF('periode', e.target.value)} placeholder="du JJ/MM/AAAA au JJ/MM/AAAA" />
          </div>
        </div>

        {/* Prestations */}
        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Prestations *</div>
        {prestations.map((p, i) => (
          <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 8, alignItems: 'flex-end' }}>
            <div style={{ flex: 2 }}>
              <input className="form-input" style={{ fontSize: 12 }} value={p.description}
                onChange={e => updatePresta(i, 'description', e.target.value)} placeholder="Description" />
            </div>
            <div style={{ flex: 1.5 }}>
              <select className="form-input" style={{ fontSize: 12 }} value={p.type}
                onChange={e => updatePresta(i, 'type', e.target.value)}>
                <option value="">Type / formule</option>
                {tarifs.map(t => <option key={t.label} value={t.label}>{t.label} ({t.tarif} {t.unite})</option>)}
              </select>
            </div>
            <div style={{ width: 60 }}>
              <input className="form-input" style={{ fontSize: 12 }} type="number" value={p.quantite}
                onChange={e => updatePresta(i, 'quantite', e.target.value)} min="0" step="0.5" />
            </div>
            <div style={{ width: 80 }}>
              <input className="form-input" style={{ fontSize: 12 }} type="number" value={p.tarif_unitaire}
                onChange={e => updatePresta(i, 'tarif_unitaire', e.target.value)} />
            </div>
            <div style={{ width: 80, textAlign: 'right', fontWeight: 600, fontSize: 13, paddingBottom: 8 }}>
              {(p.sous_total || 0).toLocaleString('fr-FR')} €
            </div>
            <button onClick={() => removeLine(i)} style={{ background: 'none', border: 'none', color: 'var(--danger)', cursor: 'pointer', paddingBottom: 8 }}>✕</button>
          </div>
        ))}
        <button className="btn" style={{ fontSize: 12, marginBottom: 14 }} onClick={addLine}>+ Ligne</button>

        {/* Totaux */}
        <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '12px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 13 }}>
            <span>Total HT</span><strong>{total.toLocaleString('fr-FR')} €</strong>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 12, color: 'var(--text3)' }}>
            <span>TVA — Non applicable (Art. 293B du CGI)</span><span>0 €</span>
          </div>
          <div className="divider" />
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 6 }}>
            <span style={{ fontSize: 12 }}>Acompte (%)</span>
            <input type="number" className="form-input" style={{ width: 70, fontSize: 12 }}
              value={form.acompte_pct} onChange={e => setF('acompte_pct', e.target.value)} />
            <span style={{ fontSize: 13, fontWeight: 500 }}>{acompte.toLocaleString('fr-FR')} €</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
            <span>Solde à la livraison</span><strong>{solde.toLocaleString('fr-FR')} €</strong>
          </div>
        </div>

        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Facilité de paiement</label>
            <select className="form-input" value={form.facilite_paiement} onChange={e => setF('facilite_paiement', e.target.value)}>
              <option value="1x">1 fois (standard)</option>
              <option value="2x">2 fois</option>
              <option value="3x">3 fois</option>
              <option value="manuel">Manuel (délais personnalisés)</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes} onChange={e => setF('notes', e.target.value)} placeholder="Conditions particulières..." />
          </div>
        </div>

        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Création…' : 'Créer le devis →'}
          </button>
        </div>
      </div>
    </div>
  );
}

  const [parsed, setParsed] = useState(null);
  const [loading, setLoading] = useState(false);
