<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PauseKreyol</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Palette PauseKreyol exacte ── */
      --orange:       #F07052;   /* orange corail — couleur principale */
      --orange-dark:  #D4563A;   /* orange foncé — hover */
      --orange-light: #FEF0EC;   /* orange très pâle — fonds */
      --orange-mid:   #F5896E;   /* orange moyen */

      --blue:         #3D3FAA;   /* bleu indigo — accent secondaire */
      --blue-dark:    #2D2F8A;
      --blue-light:   #EEEEF8;   /* bleu très pâle — fonds */

      /* Système général */
      --bg:           #F8F8FA;   /* blanc légèrement gris — fond page */
      --surface:      #FFFFFF;
      --surface2:     #F2F2F6;
      --border:       #E8E8EE;
      --border2:      #D0D0DC;
      --text:         #1A1A2E;   /* quasi-noir avec teinte bleue */
      --text2:        #5A5A72;
      --text3:        #9898B0;

      /* Sémantiques — mappés sur la palette PK */
      --accent:       var(--orange);
      --accent-light: var(--orange-light);
      --accent-mid:   var(--orange-mid);
      --info:         var(--blue);
      --info-light:   var(--blue-light);
      --warn:         #B45309;
      --warn-light:   #FEF3C7;
      --danger:       #C0392B;
      --danger-light: #FDECEB;

      /* Alias pour rétrocompatibilité avec le JS existant */
      --accent:       #F07052;
      --accent-light: #FEF0EC;
      --accent-mid:   #F5896E;

      --radius:    10px;
      --radius-sm: 6px;
      --shadow:    0 1px 3px rgba(61,63,170,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(61,63,170,0.10);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout */
    .app { display: flex; min-height: 100vh; }

    /* ── Sidebar — orange PK ── */
    .sidebar {
      width: 224px;
      min-height: 100vh;
      background: var(--orange);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 22px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .sidebar-logo h1 {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2px;
    }
    .sidebar-logo p {
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .sidebar-nav { padding: 14px 10px; flex: 1; }
    .nav-section { margin-bottom: 16px; }
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: rgba(255,255,255,0.80);
      transition: all 0.15s;
      font-weight: 400;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: rgba(255,255,255,0.15); color: white; }
    .nav-item.active {
      background: white;
      color: var(--orange);
      font-weight: 600;
    }
    .nav-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.85; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-badge {
      margin-left: auto;
      background: var(--blue);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
    }
    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
    }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: white;
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .user-name { font-size: 12px; font-weight: 600; color: white; }
    .user-role { font-size: 10px; color: rgba(255,255,255,0.65); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface2); }
    .btn-primary {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--orange-dark); border-color: var(--orange-dark); }

    .content { padding: 24px 28px; flex: 1; overflow-y: auto; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }

    /* Metric cards */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .metric-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .metric-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 26px; font-weight: 300; margin-top: 6px; letter-spacing: -1px; color: var(--text); }
    .metric-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .metric-card.accent-green { border-top: 3px solid var(--orange); }
    .metric-card.accent-warn  { border-top: 3px solid #D97706; }
    .metric-card.accent-danger{ border-top: 3px solid var(--danger); }
    .metric-card.accent-info  { border-top: 3px solid var(--blue); }
    .metric-card[style*="cursor: pointer"]:hover, .metric-card[style*="cursor:pointer"]:hover {
      background: var(--surface2);
      transform: translateY(-1px);
      transition: all 0.15s;
    }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge-green  { background: var(--orange-light); color: var(--orange-dark); }
    .badge-warn   { background: var(--warn-light); color: var(--warn); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-info   { background: var(--blue-light); color: var(--blue); }
    .badge-gray   { background: var(--surface2); color: var(--text2); }

    /* Client list */
    .client-row {
      display: flex; align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--border); gap: 14px;
      cursor: pointer; transition: opacity 0.15s;
    }
    .client-row:last-child { border-bottom: none; }
    .client-row:hover { opacity: 0.75; }
    .client-avatar {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--orange-light); color: var(--orange);
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .client-info { flex: 1; min-width: 0; }
    .client-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .client-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .client-right { text-align: right; flex-shrink: 0; }

    /* Alert list */
    .alert-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .alert-row:last-child { border-bottom: none; }
    .alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .dot-danger { background: var(--danger); }
    .dot-warn   { background: #D97706; }
    .dot-ok     { background: var(--orange); }
    .dot-gray   { background: var(--text3); }
    .alert-label { font-size: 13px; font-weight: 500; }
    .alert-sub   { font-size: 11px; color: var(--text3); margin-top: 1px; }

    /* Progress bar */
    .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 16px; font-size: 13px; cursor: pointer; border: none;
      background: none; color: var(--text2); font-family: 'DM Sans', sans-serif;
      font-weight: 400; border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--orange); border-bottom-color: var(--orange); font-weight: 600; }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; display: block; }
    .form-input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border2);
      border-radius: var(--radius-sm); font-size: 13px; font-family: 'DM Sans', sans-serif;
      background: var(--surface); color: var(--text); transition: border-color 0.15s;
    }
    .form-input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-light); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26,26,46,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal {
      background: var(--surface); border-radius: var(--radius); padding: 24px;
      width: 520px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(61,63,170,0.15);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* Pipeline */
    .pipeline { display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; }
    .pipeline-col { flex: 1; min-width: 110px; }
    .pipeline-header {
      font-size: 11px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 0 0 8px; white-space: nowrap;
    }
    .pipeline-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; font-size: 12px; }
    .pipeline-card-name { font-weight: 500; }
    .pipeline-card-sub { color: var(--text3); margin-top: 2px; font-size: 11px; }

    /* Calendar */
    .calendar-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .cal-day { flex-shrink: 0; width: 40px; text-align: center; padding: 8px 4px; border-radius: var(--radius-sm); cursor: pointer; }
    .cal-day-name { font-size: 10px; color: var(--text3); text-transform: uppercase; }
    .cal-day-num  { font-size: 15px; font-weight: 500; margin-top: 2px; }
    .cal-day.today { background: var(--orange); color: white; }
    .cal-day.today .cal-day-name { color: rgba(255,255,255,0.75); }
    .cal-day.has-event { position: relative; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--orange); margin: 3px auto 0; }
    .cal-day.today .cal-dot { background: white; }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    .empty-text { font-size: 13px; }

    /* Tâches */
    .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .task-row:last-child { border-bottom: none; }
    .task-check {
      width: 18px; height: 18px; border: 1.5px solid var(--border2); border-radius: 4px;
      flex-shrink: 0; margin-top: 1px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: var(--orange); border-color: var(--orange); }
    .task-body { flex: 1; }
    .task-title { font-size: 13px; font-weight: 500; }
    .task-meta  { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .task-right { flex-shrink: 0; }

    /* Section header */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 600; }

    /* ── RESPONSIVE MOBILE ── */
    @media (max-width: 768px) {
      .app { flex-direction: column; }
      .sidebar { display: none; }
      .main { flex: 1; padding-bottom: 64px; }
      .topbar { padding: 0 16px; height: 48px; }
      .topbar-title { font-size: 14px; }
      .topbar-right { display: none; }
      .btn-primary { display: none !important; }
      button.btn:not(.btn-tab):not(.btn-back):not(.btn-toggle) { display: none; }
      .content { padding: 12px; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr !important; gap: 10px; }
      .card { padding: 12px; border-radius: 8px; margin-bottom: 10px; }
      .card-header { flex-wrap: wrap; gap: 6px; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
      .metric-card { padding: 12px; }
      .metric-value { font-size: 22px; }
      .client-row { padding: 10px 0; }
      .client-right { display: none; }
      .tabs { overflow-x: auto; white-space: nowrap; padding-bottom: 2px; gap: 4px; }
      .tab { padding: 6px 12px; font-size: 12px; }
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal { width: 100% !important; max-width: 100% !important; border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px 16px 32px; }
      .modal-footer { flex-direction: column-reverse; gap: 8px; }
      .modal-footer .btn { width: 100%; justify-content: center; }
      .pipeline { flex-direction: column; }
      .pipeline-col { min-width: unset; }
      .alert-row { flex-wrap: wrap; gap: 6px; }
      .section-header { margin-bottom: 12px; }
      .section-title { font-size: 14px; }
      .btn-back-mobile { display: flex !important; }
      .btn-desktop-back { display: none !important; }
      table { font-size: 12px; }
    }

    /* ── BARRE DE NAVIGATION MOBILE ── */
    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px; background: var(--surface); border-top: 1px solid var(--border);
      z-index: 100; padding: 0 4px;
    }
    .mobile-nav-inner { display: flex; align-items: stretch; height: 100%; }
    .mobile-nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; border: none; background: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; color: var(--text3); font-size: 10px; font-weight: 500;
      padding: 6px 4px; border-radius: 8px; transition: all 0.15s; position: relative;
    }
    .mobile-nav-item.active { color: var(--orange); }
    .mobile-nav-item svg { width: 20px; height: 20px; }
    .mobile-nav-badge {
      position: absolute; top: 4px; right: calc(50% - 14px);
      background: var(--danger); color: white; font-size: 9px; font-weight: 700;
      min-width: 14px; height: 14px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; padding: 0 3px;
    }
    @media (max-width: 768px) { .mobile-nav { display: flex; } }

    /* Bannière read-only */
    .mobile-readonly-banner {
      display: none; background: var(--orange-light); color: var(--orange);
      font-size: 11px; font-weight: 500; text-align: center; padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 768px) { .mobile-readonly-banner { display: block; } }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const API = 'https://web-production-ac84a.up.railway.app';

    { id: 3, titre: 'Renouveler licence Cie Tropik', client: 'Cie Tropik', priorite: 'Attention', date: '2026-04-30', done: false, source: 'Alerte' },

    ],

// ── Helpers ──────────────────────────────────────────────────────────────────

function initials(name) {
  return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function Badge({ statut }) {
  const map = {
    'EXPIRÉ': 'badge-danger',
    'URGENT': 'badge-warn',
    'Attention': 'badge-warn',
    'OK': 'badge-green',
    '—': 'badge-gray',
    'en_construction': 'badge-info',
    'Normal': 'badge-gray',
  };
  return <span className={`badge ${map[statut] || 'badge-gray'}`}>{statut}</span>;
}

function AlertDot({ statut }) {
  const map = { 'EXPIRÉ': 'dot-danger', 'URGENT': 'dot-warn', 'Attention': 'dot-warn', 'OK': 'dot-ok' };
  return <div className={`alert-dot ${map[statut] || 'dot-gray'}`} />;
}

// ── Calendar strip ────────────────────────────────────────────────────────────

function CalendarStrip() {
  const today = new Date();
  const days = [];
  for (let i = -2; i <= 12; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }
  const names = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  const events = [today.getDate() + 2, today.getDate() + 7, today.getDate() + 10];

  return (
    <div className="calendar-strip">
      {days.map((d, i) => {
        const isToday = d.toDateString() === today.toDateString();
        const hasEvent = events.includes(d.getDate());
        return (
          <div key={i} className={`cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}`}>
            <div className="cal-day-name">{names[d.getDay()]}</div>
            <div className="cal-day-num">{d.getDate()}</div>
            {hasEvent && <div className="cal-dot" />}
          </div>
        );
      })}
    </div>
  );
}

            <div key={i} className="alert-row">
              <AlertDot statut={a.statut} />
              <div>

            <div className="empty" style={{ padding: '16px 0' }}><div className="empty-text">Aucune alerte active.</div></div>

        </div>

        {/* Tâches urgentes */}

// ── Client detail view ────────────────────────────────────────────────────────

function ClientDetailView({ slug, onBack, onRefresh }) {
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('infos');
  const [showNewProject, setShowNewProject] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [selectedProjet, setSelectedProjet] = useState(null);

  function load() {
    setLoading(true);
    fetch(`${API}/clients/${slug}`)
      .then(r => r.json())
      .then(d => { setDetail(d); setLoading(false); })
      .catch(() => setLoading(false));
  }

  function handleSaved(updatedMeta) {
    if (updatedMeta && updatedMeta.client_data) {
      setDetail(updatedMeta);
    } else {
      load();
    }
    if (onRefresh) onRefresh();
  }

  useEffect(() => { load(); }, [slug]);

  if (loading) return <div className="empty"><div className="empty-text">Chargement...</div></div>;
  if (!detail) return <div className="empty"><div className="empty-text">Client introuvable.</div></div>;

  const cd = detail.client_data || {};
  const projets = detail.projets || [];
  const typeLabel = cd.type_structure === 'sas_senegal' ? '🇸🇳 SAS OHADA — Sénégal' : '🇫🇷 Association loi 1901 — France';

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn btn-desktop-back" onClick={onBack} style={{ padding: '6px 10px' }}>← Retour</button>

          <div style={{ fontSize: 17, fontWeight: 600 }}>{cd.nom_usuel || cd.nom_officiel}</div>

        <button className="btn" onClick={() => setShowEdit(true)}>✏️ Modifier</button>
      </div>

      {showNewProject && <NewProjectModal slug={slug} clientMeta={detail} onClose={() => setShowNewProject(false)} onCreated={() => { load(); if (onRefresh) onRefresh(); }} />}
      {showEdit && detail && <EditClientModal detail={detail} onClose={() => setShowEdit(false)} onSaved={handleSaved} onDeleted={() => { if (onRefresh) onRefresh(); onBack(); }} />}

              <a href={`https://drive.google.com/drive/folders/${detail.drive_projets_folder_id}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer', paddingLeft: 8 }}>
                  <div className="client-avatar" style={{ background: '#FEF3C7', color: '#92400E', borderRadius: 8, fontSize: 11 }}>PRO</div>
                  <div className="client-info">
                    <div className="client-name">Fiche prospect — {p.nom}</div>
                    <div className="client-meta">Collecte infos · Artistes · Faisabilité</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Sheets →</span>
                </div>
              </a>
              <a href={`https://drive.google.com/drive/folders/${detail.drive_projets_folder_id}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                <div className="client-row" style={{ cursor: 'pointer', paddingLeft: 8 }}>
                  <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, fontSize: 11 }}>SUB</div>
                  <div className="client-info">
                    <div className="client-name">Dossier subvention — {p.nom}</div>
                    <div className="client-meta">Budget maître · Salaires · ETPT · Mairie · Partenaires</div>
                  </div>
                  <span style={{ fontSize: 12, color: 'var(--accent)' }}>Sheets →</span>
                </div>
              </a>
            </div>
          ))}

          {!detail.drive_asso_id && !detail.drive_projets_folder_id && (
            <div className="empty">
              <div className="empty-text">Fichiers non encore synchronisés sur Drive.</div>
              {detail.drive_folder_id && (
                <div style={{ marginTop: 8 }}>
                  <a href={`https://drive.google.com/drive/folders/${detail.drive_folder_id}`} target="_blank" style={{ color: 'var(--accent)', fontSize: 13 }}>
                    Ouvrir le dossier Drive →
                  </a>
                </div>
              )}
            </div>
          )}

          {/* Lien dossier Drive complet */}
          {detail.drive_folder_id && (
            <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <a href={`https://drive.google.com/drive/folders/${detail.drive_folder_id}`} target="_blank" style={{ fontSize: 12, color: 'var(--text3)' }}>
                Voir le dossier Drive complet →
              </a>
              <a href={`${API}/templates/doc-synchronisation`} target="_blank" style={{ fontSize: 12, color: 'var(--accent)' }}>
                📖 Télécharger la documentation de synchronisation
              </a>
            </div>
          )}
        </div>
      )}
      {/* Facturation */}
      {tab === 'facturation' && (
        <FacturationClient slug={slug} nomClient={cd.nom_usuel || cd.nom_officiel} />
      )}

      {/* Historique */}
      {tab === 'historique' && (
        <div className="card">
          <div className="card-header">
            <div className="card-title">Journal d'activité</div>
            <div className="card-subtitle">Toutes les opérations sur ce dossier</div>
          </div>
          {(() => {
            const history = detail?.timestamps?.history || [];
            const labels = {
              creation_dossier: '📁 Dossier créé',
              creation_projet: '📋 Projet créé',
              modification_infos: '✏️ Infos modifiées',
              upload_excel: '📊 Excel mis à jour',
              suppression: '🗑 Suppression',
              tache_creee: '✅ Tâche créée',
              tache_validee: '✔️ Tâche validée',
            };
            if (history.length === 0) return (
              <div className="empty"><div className="empty-text">Aucun événement enregistré.</div></div>
            );
            return [...history].reverse().map((evt, i) => (
              <div key={i} className="alert-row">
                <div style={{ flex: 1 }}>
                  <div className="alert-label">{labels[evt.event] || evt.event}</div>
                  <div className="alert-sub">
                    {new Date(evt.at).toLocaleString('fr-FR')}
                    {evt.details?.nom_projet && ` — ${evt.details.nom_projet}`}
                    {evt.details?.champs_modifiés?.length > 0 && ` — ${evt.details.champs_modifiés.join(', ')}`}
                  </div>
                </div>
              </div>
            ));
          })()}
        </div>
      )}
    </div>
  );
}

// ── Facturation par client ────────────────────────────────────────────────────

function FacturationClient({ slug, nomClient }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showNewDevis, setShowNewDevis] = useState(false);

  async function load() {
    setLoading(true);
    try {
      const [devisRes, factRes] = await Promise.all([
        fetch(`${API}/devis`),
        fetch(`${API}/factures`),
      ]);
      const allDevis = devisRes.ok ? await devisRes.json() : [];
      const allFact = factRes.ok ? await factRes.json() : [];
      setData({
        devis: allDevis.filter(d => d.client_slug === slug),
        factures: allFact.filter(f => f.client_slug === slug),
      });
    } catch {}
    setLoading(false);
  }

  useEffect(() => { load(); }, [slug]);

  const STATUT_DEVIS = {
    brouillon: { label: 'Brouillon', bg: 'var(--surface2)', color: 'var(--text3)' },
    envoyé:    { label: 'Envoyé',    bg: 'var(--info-light)', color: 'var(--info)' },
    signé:     { label: 'Signé',     bg: 'var(--warn-light)', color: 'var(--warn)' },
    validé:    { label: 'Validé',    bg: 'var(--accent-light)', color: 'var(--accent)' },
    facturé:   { label: 'Facturé',   bg: '#E8F5E9', color: '#1B5E20' },
    annulé:    { label: 'Annulé',    bg: 'var(--danger-light)', color: 'var(--danger)' },
  };
  const STATUT_FACT = {
    à_faire:   { label: 'À faire',   bg: 'var(--warn-light)',   color: 'var(--warn)' },
    envoyée:   { label: 'Envoyée',   bg: 'var(--info-light)',   color: 'var(--info)' },
    payée:     { label: 'Payée',     bg: 'var(--accent-light)', color: 'var(--accent)' },
    annulée:   { label: 'Annulée',   bg: 'var(--danger-light)', color: 'var(--danger)' },
    en_retard: { label: 'En retard', bg: 'var(--danger-light)', color: 'var(--danger)' },
  };

  function Badge({ statut, map }) {
    const s = map[statut] || { label: statut, bg: 'var(--surface2)', color: 'var(--text3)' };
    return <span style={{ background: s.bg, color: s.color, padding: '2px 8px', borderRadius: 10, fontSize: 11, fontWeight: 600 }}>{s.label}</span>;
  }

  function printDevis(d) {
    const prestations = (d.prestations || []).filter(p => p.description);
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Devis ${d.numero}</title>
<style>
  body { font-family: Arial, sans-serif; color: #1a1916; margin: 0; padding: 32px; font-size: 13px; }
  h1 { color: #F07052; font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 11px; margin-bottom: 24px; }
  .header { display: flex; justify-content: space-between; margin-bottom: 32px; }
  .from { }
  .to { text-align: right; }
  .label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
  .val { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th { background: #F07052; color: white; padding: 8px 10px; text-align: left; font-size: 11px; }
  td { padding: 8px 10px; border-bottom: 1px solid #eee; }
  .total-block { margin-top: 16px; text-align: right; }
  .total-row { display: flex; justify-content: flex-end; gap: 40px; padding: 6px 0; font-size: 13px; }
  .total-final { font-size: 16px; font-weight: 700; color: #F07052; border-top: 2px solid #F07052; padding-top: 8px; margin-top: 4px; }
  .conditions { margin-top: 32px; font-size: 11px; color: #888; border-top: 1px solid #eee; padding-top: 16px; }
  @media print { body { padding: 16px; } }
</style></head><body>
<h1>DEVIS</h1>
<div class="sub">${d.numero} · Émis le ${d.date_emission || new Date().toLocaleDateString('fr-FR')}</div>
<div class="header">
  <div class="from">
    <div class="label">De</div>
    <div class="val">Pause Kreyol</div>
    <div>Administration de production culturelle</div>
    <div>contact@pausekreyol.fr</div>
  </div>
  <div class="to">
    <div class="label">Pour</div>
    <div class="val">${d.client_nom || '—'}</div>
    ${d.periode ? `<div>Période : ${d.periode}</div>` : ''}
  </div>
</div>
<table>
  <thead><tr><th>Description</th><th>Type / Formule</th><th style="text-align:center">Qté</th><th style="text-align:right">Tarif unitaire</th><th style="text-align:right">Sous-total</th></tr></thead>
  <tbody>
    ${prestations.map(p => `<tr>
      <td>${p.description}</td>
      <td style="color:#666">${p.type || '—'}</td>
      <td style="text-align:center">${p.quantite}</td>
      <td style="text-align:right">${(p.tarif_unitaire || 0).toLocaleString('fr-FR')} €</td>
      <td style="text-align:right;font-weight:500">${(p.sous_total || 0).toLocaleString('fr-FR')} €</td>
    </tr>`).join('')}
  </tbody>
</table>
<div class="total-block">
  <div class="total-row"><span>Total HT</span><span>${(d.total_ht || 0).toLocaleString('fr-FR')} €</span></div>
  <div class="total-row"><span>TVA (Art. 293B du CGI)</span><span>0 €</span></div>
  <div class="total-row total-final"><span>Total TTC</span><span>${(d.total_ht || 0).toLocaleString('fr-FR')} €</span></div>
  ${d.acompte_pct > 0 ? `<div class="total-row" style="color:#666"><span>Acompte à la signature (${d.acompte_pct}%)</span><span>${(d.acompte_montant || 0).toLocaleString('fr-FR')} €</span></div>` : ''}
  ${d.acompte_pct > 0 ? `<div class="total-row" style="color:#666"><span>Solde à la livraison</span><span>${(d.solde || 0).toLocaleString('fr-FR')} €</span></div>` : ''}
</div>
${d.notes ? `<div style="margin-top:20px;padding:12px;background:#f5f5f5;border-radius:6px;font-size:12px;color:#555">${d.notes}</div>` : ''}
<div class="conditions">
  <strong>Conditions :</strong> Validité ${d.validite_jours || 30} jours · Délai de paiement 30 jours nets · Pénalités de retard : 3× le taux légal · TVA non applicable — Art. 293B du CGI
</div>
</body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
    setTimeout(() => w.print(), 500);
  }

  async function changeStatut(type, id, statut) {
    await fetch(`${API}/${type}/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ statut }),
    });
    load();
  }

  async function creerFacture(devis) {
    await fetch(`${API}/factures`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ devis_id: devis.id }),
    });
    load();
  }

  if (loading) return <div className="empty"><div className="empty-text">Chargement...</div></div>;

  const devis = data?.devis || [];
  const factures = data?.factures || [];
  const totalEncaisse = factures.filter(f => f.statut === 'payée').reduce((s, f) => s + (f.total_ht || 0), 0);
  const totalAttente = factures.filter(f => ['envoyée', 'à_faire'].includes(f.statut)).reduce((s, f) => s + (f.solde_a_payer || 0), 0);

  return (
    <div>
      {/* Métriques client */}
      <div className="metrics-grid" style={{ marginBottom: 14 }}>
        <div className="metric-card accent-green">
          <div className="metric-label">CA encaissé</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{totalEncaisse.toLocaleString('fr-FR')} €</div>
        </div>
        <div className="metric-card accent-warn">
          <div className="metric-label">En attente</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{totalAttente.toLocaleString('fr-FR')} €</div>
        </div>
        <div className="metric-card">
          <div className="metric-label">Devis</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{devis.length}</div>
        </div>
        <div className="metric-card">
          <div className="metric-label">Factures</div>
          <div className="metric-value" style={{ fontSize: 20 }}>{factures.length}</div>
        </div>
      </div>

      {/* Devis */}
      <div className="card" style={{ marginBottom: 12 }}>
        <div className="card-header">
          <div className="card-title">Devis</div>
          <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowNewDevis(true)}>+ Nouveau devis</button>
        </div>
        {devis.length === 0
          ? <div className="empty"><div className="empty-text">Aucun devis pour ce client.</div></div>
          : devis.map(d => (
            <div key={d.id} className="client-row" style={{ padding: '10px 0', alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 3 }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{d.numero}</span>
                  <Badge statut={d.statut} map={STATUT_DEVIS} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>{d.periode || '—'}</div>
                <div style={{ fontSize: 11, color: 'var(--text3)' }}>
                  {(d.prestations || []).slice(0, 2).map(p => p.description).filter(Boolean).join(' · ')}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontWeight: 700, color: 'var(--accent)', fontSize: 14 }}>{(d.total_ht || 0).toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6 }}>Acompte : {d.acompte_montant || 0} €</div>
                <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end' }}>
                  {d.statut === 'brouillon' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'envoyé')}>📤 Envoyer</button>}
                  {d.statut === 'envoyé' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'signé')}>✍️ Signé</button>}
                  {d.statut === 'signé' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('devis', d.id, 'validé')}>✅ Valider</button>}
                  {['validé', 'signé'].includes(d.statut) && !d.factures_liees?.length && (
                    <button className="btn btn-primary" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => creerFacture(d)}>🧾 Facturer</button>
                  )}
                  <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => printDevis(d)} title="Télécharger PDF">🖨</button>
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {/* Factures */}
      <div className="card">
        <div className="card-header">
          <div className="card-title">Factures</div>
        </div>
        {factures.length === 0
          ? <div className="empty"><div className="empty-text">Aucune facture. Créez un devis et validez-le pour générer une facture.</div></div>
          : factures.map(f => (
            <div key={f.id} className="client-row" style={{ padding: '10px 0', alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 3 }}>
                  <span style={{ fontWeight: 600, fontSize: 13 }}>{f.numero}</span>
                  <Badge statut={f.statut} map={STATUT_FACT} />
                </div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>{f.periode || '—'}</div>
                {f.devis_numero && <div style={{ fontSize: 11, color: 'var(--text3)' }}>Devis lié : {f.devis_numero}</div>}
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontWeight: 700, color: 'var(--accent)', fontSize: 14 }}>{(f.total_ht || 0).toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6 }}>Solde : {f.solde_a_payer || 0} €</div>
                <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end' }}>
                  {f.statut === 'à_faire' && <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('factures', f.id, 'envoyée')}>📤 Envoyer</button>}
                  {f.statut === 'envoyée' && <button className="btn btn-primary" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => changeStatut('factures', f.id, 'payée')}>✅ Payée</button>}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {showNewDevis && (
        <NewDevisModal
          onClose={() => setShowNewDevis(false)}
          onCreated={() => { load(); setShowNewDevis(false); }}
          defaultClientSlug={slug}
          defaultClientNom={nomClient}
        />
      )}
    </div>
  );
}

// ── Vue détail projet ─────────────────────────────────────────────────────────

function ProjetDetailView({ projet, clientMeta, onBack, onRefresh, driveProjetsFolderId }) {
  const [tab, setTab] = useState('infos');
  const [subventions, setSubventions] = useState(projet.subventions || []);
  const [showAddSub, setShowAddSub] = useState(false);
  const [statut, setStatut] = useState(projet.statut || 'en_construction');
  const [savingStatut, setSavingStatut] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [showDeleteProjet, setShowDeleteProjet] = useState(false);
  const [deleting, setDeleting] = useState(false);

  const cd = clientMeta.client_data || {};
  const slug = clientMeta.slug;

  async function deleteProjet() {
    setDeleting(true);
    try {
      const res = await fetch(`${API}/clients/${slug}/projets/${projet.slug}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(await res.text());
      if (onRefresh) onRefresh();
      onBack();
    } catch (e) {
      alert('Erreur suppression projet : ' + e.message);
    } finally {
      setDeleting(false);
    }
  }
  const slug = clientMeta.slug;

  const STATUTS = [
    { val: 'en_construction', label: 'En construction', color: 'badge-gray' },
    { val: 'en_cours', label: 'En cours', color: 'badge-info' },
    { val: 'depose', label: 'Déposé', color: 'badge-warn' },
    { val: 'realise', label: 'Réalisé', color: 'badge-green' },
    { val: 'archive', label: 'Archivé', color: 'badge-gray' },
  ];

  const SUB_STATUTS = ['À préparer', 'Déposée', 'En instruction', 'Accordée', 'Refusée', 'Versée'];

  async function saveStatut(newStatut) {
    setSavingStatut(true);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/statut`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
      setStatut(newStatut);
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
    finally { setSavingStatut(false); }
  }

  async function addSubvention(sub) {
    const updated = [...subventions, { ...sub, id: Date.now() }];
    setSubventions(updated);
    setShowAddSub(false);
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub),
      });
      if (onRefresh) onRefresh();
    } catch (e) { console.error(e); }
  }

  async function updateSubStatut(id, newStatut) {
    setSubventions(prev => prev.map(s => s.id === id ? { ...s, statut: newStatut } : s));
    try {
      await fetch(`${API}/clients/${slug}/projets/${projet.slug}/subventions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut: newStatut }),
      });
    } catch (e) { console.error(e); }
  }

  const totalDemande = subventions.reduce((s, x) => s + (Number(x.montant_demande) || 0), 0);
  const totalAccorde = subventions.reduce((s, x) => s + (Number(x.montant_accorde) || 0), 0);

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button className="btn btn-desktop-back" onClick={onBack} style={{ padding: '6px 10px' }}>← Projets</button>
        <div className="client-avatar" style={{ background: 'var(--info-light)', color: 'var(--info)', borderRadius: 8, width: 40, height: 40 }}>
          {projet.nom?.slice(0, 2).toUpperCase()}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{projet.nom}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>
            {cd.nom_usuel || cd.nom_officiel}
            {projet.lieu && ` · ${projet.lieu}`}
            {projet.dates?.debut && ` · ${projet.dates.debut}`}
          </div>
        </div>
        {/* Sélecteur statut */}
        <select
          value={statut}
          onChange={e => saveStatut(e.target.value)}
          disabled={savingStatut}
          style={{ padding: '6px 10px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border2)', fontSize: 12, background: 'var(--surface)', cursor: 'pointer' }}
        >
          {STATUTS.map(s => <option key={s.val} value={s.val}>{s.label}</option>)}
        </select>
        <button className="btn" style={{ color: 'var(--danger)', borderColor: 'var(--danger)', fontSize: 12 }}
          onClick={() => setShowDeleteProjet(true)}>🗑 Supprimer le projet</button>
      </div>

      {/* Confirmation suppression projet */}
      {showDeleteProjet && (
        <div className="modal-overlay" onClick={() => setShowDeleteProjet(false)}>
          <div className="modal" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="modal-title">🗑 Supprimer ce projet ?</div>
            <div className="modal-sub">Cette action est irréversible. Le projet <strong>{projet.nom}</strong> sera définitivement supprimé du dossier client <strong>{cd.nom_usuel || cd.nom_officiel}</strong>. Les fichiers Drive associés ne seront pas supprimés.</div>
            <div className="modal-footer">
              <button className="btn" onClick={() => setShowDeleteProjet(false)}>Annuler</button>
              <button className="btn" style={{ background: 'var(--danger)', color: 'white', borderColor: 'var(--danger)' }}
                onClick={deleteProjet} disabled={deleting}>
                {deleting ? 'Suppression...' : 'Supprimer définitivement'}
              </button>
            </div>
          </div>
        </div>

// ── Modal synchronisation Excel ───────────────────────────────────────────────

function SyncModal({ projet, clientMeta, onClose, onTaskCreated }) {
  const [step, setStep] = useState('confirm'); // confirm | loading | result
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const slug = clientMeta.slug;

  async function runSync() {
    setStep('loading');
    try {
      const res = await fetch(`${API}/clients/${slug}/projets/${projet.slug}/sync`, {
        method: 'POST',
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setResult(data);
      setStep('result');
    } catch (e) {
      setError(e.message);
      setStep('confirm');
    }
  }

  async function valider() {
    try {
      await fetch(`${API}/taches/${result.task_id}/valider`, { method: 'POST' });
      onTaskCreated();
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">🔄 Synchroniser les Excel</div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {step === 'confirm' && (
          <>
            <div className="modal-sub">
              Claude va analyser les deux fichiers Excel du projet et l'Excel Association, vérifier la cohérence des données, et proposer les mises à jour nécessaires.
            </div>
            <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '12px 14px', fontSize: 13, marginBottom: 16 }}>
              <div style={{ fontWeight: 500, marginBottom: 8 }}>Ce qui sera vérifié :</div>
              <div style={{ color: 'var(--text2)', lineHeight: 1.8 }}>
                • Les infos de l'Association (SIRET, nom, contacts) sont-elles à jour dans le Dossier Subvention ?<br/>
                • Les taux de charges correspondent-ils aux paramètres actuels ?<br/>
                • Le bilan de l'Association reflète-t-il les données du projet ?<br/>
                • Des informations manquantes ou incohérentes ?
              </div>
            </div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16 }}>
              📖 <a href="https://docs.google.com/spreadsheets" target="_blank" style={{ color: 'var(--accent)' }}>Consulter la documentation de synchronisation</a> pour comprendre les règles appliquées.
            </div>
            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Annuler</button>
              <button className="btn btn-primary" onClick={runSync}>Lancer l'analyse →</button>
            </div>
          </>
        )}

        {step === 'loading' && (
          <div className="empty" style={{ padding: '40px 0' }}>
            <div style={{ fontSize: 24, marginBottom: 12 }}>⏳</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Claude analyse les fichiers…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Lecture des Excel Association + Projet en cours</div>
          </div>
        )}

        {step === 'result' && result && (
          <>
            <div style={{ background: result.nb_ecarts > 0 ? 'var(--warn-light)' : 'var(--accent-light)', borderRadius: 6, padding: '10px 14px', marginBottom: 14, fontSize: 13 }}>
              {result.nb_ecarts > 0
                ? <><strong>{result.nb_ecarts} écart(s) détecté(s)</strong> — une tâche de validation a été créée</>
                : <><strong>✅ Tout est synchronisé</strong> — aucune modification nécessaire</>
              }
            </div>

            {result.ecarts && result.ecarts.length > 0 && (
              <div style={{ maxHeight: 250, overflowY: 'auto', marginBottom: 14 }}>
                {result.ecarts.map((e, i) => (
                  <div key={i} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                    <div style={{ fontWeight: 500 }}>{e.description}</div>
                    <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{e.fichier} · {e.champ}</div>
                    {e.valeur_asso && <div style={{ fontSize: 12, color: 'var(--accent)', marginTop: 2 }}>Association : {e.valeur_asso} → Projet : {e.valeur_projet}</div>}
                  </div>
                ))}
              </div>
            )}

            {result.analyse_claude && (
              <div style={{ background: 'var(--surface2)', borderRadius: 6, padding: '10px 14px', fontSize: 12, color: 'var(--text2)', marginBottom: 14 }}>
                <div style={{ fontWeight: 600, marginBottom: 4 }}>Analyse Claude :</div>
                {result.analyse_claude}
              </div>
            )}

            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Fermer</button>
              {result.task_id && (
                <button className="btn btn-primary" onClick={valider}>
                  ✓ Valider et appliquer →
                </button>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Tâches view ───────────────────────────────────────────────────────────────

function TachesView({ taches, setTaches }) {
  const [filterStatut, setFilterStatut] = useState('pending');
  const [filterCategorie, setFilterCategorie] = useState('all');
  const [showNew, setShowNew] = useState(false);
  const [newTask, setNewTask] = useState({ titre: '', description: '', priorite: 'Normal', categorie: 'admin', client_detecte: '', deadline: '' });

  // Catégories avec couleurs et icônes
  const CATEGORIES = {
    finance:        { label: 'Finance',        icon: '💰', color: '#1B5E20', bg: '#E8F5E9' },
    gestion_client: { label: 'Gestion client', icon: '👥', color: '#1565C0', bg: '#E3F2FD' },
    subvention:     { label: 'Subvention',     icon: '🏛', color: '#6A1B9A', bg: '#F3E5F5' },
    admin:          { label: 'Admin',          icon: '📋', color: '#E65100', bg: '#FFF3E0' },
    comm:           { label: 'Comm',           icon: '📣', color: '#00695C', bg: '#E0F2F1' },
    devis:          { label: 'Devis',          icon: '📝', color: '#5D4037', bg: '#EFEBE9' },
    facture:        { label: 'Facture',        icon: '🧾', color: '#37474F', bg: '#ECEFF1' },
    manuel:         { label: 'Manuel',         icon: '✏️', color: '#546E7A', bg: '#ECEFF1' },
    relance_devis:  { label: 'Relance devis',  icon: '🔔', color: '#F57F17', bg: '#FFFDE7' },
    relance_facture:{ label: 'Relance paiement',icon: '⚠️', color: '#B71C1C', bg: '#FFEBEE' },
    acompte:        { label: 'Acompte',        icon: '💳', color: '#1565C0', bg: '#E3F2FD' },
    validation:     { label: 'Validation',     icon: '✅', color: '#2E7D32', bg: '#E8F5E9' },
    archivage:      { label: 'Archivage',      icon: '📦', color: '#455A64', bg: '#ECEFF1' },
  };

  function catFor(t) {
    if (t.type && CATEGORIES[t.type]) return t.type;
    if (t.categorie && CATEGORIES[t.categorie]) return t.categorie;
    // Détection automatique depuis source/type
    if (t.type === 'validation_import') return 'gestion_client';
    if (t.type === 'sync_excel') return 'admin';
    if (t.source === 'Gmail') return 'gestion_client';
    if (t.source === 'Facture') return 'facture';
    if (t.source === 'Devis') return 'devis';
    if (t.source === 'Faisabilité') return 'subvention';
    if (t.source === 'Création client') return 'gestion_client';
    return 'admin';
  }

  // Filtre
  const filtered = taches.filter(t => {
    const statutOk = filterStatut === 'all' ? true : filterStatut === 'pending' ? !t.done : t.done;
    const catOk = filterCategorie === 'all' ? true : catFor(t) === filterCategorie;
    return statutOk && catOk;
  });

  // Compte par catégorie (non terminées)
  const countsByCat = {};
  taches.filter(t => !t.done).forEach(t => {
    const c = catFor(t);
    countsByCat[c] = (countsByCat[c] || 0) + 1;
  });

  function toggle(id) {
    setTaches(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
    const task = taches.find(t => t.id === id);
    if (task) {
      fetch(`${API}/taches/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !task.done }),
      }).catch(() => {});
    }
  }

  async function createTask() {
    if (!newTask.titre) return;
    try {
      const res = await fetch(`${API}/taches`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newTask),
      });
      if (res.ok) {
        const t = await res.json();
        setTaches(prev => [t, ...prev]);
        setShowNew(false);
        setNewTask({ titre: '', description: '', priorite: 'Normal', categorie: 'admin', client_detecte: '', deadline: '' });
      }
    } catch {}
  }

  const urgentCount = taches.filter(t => !t.done && t.priorite === 'URGENT').length;

  return (
    <div>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 15, fontWeight: 600 }}>
            Tâches
            {urgentCount > 0 && <span style={{ marginLeft: 8, background: 'var(--danger)', color: 'white', fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 10 }}>{urgentCount} urgentes</span>}
          </div>
        </div>
        <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowNew(true)}>+ Nouvelle tâche</button>
      </div>

      {/* Filtres catégorie — chips horizontaux */}
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
        <button
          onClick={() => setFilterCategorie('all')}
          style={{ padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 500, border: '1.5px solid', cursor: 'pointer', transition: 'all 0.15s',
            background: filterCategorie === 'all' ? 'var(--accent)' : 'var(--surface)',
            color: filterCategorie === 'all' ? 'white' : 'var(--text2)',
            borderColor: filterCategorie === 'all' ? 'var(--accent)' : 'var(--border2)',
          }}>
          Toutes {filterStatut === 'pending' && `(${taches.filter(t => !t.done).length})`}
        </button>
        {Object.entries(CATEGORIES).map(([key, cat]) => {
          const count = countsByCat[key] || 0;
          if (count === 0 && filterStatut === 'pending') return null;
          return (
            <button key={key}
              onClick={() => setFilterCategorie(key)}
              style={{ padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 500, border: '1.5px solid', cursor: 'pointer', transition: 'all 0.15s',
                background: filterCategorie === key ? cat.color : cat.bg,
                color: filterCategorie === key ? 'white' : cat.color,
                borderColor: cat.color + '40',
              }}>
              {cat.icon} {cat.label} {count > 0 && `(${count})`}
            </button>
          );
        })}
      </div>

      {/* Filtres statut */}
      <div className="tabs" style={{ marginBottom: 14 }}>
        {[['pending', 'En cours'], ['all', 'Toutes'], ['done', 'Terminées']].map(([k, l]) => (
          <button key={k} className={`tab ${filterStatut === k ? 'active' : ''}`} onClick={() => setFilterStatut(k)}>{l}</button>
        ))}
      </div>

      {/* Liste */}
      <div className="card">
        {filtered.length === 0 && (
          <div className="empty">
            <div className="empty-icon">✅</div>
            <div className="empty-text">{filterStatut === 'pending' ? 'Aucune tâche en cours dans cette catégorie.' : 'Aucune tâche.'}</div>
          </div>
        )}
        {filtered.map(t => {
          const cat = CATEGORIES[catFor(t)] || CATEGORIES.admin;
          return (
            <div key={t.id} className="task-row" style={{ alignItems: 'flex-start', padding: '12px 0' }}>
              <div className={`task-check ${t.done ? 'done' : ''}`} onClick={() => toggle(t.id)} style={{ marginTop: 2 }}>
                {t.done && <svg width="10" height="10" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" /></svg>}
              </div>
              <div className="task-body" style={{ opacity: t.done ? 0.4 : 1, flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3, flexWrap: 'wrap' }}>
                  {/* Badge catégorie */}
                  <span style={{ background: cat.bg, color: cat.color, fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 10 }}>
                    {cat.icon} {cat.label}
                  </span>
                  {/* Badge priorité */}
                  {!t.done && t.priorite === 'URGENT' && (
                    <span style={{ background: 'var(--danger-light)', color: 'var(--danger)', fontSize: 10, fontWeight: 700, padding: '2px 7px', borderRadius: 10 }}>URGENT</span>
                  )}
                  {!t.done && t.priorite === 'Attention' && (
                    <span style={{ background: 'var(--warn-light)', color: 'var(--warn)', fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 10 }}>Attention</span>
                  )}
                </div>
                <div className="task-title" style={{ textDecoration: t.done ? 'line-through' : 'none' }}>{t.titre}</div>
                <div className="task-meta" style={{ marginTop: 3 }}>
                  {t.client_detecte && <span>{t.client_detecte} · </span>}
                  <span>Source : {t.source}</span>
                  {t.deadline && <span> · ⏰ {t.deadline}</span>}
                </div>
                {t.description && !t.done && (
                  <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 4, fontStyle: 'italic' }}>
                    {t.description.slice(0, 120)}{t.description.length > 120 ? '…' : ''}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Modal nouvelle tâche */}
      {showNew && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
          <div className="modal">
            <div className="modal-title">✏️ Nouvelle tâche</div>

            <div className="form-group">
              <label className="form-label">Titre *</label>
              <input className="form-input" value={newTask.titre} onChange={e => setNewTask(p => ({ ...p, titre: e.target.value }))}
                placeholder="Relancer HOB pour les statuts..." autoFocus />
            </div>

            <div className="form-grid">
              <div className="form-group">
                <label className="form-label">Catégorie</label>
                <select className="form-input" value={newTask.categorie} onChange={e => setNewTask(p => ({ ...p, categorie: e.target.value }))}>
                  {Object.entries(CATEGORIES).filter(([k]) => ['finance','gestion_client','subvention','admin','comm','devis','facture','manuel'].includes(k)).map(([k, cat]) => (
                    <option key={k} value={k}>{cat.icon} {cat.label}</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Priorité</label>
                <select className="form-input" value={newTask.priorite} onChange={e => setNewTask(p => ({ ...p, priorite: e.target.value }))}>
                  <option value="Normal">Normal</option>
                  <option value="Attention">Attention</option>
                  <option value="URGENT">URGENT</option>
                </select>
              </div>
            </div>

            <div className="form-grid">
              <div className="form-group">
                <label className="form-label">Client associé</label>
                <input className="form-input" value={newTask.client_detecte} onChange={e => setNewTask(p => ({ ...p, client_detecte: e.target.value }))}
                  placeholder="Nom du client (optionnel)" />
              </div>
              <div className="form-group">
                <label className="form-label">Deadline</label>
                <input className="form-input" type="date" value={newTask.deadline} onChange={e => setNewTask(p => ({ ...p, deadline: e.target.value }))} />
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Description</label>
              <textarea className="form-input" rows={3} value={newTask.description}
                onChange={e => setNewTask(p => ({ ...p, description: e.target.value }))}
                placeholder="Détails, contexte, liens utiles..." style={{ resize: 'vertical' }} />
            </div>

            <div className="modal-footer">
              <button className="btn" onClick={() => setShowNew(false)}>Annuler</button>
              <button className="btn btn-primary" onClick={createTask} disabled={!newTask.titre}>Créer →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Communication ─────────────────────────────────────────────────────────────

function CommView({ clients }) {
  const [tab, setTab] = useState('charte');
  const [charte, setCharte] = useState(() => {
    try { return JSON.parse(localStorage.getItem('pk_charte') || 'null'); } catch { return null; }
  });
  const [showCharteEditor, setShowCharteEditor] = useState(false);

  // Générateur signature email
  const [sigForm, setSigForm] = useState({ nom: 'Pause Kreyol', titre: 'Administration de production culturelle', email: 'contact@pausekreyol.fr', telephone: '', site: 'pausekreyol.fr', slogan: '' });
  const [sigGenerated, setSigGenerated] = useState(false);

  // Générateur email client
  const [emailForm, setEmailForm] = useState({ client: '', type: 'onboarding', custom: '' });
  const [emailResult, setEmailResult] = useState('');
  const [emailLoading, setEmailLoading] = useState(false);

  function setSig(k, v) { setSigForm(p => ({ ...p, [k]: v })); }
  function setEF(k, v) { setEmailForm(p => ({ ...p, [k]: v })); }

  function saveCharte(data) {
    setCharte(data);
    try { localStorage.setItem('pk_charte', JSON.stringify(data)); } catch {}
    setShowCharteEditor(false);
  }

  async function generateEmail() {
    if (!emailForm.type && !emailForm.custom) return;
    setEmailLoading(true);
    setEmailResult('');
    try {
      const client = clients.find(c => c.slug === emailForm.client);
      const res = await fetch(`${API}/comm/generer-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_nom: client?.nom || emailForm.client || 'Client',
          type: emailForm.type,
          custom: emailForm.custom,
        }),
      });
      if (res.ok) {
        const data = await res.json();
        setEmailResult(data.email);
      }
    } catch {}
    setEmailLoading(false);
  }

  const C = charte?.couleurs || { primaire: '#F07052', secondaire: '#3D3FAA', neutre: '#F7F5F0', texte: '#1A1916' };

  return (
    <div>
      <div className="tabs" style={{ marginBottom: 16 }}>
        {[['charte', '🎨 Charte graphique'], ['signature', '✉️ Signature email'], ['emails', '📧 Modèles emails'], ['assets', '📁 Assets']].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {/* ── CHARTE GRAPHIQUE ───────────────────────────────────────────────── */}
      {tab === 'charte' && (
        <div>
          <div className="grid-2" style={{ marginBottom: 16 }}>
            {/* Couleurs */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">Palette de couleurs</div>
                <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowCharteEditor(true)}>
                  {charte ? '✏️ Modifier' : '+ Configurer'}
                </button>
              </div>
              {charte ? (
                <div>
                  {[['Couleur primaire', C.primaire], ['Couleur secondaire', C.secondaire], ['Fond / Neutre', C.neutre], ['Texte', C.texte]].map(([label, color]) => (
                    <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                      <div style={{ width: 36, height: 36, borderRadius: 8, background: color, border: '1px solid var(--border)', flexShrink: 0 }} />
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{label}</div>
                        <div style={{ fontSize: 11, color: 'var(--text3)', fontFamily: 'monospace' }}>{color}</div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="empty">
                  <div className="empty-icon">🎨</div>
                  <div className="empty-text">Configurez votre charte graphique pour centraliser les couleurs et polices.</div>
                </div>
              )}
            </div>

            {/* Typo & Identité */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">Typographie & Identité</div>
              </div>
              {charte ? (
                <div>
                  {[
                    ['Police principale', charte.typo?.principale || '—'],
                    ['Police secondaire', charte.typo?.secondaire || '—'],
                    ['Slogan', charte.identite?.slogan || '—'],
                    ['Site web', charte.identite?.site || '—'],
                    ['Email contact', charte.identite?.email || '—'],
                  ].map(([label, val]) => (
                    <div key={label} style={{ display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 13 }}>
                      <span style={{ color: 'var(--text3)' }}>{label}</span>
                      <span style={{ fontWeight: 500 }}>{val}</span>
                    </div>

                </div>

                <div className="empty"><div className="empty-text">Aucune charte configurée.</div></div>

          {/* Aperçu charte */}

            <div className="card">
              <div className="card-header"><div className="card-title">Aperçu de la charte</div></div>
              <div style={{ padding: 20, background: C.neutre, borderRadius: 'var(--radius)', border: '1px solid var(--border)' }}>
                <div style={{ fontFamily: charte.typo?.principale || 'inherit', color: C.primaire, fontSize: 24, fontWeight: 700, marginBottom: 8 }}>
                  Pause Kreyol

                  <div style={{ padding: '8px 18px', background: C.primaire, color: 'white', borderRadius: 6, fontSize: 13, fontWeight: 500 }}>Bouton principal</div>
                  <div style={{ padding: '8px 18px', background: 'white', color: C.primaire, border: `1.5px solid ${C.primaire}`, borderRadius: 6, fontSize: 13, fontWeight: 500 }}>Bouton secondaire</div>
                  <div style={{ padding: '8px 18px', background: C.secondaire, color: 'white', borderRadius: 6, fontSize: 13, fontWeight: 500 }}>Accentuation</div>

              </div>
            </div>

        </div>

      {/* ── SIGNATURE EMAIL ────────────────────────────────────────────────── */}
      {tab === 'signature' && (
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><div className="card-title">Paramètres de la signature</div></div>

              ['Nom / Structure', 'nom', 'Pause Kreyol'],
              ['Titre / Fonction', 'titre', 'Administration de production culturelle'],
              ['Email', 'email', 'contact@pausekreyol.fr'],
              ['Téléphone', 'telephone', '+33 6 XX XX XX XX'],
              ['Site web', 'site', 'pausekreyol.fr'],
              ['Slogan (optionnel)', 'slogan', 'Libérer les artistes de l\'administratif'],
            ].map(([label, key, placeholder]) => (
              <div key={key} className="form-group" style={{ marginBottom: 10 }}>
                <label className="form-label">{label}</label>
                <input className="form-input" value={sigForm[key]} onChange={e => setSig(key, e.target.value)} placeholder={placeholder} />
              </div>
            ))}
            <button className="btn btn-primary" onClick={() => setSigGenerated(true)}>Générer la signature →</button>
          </div>

          <div className="card">
            <div className="card-header">
              <div className="card-title">Aperçu</div>
              {sigGenerated && (
                <button className="btn" style={{ fontSize: 12 }} onClick={() => navigator.clipboard.writeText(document.getElementById('sig-html')?.innerText || '')}>
                  📋 Copier
                </button>
              )}
            </div>
            <div id="sig-html" style={{ fontFamily: 'Arial, sans-serif', fontSize: 13, borderLeft: `4px solid ${C.primaire}`, paddingLeft: 16, paddingTop: 8, paddingBottom: 8 }}>

              <div style={{ color: '#555', fontSize: 12, marginBottom: 6 }}>{sigForm.titre}</div>

          <div className="card">
            <div className="card-header"><div className="card-title">Générer un email</div></div>
            <div className="form-group">
              <label className="form-label">Client</label>

        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', margin: '12px 0 8px' }}>Identité</div>
        {[['Slogan', 'slogan', 'Administration de production culturelle'], ['Site web', 'site', 'pausekreyol.fr'], ['Email', 'email', 'contact@pausekreyol.fr'], ['Téléphone', 'telephone', '']].map(([label, key, ph]) => (
          <div key={key} className="form-group" style={{ marginBottom: 8 }}>
