<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PauseKreyol</title>

  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Styles PauseKreyol (éditer styles.css pour changer l'apparence) -->
  <link rel="stylesheet" href="styles.css" />

  <!-- React 18 + Babel standalone (JSX compilé à la volée) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!--
    Application React PauseKreyol — composants dans frontend/components/
    Ordre de chargement important : core en premier, app.js en dernier.
  -->
  <script type="text/babel" src="components/core.js"></script>
  <script type="text/babel" src="components/dashboard.js"></script>
  <script type="text/babel" src="components/clients.js"></script>
  <script type="text/babel" src="components/tasks.js"></script>
  <script type="text/babel" src="components/comm.js"></script>
  <script type="text/babel" src="components/calendrier.js"></script>
  <script type="text/babel" src="components/devis.js"></script>
  <script type="text/babel" src="components/subventions.js"></script>
  <script type="text/babel" src="components/ia-emailing.js"></script>
  <script type="text/babel" src="components/rh.js"></script>
  <script type="text/babel" src="components/audit.js"></script>
  <script type="text/babel" src="components/pilotage.js"></script>
  <script type="text/babel" src="components/zcal.js"></script>
  <!-- App shell : App + AppContent + LoginScreen + ReactDOM.createRoot -->
  <script type="text/babel" src="app.js"></script>
</body>

</html>
