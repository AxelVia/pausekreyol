// ── Assets Drive ──────────────────────────────────────────────────────────────

function AssetsList() {
  const [assets, setAssets] = useState(() => {
    try { return JSON.parse(localStorage.getItem('pk_assets') || '[]'); } catch { return []; }
  });
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ nom: '', type: 'logo', url: '', note: '' });

  const TYPES = {
    logo: { label: 'Logo', icon: '🖼' },
    charte: { label: 'Charte graphique', icon: '🎨' },
    template: { label: 'Template', icon: '📄' },
    photo: { label: 'Photo / Visuel', icon: '📷' },
    video: { label: 'Vidéo', icon: '🎬' },
    autre: { label: 'Autre', icon: '📁' },
  };

  function save(list) {
    setAssets(list);
    try { localStorage.setItem('pk_assets', JSON.stringify(list)); } catch {}
  }

  function addAsset() {
    if (!form.nom || !form.url) return;
    save([...assets, { id: Date.now(), ...form }]);
    setForm({ nom: '', type: 'logo', url: '', note: '' });
    setShowAdd(false);
  }

  return (
    <div>
      <div style={{ marginBottom: 14, display: 'flex', justifyContent: 'flex-end' }}>
        <button className="btn btn-primary" style={{ fontSize: 12 }} onClick={() => setShowAdd(true)}>+ Ajouter un asset</button>
      </div>

      {assets.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📁</div>
          <div className="empty-text">Ajoutez des liens vers vos fichiers Drive (logos, chartes, templates...)</div>
        </div>
      ) : (
        <div>
          {Object.entries(TYPES).map(([type, { label, icon }]) => {
            const typeAssets = assets.filter(a => a.type === type);
            if (!typeAssets.length) return null;
            return (
              <div key={type} style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', marginBottom: 8 }}>{icon} {label}</div>
                {typeAssets.map(a => (
                  <div key={a.id} className="client-row" style={{ padding: '8px 0' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 500, fontSize: 13 }}>{a.nom}</div>
                      {a.note && <div style={{ fontSize: 11, color: 'var(--text3)' }}>{a.note}</div>}
                    </div>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <a href={a.url} target="_blank" rel="noopener noreferrer" className="btn" style={{ fontSize: 11, padding: '3px 10px' }}>Ouvrir →</a>
                      <button className="btn" style={{ fontSize: 11, padding: '3px 8px', color: 'var(--danger)', borderColor: 'var(--danger)' }}
                        onClick={() => save(assets.filter(x => x.id !== a.id))}>✕</button>
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal">
            <div className="modal-title">Ajouter un asset</div>
            <div className="form-group">
              <label className="form-label">Nom *</label>
              <input className="form-input" value={form.nom} onChange={e => setForm(p => ({ ...p, nom: e.target.value }))} placeholder="Logo PK couleur, Charte V2..." autoFocus />
            </div>
            <div className="form-group">
              <label className="form-label">Type</label>
              <select className="form-input" value={form.type} onChange={e => setForm(p => ({ ...p, type: e.target.value }))}>
                {Object.entries(TYPES).map(([k, { label }]) => <option key={k} value={k}>{label}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Lien Drive / URL *</label>
              <input className="form-input" value={form.url} onChange={e => setForm(p => ({ ...p, url: e.target.value }))} placeholder="https://drive.google.com/..." />
            </div>
            <div className="form-group">
              <label className="form-label">Note</label>
              <input className="form-input" value={form.note} onChange={e => setForm(p => ({ ...p, note: e.target.value }))} placeholder="Version, usage, format..." />
            </div>
            <div className="modal-footer">
              <button className="btn" onClick={() => setShowAdd(false)}>Annuler</button>
              <button className="btn btn-primary" onClick={addAsset} disabled={!form.nom || !form.url}>Ajouter →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Calendriers ───────────────────────────────────────────────────────────────

function CalendrierView({ alertes, clients }) {
  const [tab, setTab] = useState('formalites');
  const [mois, setMois] = useState(new Date().getMonth());
  const [annee, setAnnee] = useState(new Date().getFullYear());
  const [events, setEvents] = useState(() => {
    try { return JSON.parse(localStorage.getItem('pk_cal_events') || '[]'); }
    catch { return []; }
  });
  const [showAdd, setShowAdd] = useState(false);
  const [selectedDay, setSelectedDay] = useState(null);
  const [newEvent, setNewEvent] = useState({ titre: '', type: 'formalite', client: '', couleur: '#F07052', note: '' });

  function saveEvents(evts) {
    setEvents(evts);
    try { localStorage.setItem('pk_cal_events', JSON.stringify(evts)); } catch {}
  }

  function addEvent() {
    if (!newEvent.titre || !selectedDay) return;
    const evt = {
      id: Date.now(),
      date: selectedDay,
      ...newEvent,
      created_at: new Date().toISOString(),
    };
    // Persiste sur Drive
    fetch(`${API}/calendrier/event`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(evt),
    }).catch(() => {});
    saveEvents([...events, evt]);
    setShowAdd(false);
    setNewEvent({ titre: '', type: tab === 'formalites' ? 'formalite' : 'culturel', client: '', couleur: '#F07052', note: '' });
  }

  function removeEvent(id) {
    fetch(`${API}/calendrier/event/${id}`, { method: 'DELETE' }).catch(() => {});
    saveEvents(events.filter(e => e.id !== id));
  }

  // Génère les événements automatiques depuis les alertes
  function getAutoEvents() {
    const auto = [];
    (alertes || []).forEach(a => {
      if (!a.date_expiration) return;
      auto.push({
        id: `auto_${a.organisme}_${a.client}`,
        date: a.date_expiration,
        titre: `${a.organisme} — ${a.client}`,
        type: 'formalite',
        couleur: a.statut === 'EXPIRÉ' ? '#B71C1C' : a.statut === 'URGENT' ? '#E65100' : '#1565C0',
        auto: true,
        statut: a.statut,
      });
    });
    return auto;
  }

  const allEvents = [...getAutoEvents(), ...events.filter(e => e.type === tab || tab === 'formalites' ? e.type === 'formalite' : e.type === 'culturel')];
  const filteredEvents = tab === 'formalites'
    ? [...getAutoEvents(), ...events.filter(e => e.type === 'formalite')]
    : events.filter(e => e.type === 'culturel');

  // Calendrier
  const firstDay = new Date(annee, mois, 1).getDay(); // 0=dim
  const daysInMonth = new Date(annee, mois + 1, 0).getDate();
  const firstDayAdj = (firstDay + 6) % 7; // Lundi=0
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const MOIS_LABELS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  function dayStr(d) {
    return `${annee}-${String(mois+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function eventsForDay(d) {
    const ds = dayStr(d);
    return filteredEvents.filter(e => e.date === ds || e.date?.startsWith(ds));
  }

  const TYPE_COLORS = {
    formalite: '#1565C0', deadline: '#B71C1C', rdv: '#6A1B9A',
    culturel: '#F07052', festival: '#E65100', formation: '#00695C',
  };

  // Liste des événements du mois
  const monthEvents = filteredEvents
    .filter(e => e.date?.startsWith(`${annee}-${String(mois+1).padStart(2,'0')}`))
    .sort((a,b) => a.date.localeCompare(b.date));

  // Événements à venir (tous mois)
  const upcoming = filteredEvents
    .filter(e => e.date >= todayStr)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 8);

  return (
    <div>
      <div className="tabs" style={{ marginBottom: 16 }}>
        <button className={`tab ${tab === 'formalites' ? 'active' : ''}`} onClick={() => setTab('formalites')}>📋 Formalités & Échéances</button>
        <button className={`tab ${tab === 'culturel' ? 'active' : ''}`} onClick={() => setTab('culturel')}>🎭 Calendrier Culturel</button>
      </div>

      <div className="grid-2" style={{ alignItems: 'start' }}>
        {/* Calendrier */}
        <div className="card">
          {/* Navigation mois */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
            <button className="btn" style={{ padding: '4px 10px' }}
              onClick={() => { if (mois === 0) { setMois(11); setAnnee(a => a-1); } else setMois(m => m-1); }}>←</button>
            <div style={{ fontWeight: 600, fontSize: 15 }}>{MOIS_LABELS[mois]} {annee}</div>
            <button className="btn" style={{ padding: '4px 10px' }}
              onClick={() => { if (mois === 11) { setMois(0); setAnnee(a => a+1); } else setMois(m => m+1); }}>→</button>
          </div>

          {/* Grille jours de la semaine */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, marginBottom: 4 }}>
            {JOURS.map(j => (
              <div key={j} style={{ textAlign: 'center', fontSize: 10, fontWeight: 600, color: 'var(--text3)', padding: '2px 0' }}>{j}</div>
            ))}
          </div>

          {/* Grille jours */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
            {Array(firstDayAdj).fill(null).map((_, i) => <div key={`e${i}`} />)}
            {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
              const ds = dayStr(d);
              const dayEvts = eventsForDay(d);
              const isToday = ds === todayStr;
              const isSel = ds === selectedDay;
              return (
                <div key={d}
                  onClick={() => { setSelectedDay(ds); setShowAdd(true); }}
                  style={{
                    minHeight: 44, padding: '3px 4px', borderRadius: 6, cursor: 'pointer',
                    background: isToday ? 'var(--accent)' : isSel ? 'var(--accent-light)' : dayEvts.length > 0 ? '#F3F8FF' : 'var(--surface2)',
                    border: isSel ? '1.5px solid var(--accent-mid)' : isToday ? 'none' : '1px solid transparent',
                    transition: 'all 0.1s',
                  }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: isToday ? 'white' : 'var(--text)', marginBottom: 2 }}>{d}</div>
                  {dayEvts.slice(0, 2).map((e, ei) => (
                    <div key={ei} style={{
                      fontSize: 9, background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)',
                      color: 'white', borderRadius: 3, padding: '1px 3px', marginBottom: 1,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                    }}>{e.titre}</div>
                  ))}
                  {dayEvts.length > 2 && <div style={{ fontSize: 9, color: 'var(--text3)' }}>+{dayEvts.length-2}</div>}
                </div>
              );
            })}
          </div>

          {/* Légende */}
          <div style={{ marginTop: 12, display: 'flex', flexWrap: 'wrap', gap: 8, fontSize: 11, color: 'var(--text3)' }}>
            {tab === 'formalites' ? <>
              <span><span style={{ color: '#B71C1C' }}>●</span> Expiré</span>
              <span><span style={{ color: '#E65100' }}>●</span> Urgent</span>
              <span><span style={{ color: '#1565C0' }}>●</span> Échéance</span>
            </> : <>
              <span><span style={{ color: '#F07052' }}>●</span> Événement</span>
              <span><span style={{ color: '#E65100' }}>●</span> Festival</span>
              <span><span style={{ color: '#6A1B9A' }}>●</span> RDV</span>
            </>}
          </div>
        </div>

        {/* Panneau droite */}
        <div>
          {/* Prochains événements */}
          <div className="card" style={{ marginBottom: 12 }}>
            <div className="card-header">
              <div className="card-title">À venir</div>
              <button className="btn btn-primary" style={{ fontSize: 12 }}
                onClick={() => { setSelectedDay(todayStr); setShowAdd(true); }}>
                + Ajouter
              </button>
            </div>
            {upcoming.length === 0 ? (
              <div className="empty"><div className="empty-text">Aucun événement à venir.</div></div>
            ) : upcoming.map((e, i) => {
              const d = new Date(e.date + 'T00:00:00');
              const diff = Math.round((d - today) / 86400000);
              return (
                <div key={e.id} style={{ display: 'flex', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--border)', alignItems: 'flex-start' }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: 'white', lineHeight: 1 }}>{d.getDate()}</div>
                    <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.8)' }}>{MOIS_LABELS[d.getMonth()].slice(0,3)}</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500, fontSize: 13 }}>{e.titre}</div>
                    {e.client && <div style={{ fontSize: 11, color: 'var(--text3)' }}>{e.client}</div>}
                    {e.note && <div style={{ fontSize: 11, color: 'var(--text3)', fontStyle: 'italic' }}>{e.note}</div>}
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: diff <= 7 ? '#B71C1C' : diff <= 30 ? '#E65100' : 'var(--text3)' }}>
                      {diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain' : `J-${diff}`}
                    </div>
                    {!e.auto && (
                      <button onClick={() => removeEvent(e.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)', fontSize: 11 }}>✕</button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Événements du mois */}
          {monthEvents.length > 0 && (
            <div className="card">
              <div className="card-header">
                <div className="card-title">Ce mois — {MOIS_LABELS[mois]}</div>
              </div>
              {monthEvents.map((e, i) => (
                <div key={e.id} style={{ display: 'flex', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 13, alignItems: 'center' }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: e.couleur || TYPE_COLORS[e.type] || 'var(--accent)', flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <span style={{ fontWeight: 500 }}>{e.date?.slice(8,10)}/{e.date?.slice(5,7)}</span>
                    <span style={{ marginLeft: 8 }}>{e.titre}</span>
                    {e.client && <span style={{ color: 'var(--text3)', fontSize: 11, marginLeft: 6 }}>— {e.client}</span>}
                  </div>
                  {!e.auto && <button onClick={() => removeEvent(e.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text3)', fontSize: 11 }}>✕</button>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Modal ajout événement */}
      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal">
            <div className="modal-title">{tab === 'formalites' ? '📋 Ajouter une échéance' : '🎭 Ajouter un événement culturel'}</div>
            <div className="modal-sub">Date : {selectedDay?.split('-').reverse().join('/')}</div>

            <div className="form-group">
              <label className="form-label">Titre *</label>
              <input className="form-input" value={newEvent.titre} onChange={e => setNewEvent(p => ({ ...p, titre: e.target.value }))}
                placeholder={tab === 'formalites' ? "Renouvellement licence, URSSAF..." : "Festival, concert, répétition..."} autoFocus />
            </div>

            <div className="form-grid">
              <div className="form-group">
                <label className="form-label">Type</label>
                <select className="form-input" value={newEvent.type} onChange={e => setNewEvent(p => ({ ...p, type: e.target.value }))}>
                  {tab === 'formalites' ? <>
                    <option value="formalite">Formalité administrative</option>
                    <option value="deadline">Deadline / Date limite</option>
                    <option value="rdv">Rendez-vous</option>
                  </> : <>
                    <option value="culturel">Événement culturel</option>
                    <option value="festival">Festival / Spectacle</option>
                    <option value="formation">Formation / Résidence</option>
                    <option value="rdv">Rendez-vous</option>
                  </>}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Client associé</label>
                <select className="form-input" value={newEvent.client} onChange={e => setNewEvent(p => ({ ...p, client: e.target.value }))}>
                  <option value="">— Aucun —</option>
                  {clients.map(c => <option key={c.slug} value={c.nom}>{c.nom}</option>)}
                </select>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Couleur</label>
              <div style={{ display: 'flex', gap: 8 }}>
                {['#F07052','#1565C0','#B71C1C','#E65100','#6A1B9A','#00695C','#F57F17'].map(c => (
                  <div key={c} onClick={() => setNewEvent(p => ({ ...p, couleur: c }))}
                    style={{ width: 28, height: 28, borderRadius: '50%', background: c, cursor: 'pointer',
                      border: newEvent.couleur === c ? '3px solid var(--text)' : '2px solid transparent' }} />
                ))}
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Note</label>
              <input className="form-input" value={newEvent.note} onChange={e => setNewEvent(p => ({ ...p, note: e.target.value }))}
                placeholder="Détails, contacts, liens..." />
            </div>

            <div className="modal-footer">
              <button className="btn" onClick={() => setShowAdd(false)}>Annuler</button>
              <button className="btn btn-primary" onClick={addEvent} disabled={!newEvent.titre}>Ajouter →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Devis & Factures ──────────────────────────────────────────────────────────

function DevisFacturesView() {
  const [tab, setTab] = useState('devis');
  const [filterArchive, setFilterArchive] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showNewDevis, setShowNewDevis] = useState(false);

  async function load() {
    setLoading(true);
    try {
      const res = await fetch(`${API}/devis-factures/dashboard`);
      if (res.ok) setData(await res.json());
    } catch {}
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  const STATUT_DEVIS = {
    brouillon:  { label: 'Brouillon',    bg: 'var(--surface2)',    color: 'var(--text3)' },
    envoyé:     { label: 'Envoyé',       bg: 'var(--blue-light)',  color: 'var(--blue)' },
    signé:      { label: 'Signé',        bg: '#FFF3E0',            color: '#E65100' },
    validé:     { label: 'Validé',       bg: 'var(--accent-light)', color: 'var(--accent)' },
    facturé:    { label: 'Facturé',      bg: '#E8F5E9',            color: '#1B5E20' },
    annulé:     { label: '⛔ Annulé',   bg: 'var(--danger-light)', color: 'var(--danger)' },
    caduc:      { label: '⏰ Caduc',    bg: 'var(--surface2)',    color: 'var(--text3)' },
  };
  const STATUT_FACTURE = {
    à_faire:    { label: 'À faire',      bg: '#FFF3E0',            color: '#E65100' },
    envoyée:    { label: 'Envoyée',      bg: 'var(--blue-light)',  color: 'var(--blue)' },
    payée:      { label: '✅ Payée',    bg: '#E8F5E9',            color: '#1B5E20' },
    annulée:    { label: 'Annulée',      bg: 'var(--danger-light)', color: 'var(--danger)' },
    en_retard:  { label: '🚨 En retard', bg: 'var(--danger-light)', color: 'var(--danger)' },
    majoration: { label: '10% Majoration', bg: '#F3E5F5',          color: '#6A1B9A' },
  };

  function SBadge({ statut, map }) {
    const s = map[statut] || { label: statut, bg: 'var(--surface2)', color: 'var(--text3)' };
    return <span style={{ background: s.bg, color: s.color, padding: '3px 9px', borderRadius: 12, fontSize: 11, fontWeight: 600, whiteSpace: 'nowrap' }}>{s.label}</span>;
  }

  async function patchDevis(id, body) {
    await fetch(`${API}/devis/${id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    load();
  }

  async function patchFacture(id, body) {
    await fetch(`${API}/factures/${id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    load();
  }

  const d = data?.devis || {};
  const f = data?.factures || {};

  const listeDevis = (data?.liste_devis || []).filter(d =>
    filterArchive ? d.archived : !d.archived
  );
  const listeFactures = (data?.liste_factures || []).filter(f =>
    filterArchive ? ['annulée','en_retard'].includes(f.statut) && f.archived : !f.archived
  );

  return (
    <div>
      {/* Métriques */}
      <div className="metrics-grid" style={{ marginBottom: 16 }}>
        <div className="metric-card accent-green" onClick={() => setView && setView('devis')} style={{ cursor:'pointer' }}>
          <div className="metric-label">CA devis validés</div>
          <div className="metric-value">{(d.ca_devis_valides || 0).toLocaleString('fr-FR')} €</div>
          <div className="metric-sub">{d.valides || 0} devis</div>
        </div>
        <div className="metric-card accent-info">
          <div className="metric-label">CA encaissé</div>
          <div className="metric-value">{(f.ca_encaisse || 0).toLocaleString('fr-FR')} €</div>
          <div className="metric-sub">{f.payees || 0} factures payées</div>
        </div>
        <div className="metric-card accent-warn">
          <div className="metric-label">En attente paiement</div>
          <div className="metric-value">{(f.en_attente || 0).toLocaleString('fr-FR')} €</div>
          <div className="metric-sub">{f.envoyees || 0} facture(s) envoyée(s)</div>
        </div>
        <div className="metric-card">
          <div className="metric-label">Devis en cours</div>
          <div className="metric-value">{d.en_cours || 0}</div>
          <div className="metric-sub">{d.annules || 0} annulés</div>
        </div>
      </div>

      {/* Tabs + toggle archives */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div className="tabs" style={{ marginBottom: 0 }}>
          {[['devis', `Devis (${(data?.liste_devis||[]).filter(x=>!x.archived).length})`],
            ['factures', `Factures (${(data?.liste_factures||[]).filter(x=>!['annulée'].includes(x.statut)||x.type==='majoration').length})`],
            ['calendrier', '📅 Calendrier']

            <button key={k} className={`tab ${tab===k?'active':''}`} onClick={() => setTab(k)}>{l}</button>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <label style={{ fontSize: 12, color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
            <input type="checkbox" checked={filterArchive} onChange={e => setFilterArchive(e.target.checked)} />

            <div key={devis.id} style={{ padding: '14px 0', borderBottom: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>

                  <div style={{ fontSize: 12, color: 'var(--text2)', marginBottom: 2 }}>
                    <strong>{devis.client_nom}</strong>

                        </span>
                      ))}

                    <div style={{ fontSize: 11, color: 'var(--warn)', marginTop: 3 }}>

                  {/* Historique */}
                  {devis.historique?.length > 0 && (
                    <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 4 }}>
                      {devis.historique.slice(-3).map((h,i) => (
                        <span key={i} style={{ marginRight: 8 }}>{h.statut} — {h.date?.slice(0,10)}</span>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--accent)' }}>
                    {(devis.total_ht || 0).toLocaleString('fr-FR')} €
                  </div>
                  {devis.acompte_montant > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--text3)' }}>Acompte : {devis.acompte_montant} €</div>
                  )}
                  {devis.facilite_paiement && devis.facilite_paiement !== '1x' && (
                    <div style={{ fontSize: 10, background: 'var(--blue-light)', color: 'var(--blue)', padding: '1px 6px', borderRadius: 8, marginTop: 2 }}>

                    <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end', marginTop: 8, flexWrap: 'wrap' }}>
                      {devis.statut === 'brouillon' && (
                        <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => patchDevis(devis.id, { statut: 'envoyé' })}>📤 Envoyer</button>
                      )}
                      {devis.statut === 'envoyé' && (
                        <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => patchDevis(devis.id, { statut: 'signé' })}>✍️ Signé</button>
                      )}
                      {devis.statut === 'signé' && (
                        <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => patchDevis(devis.id, { statut: 'validé' })}>✅ Valider</button>
                      )}
                      {!['annulé', 'caduc', 'facturé'].includes(devis.statut) && (
                        <button className="btn" style={{ fontSize: 11, padding: '3px 8px', color: 'var(--danger)', borderColor: 'var(--danger)' }}
                          onClick={() => patchDevis(devis.id, { statut: 'annulé' })}>⛔ Annuler</button>
                      )}
                      <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => printDevis(devis)} title="PDF">🖨</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── FACTURES ── */}
      {tab === 'factures' && (
        <div className="card">
          {listeFactures.length === 0 ? (
            <div className="empty">
              <div className="empty-icon">🧾</div>
              <div className="empty-text">Aucune facture. Les factures sont générées automatiquement à la validation d'un devis.</div>
            </div>
          ) : listeFactures.map(fac => (
            <div key={fac.id} style={{ padding: '14px 0', borderBottom: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 4, flexWrap: 'wrap' }}>
                    <span style={{ fontWeight: 700, fontSize: 13 }}>{fac.numero}</span>
                    <SBadge statut={fac.type === 'majoration' ? 'majoration' : fac.statut} map={STATUT_FACTURE} />
                    {fac.type === 'majoration' && (
                      <span style={{ fontSize: 10, fontWeight: 600, color: '#6A1B9A' }}>Majoration 10% retard</span>
                    )}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--text2)', marginBottom: 2 }}>
                    <strong>{fac.client_nom}</strong>
                    {fac.devis_numero && <span style={{ color: 'var(--text3)' }}> · Devis : {fac.devis_numero}</span>}
                  </div>
                  {fac.date_echeance && fac.statut !== 'payée' && (
                    <div style={{ fontSize: 11, color: fac.statut === 'en_retard' ? 'var(--danger)' : 'var(--warn)', marginTop: 2 }}>
                      ⏰ Échéance : {fac.date_echeance}
                    </div>
                  )}
                  {/* Historique */}
                  {fac.historique?.length > 0 && (
                    <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 3 }}>
                      {fac.historique.slice(-2).map((h,i) => (
                        <span key={i} style={{ marginRight: 8 }}>{h.statut} — {h.date?.slice(0,10)}</span>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: fac.statut === 'payée' ? '#1B5E20' : 'var(--accent)' }}>
                    {(fac.total_ht || 0).toLocaleString('fr-FR')} €
                  </div>
                  {fac.solde_a_payer > 0 && fac.solde_a_payer !== fac.total_ht && (
                    <div style={{ fontSize: 11, color: 'var(--text3)' }}>Solde : {fac.solde_a_payer} €</div>
                  )}
                  <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end', marginTop: 8 }}>
                    {fac.statut === 'à_faire' && (
                      <button className="btn" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => patchFacture(fac.id, { statut: 'envoyée' })}>📤 Envoyer</button>
                    )}
                    {fac.statut === 'envoyée' && (
                      <button className="btn btn-primary" style={{ fontSize: 11, padding: '3px 8px' }} onClick={() => patchFacture(fac.id, { statut: 'payée' })}>✅ Payée</button>
                    )}
                    {fac.statut === 'envoyée' && (
                      <button className="btn" style={{ fontSize: 11, padding: '3px 8px', color: 'var(--danger)', borderColor: 'var(--danger)' }}
                        onClick={() => patchFacture(fac.id, { statut: 'en_retard' })}>🚨 J+7 impayé</button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ── CALENDRIER DEVIS/FACTURES ── */}
      {tab === 'calendrier' && (
        <CalendrierDevisFactures devis={data?.liste_devis || []} factures={data?.liste_factures || []} />
      )}

      {showNewDevis && <NewDevisModal onClose={() => setShowNewDevis(false)} onCreated={() => { load(); setShowNewDevis(false); }} />}
    </div>
  );
}

// ── Calendrier Devis/Factures ─────────────────────────────────────────────────

function CalendrierDevisFactures({ devis, factures }) {
  const today = new Date().toISOString().slice(0, 10);

  // Collecte toutes les dates importantes
  const events = [];

  devis.filter(d => !d.archived).forEach(d => {
    if (d.date_limite_signature && d.statut === 'envoyé') {
      const diff = Math.round((new Date(d.date_limite_signature.split('/').reverse().join('-')) - new Date()) / 86400000);
      events.push({
        type: 'devis_signature',
        label: `✍️ Limite signature — ${d.client_nom} (${d.numero})`,
        date: d.date_limite_signature,
        diff,
        color: diff <= 3 ? 'var(--danger)' : diff <= 7 ? 'var(--warn)' : 'var(--blue)',
        bg: diff <= 3 ? 'var(--danger-light)' : diff <= 7 ? 'var(--warn-light)' : 'var(--blue-light)',
      });
    }
    if (d.date_envoi && d.statut === 'envoyé') {
      events.push({
        type: 'devis_relance',
        label: `🔔 Relance devis J+7 — ${d.client_nom} (${d.numero})`,
        date: d.date_envoi,
        diff: 7,
        color: 'var(--warn)',
        bg: 'var(--warn-light)',
      });
    }
  });

  factures.filter(f => !['payée','annulée'].includes(f.statut)).forEach(f => {
    if (f.date_echeance) {
      const dateStr = f.date_echeance.split('/').length === 3
        ? f.date_echeance.split('/').reverse().join('-')
        : f.date_echeance;
      const diff = Math.round((new Date(dateStr) - new Date()) / 86400000);
      events.push({
        type: 'facture_echeance',
        label: `🧾 Échéance facture — ${f.client_nom} (${f.numero}) — ${(f.total_ht||0).toLocaleString('fr-FR')}€`,
        date: f.date_echeance,
        diff,
        color: diff < 0 ? 'var(--danger)' : diff <= 7 ? 'var(--warn)' : 'var(--text2)',
        bg: diff < 0 ? 'var(--danger-light)' : diff <= 7 ? 'var(--warn-light)' : 'var(--surface2)',
        montant: f.total_ht,
      });
    }
    // Échéances de paiement (1x/2x/3x)
    (f.echeances || []).forEach((e, i) => {
      events.push({
        type: 'facture_echeance_detail',
        label: `💳 ${e.label} — ${f.client_nom} — ${(e.montant||0).toLocaleString('fr-FR')}€`,
        date: e.date,
        diff: 0,
        color: 'var(--blue)',
        bg: 'var(--blue-light)',
      });
    });
  });

  const sorted = events.sort((a, b) => {
    const da = a.date?.split('/').reverse().join('-') || '';
    const db = b.date?.split('/').reverse().join('-') || '';
    return da.localeCompare(db);
  });

  const enRetard = sorted.filter(e => e.diff < 0);
  const urgent = sorted.filter(e => e.diff >= 0 && e.diff <= 7);
  const aVenir = sorted.filter(e => e.diff > 7);

  function Section({ title, items, defaultOpen = true }) {
    const [open, setOpen] = useState(defaultOpen);
    if (!items.length) return null;
    return (
      <div className="card" style={{ marginBottom: 12 }}>
        <div className="card-header" style={{ cursor: 'pointer', marginBottom: open ? 14 : 0 }} onClick={() => setOpen(!open)}>
          <div className="card-title">{title} <span style={{ fontSize: 11, color: 'var(--text3)' }}>({items.length})</span></div>
          <span style={{ fontSize: 12, color: 'var(--text3)' }}>{open ? '▲' : '▼'}</span>
        </div>
        {open && items.map((e, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', borderRadius: 6, marginBottom: 4, background: e.bg, border: `1px solid ${e.color}20` }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: e.color }}>{e.label}</div>
            </div>
            <div style={{ fontSize: 12, fontWeight: 600, color: e.color, flexShrink: 0 }}>
              {e.diff < 0 ? `J+${Math.abs(e.diff)} retard` : e.diff === 0 ? "Aujourd'hui" : e.diff === 1 ? 'Demain' : e.date}
            </div>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div>
      {enRetard.length === 0 && urgent.length === 0 && aVenir.length === 0 && (
        <div className="empty"><div className="empty-icon">📅</div><div className="empty-text">Aucune échéance devis/facture en cours.</div></div>
      )}
      <Section title="🚨 En retard" items={enRetard} />
      <Section title="⚠️ Urgent — Dans les 7 jours" items={urgent} />
      <Section title="📅 À venir" items={aVenir} defaultOpen={false} />
    </div>
  );
}

// ── Modal nouveau devis ───────────────────────────────────────────────────────

function NewDevisModal({ onClose, onCreated, defaultClientSlug = '', defaultClientNom = '' }) {
  const [clients, setClients] = useState([]);
  const [tarifs, setTarifs] = useState([]);
  const [form, setForm] = useState({
    client_slug: defaultClientSlug,
    client_nom: defaultClientNom,
    periode: '',
    acompte_pct: 30, facilite_paiement: '1x', notes: '',
  });
  const [prestations, setPrestations] = useState([
    { description: '', type: '', quantite: 1, tarif_unitaire: 0, sous_total: 0 }
  ]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    fetch(`${API}/clients`).then(r => r.json()).then(d => setClients(d || [])).catch(() => {});
    fetch(`${API}/devis/tarifs`).then(r => r.json()).then(d => setTarifs(d || [])).catch(() => {});
  }, []);

  function setF(k, v) { setForm(p => ({ ...p, [k]: v })); }

  function updatePresta(i, k, v) {
    setPrestations(prev => {
      const next = [...prev];
      next[i] = { ...next[i], [k]: v };
      if (k === 'quantite' || k === 'tarif_unitaire') {
        next[i].sous_total = (parseFloat(next[i].quantite) || 0) * (parseFloat(next[i].tarif_unitaire) || 0);
      }
      if (k === 'type') {
        const tarif = tarifs.find(t => t.label === v);
        if (tarif) {
          next[i].tarif_unitaire = tarif.tarif;
          next[i].sous_total = (parseFloat(next[i].quantite) || 1) * tarif.tarif;
          if (!next[i].description) next[i].description = v;
        }
      }
      return next;
    });
  }

  function addLine() {
    setPrestations(p => [...p, { description: '', type: '', quantite: 1, tarif_unitaire: 0, sous_total: 0 }]);
  }

  function removeLine(i) {
    setPrestations(p => p.filter((_, idx) => idx !== i));
  }

  const total = prestations.reduce((s, p) => s + (parseFloat(p.sous_total) || 0), 0);
  const acompte = Math.round(total * (parseFloat(form.acompte_pct) || 0) / 100 * 100) / 100;
  const solde = Math.round((total - acompte) * 100) / 100;

  async function submit() {
    if (!form.client_nom) { setError('Client obligatoire'); return; }
    if (!prestations.some(p => p.description)) { setError('Au moins une prestation obligatoire'); return; }
    setLoading(true);
    try {
      const res = await fetch(`${API}/devis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...form, prestations, total_ht: total }),
      });
      if (!res.ok) throw new Error(await res.text());
      onCreated();
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ width: 640, maxHeight: '90vh', overflowY: 'auto' }}>
        <div className="modal-title">📝 Nouveau devis</div>
        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 12 }}>{error}</div>}

        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Client *</label>
            <select className="form-input" value={form.client_slug}
              onChange={e => {
                const c = clients.find(x => x.slug === e.target.value);
                setF('client_slug', e.target.value);
                setF('client_nom', c ? (c.nom || c.nom_officiel) : '');
              }}>
              <option value="">Sélectionner...</option>
              {clients.map(c => <option key={c.slug} value={c.slug}>{c.nom || c.nom_officiel}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Période</label>
            <input className="form-input" value={form.periode} onChange={e => setF('periode', e.target.value)} placeholder="du JJ/MM/AAAA au JJ/MM/AAAA" />
          </div>
        </div>

        {/* Prestations */}
        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Prestations *</div>
        {prestations.map((p, i) => (
          <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 8, alignItems: 'flex-end' }}>
            <div style={{ flex: 2 }}>
              <input className="form-input" style={{ fontSize: 12 }} value={p.description}
                onChange={e => updatePresta(i, 'description', e.target.value)} placeholder="Description" />
            </div>
            <div style={{ flex: 1.5 }}>
              <select className="form-input" style={{ fontSize: 12 }} value={p.type}
                onChange={e => updatePresta(i, 'type', e.target.value)}>
                <option value="">Type / formule</option>
                {tarifs.map(t => <option key={t.label} value={t.label}>{t.label} ({t.tarif} {t.unite})</option>)}
              </select>
            </div>
            <div style={{ width: 60 }}>
              <input className="form-input" style={{ fontSize: 12 }} type="number" value={p.quantite}
                onChange={e => updatePresta(i, 'quantite', e.target.value)} min="0" step="0.5" />
            </div>
            <div style={{ width: 80 }}>
              <input className="form-input" style={{ fontSize: 12 }} type="number" value={p.tarif_unitaire}
                onChange={e => updatePresta(i, 'tarif_unitaire', e.target.value)} />
            </div>
            <div style={{ width: 80, textAlign: 'right', fontWeight: 600, fontSize: 13, paddingBottom: 8 }}>
              {(p.sous_total || 0).toLocaleString('fr-FR')} €
            </div>
            <button onClick={() => removeLine(i)} style={{ background: 'none', border: 'none', color: 'var(--danger)', cursor: 'pointer', paddingBottom: 8 }}>✕</button>
          </div>
        ))}
        <button className="btn" style={{ fontSize: 12, marginBottom: 14 }} onClick={addLine}>+ Ligne</button>

        {/* Totaux */}
        <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '12px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 13 }}>
            <span>Total HT</span><strong>{total.toLocaleString('fr-FR')} €</strong>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 12, color: 'var(--text3)' }}>
            <span>TVA — Non applicable (Art. 293B du CGI)</span><span>0 €</span>
          </div>
          <div className="divider" />
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 6 }}>
            <span style={{ fontSize: 12 }}>Acompte (%)</span>
            <input type="number" className="form-input" style={{ width: 70, fontSize: 12 }}
              value={form.acompte_pct} onChange={e => setF('acompte_pct', e.target.value)} />
            <span style={{ fontSize: 13, fontWeight: 500 }}>{acompte.toLocaleString('fr-FR')} €</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
            <span>Solde à la livraison</span><strong>{solde.toLocaleString('fr-FR')} €</strong>
          </div>
        </div>

        <div className="form-grid">
          <div className="form-group">
            <label className="form-label">Facilité de paiement</label>
            <select className="form-input" value={form.facilite_paiement} onChange={e => setF('facilite_paiement', e.target.value)}>
              <option value="1x">1 fois (standard)</option>
              <option value="2x">2 fois</option>
              <option value="3x">3 fois</option>
              <option value="manuel">Manuel (délais personnalisés)</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes} onChange={e => setF('notes', e.target.value)} placeholder="Conditions particulières..." />
          </div>
        </div>

        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? 'Création…' : 'Créer le devis →'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Modal nouveau client ──────────────────────────────────────────────────────

// ── Nouveau client — flux obligatoire par Excel ───────────────────────────────

function NewClientModal({ onClose, onCreated }) {
  const [step, setStep] = useState('intro');    // intro | upload | preview | creating | done
  const [file, setFile] = useState(null);
  const [parsed, setParsed] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [devisAudit, setDevisAudit] = useState(false); // option devis audit

  const LABELS = {
    nom_officiel: 'Nom officiel', nom_usuel: 'Nom usuel', siret: 'SIRET',
    ninea: 'NINEA', rccm: 'RCCM', statut_juridique: 'Statut juridique',
    implantation: 'Implantation', categorie: 'Catégorie', marche_cible: 'Marché cible',
    domaines_artistiques: 'Domaines artistiques', president: 'Président(e)',
    email_contact: 'Email', telephone: 'Téléphone', adresse_siege: 'Adresse',
    date_creation: 'Date création', date_derniere_ag: 'Dernière AG',
    clotures_comptables: 'Clôtures comptables', licence_statut: 'Licence spectacle',
    licence_type1: 'N° licence', banque: 'Banque', iban: 'IBAN',
    societe_droits: 'Société droits', pays: 'Pays',
  };

  // Calcul des warnings métier
  function getWarnings(cd) {
    const warns = [];
    const cat = (cd.categorie || '').toLowerCase();
    const dom = (cd.domaines_artistiques || '').toLowerCase();
    const impl = (cd.implantation || '').toLowerCase();

    if ((cat.includes('diffuseur')) && !cd.licence_type1)
      warns.push({ level: 'error', msg: '🚫 Licence entrepreneur du spectacle obligatoire pour tout diffuseur — impossible de créer des projets sans.' });
    if (cd.type_structure === 'asso_france' && !cd.date_derniere_ag)
      warns.push({ level: 'warn', msg: '⚠️ Date de dernière AG manquante — obligatoire pour les associations.' });
    if (cd.type_structure === 'asso_france' && !cd.numero_rna)
      warns.push({ level: 'info', msg: 'ℹ️ Numéro RNA non renseigné — à collecter.' });
    if ((dom.includes('écriture') || dom.includes('ecrivain') || dom.includes('littérature')) && !cd.societe_droits)
      warns.push({ level: 'warn', msg: '⚠️ Auteur/écrivain détecté — affiliation SCAM/SACD recommandée.' });
    if (impl.includes('antilles') || impl.includes('martinique') || impl.includes('guadeloupe'))
      warns.push({ level: 'info', msg: 'ℹ️ Implantation Antilles — régime fiscal et caisses sociales spécifiques (CGSS, AT-MP).' });
    if (impl.includes('sénégal') || impl.includes('senegal'))
      warns.push({ level: 'info', msg: 'ℹ️ Implantation Sénégal — régime OHADA, caisses IPRES/CSS.' });
    if (!cd.iban)
      warns.push({ level: 'warn', msg: '⚠️ RIB/IBAN manquant — requis pour les paiements et subventions.' });
    return warns;
  }

  async function handleUpload(f) {
    setFile(f);
    setError('');
    setLoading(true);
    const form = new FormData();
    form.append('file', f);
    try {
      const res = await fetch(`${API}/import/parse`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Erreur analyse');
      if (data.erreur) throw new Error(data.erreur);
      if (data.type_fichier === 'unknown')
        throw new Error('Format non reconnu. Utilisez TEMPLATE_FICHE_CLIENT_V2.xlsx');
      setParsed(data);
      setStep('preview');
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  async function handleCreate() {
    setStep('creating');
    setLoading(true);
    const form = new FormData();
    form.append('file', file);
    form.append('devis_audit', devisAudit ? '1' : '0');
    try {
      const res = await fetch(`${API}/import/create-client`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Erreur création');
      setStep('done');
      setTimeout(() => { onCreated(); onClose(); }, 1800);
    } catch (e) {
      setError(e.message);
      setStep('preview');
    } finally {
      setLoading(false);
    }
  }

  const cd = parsed?.client_data || {};
  const warnings = parsed ? getWarnings(cd) : [];
  const hasBlocker = warnings.some(w => w.level === 'error');
  const manquants = parsed?.champs_manquants || [];

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ width: 600 }}>

        {/* ── INTRO ────────────────────────────────────────────────────────── */}
        {step === 'intro' && (
          <>
            <div className="modal-title">📁 Nouveau dossier client</div>
            <div className="modal-sub">La création d'un dossier client nécessite la fiche de renseignements complétée.</div>

            <div style={{ background: 'var(--accent-light)', borderRadius: 'var(--radius-sm)', padding: '14px 16px', marginBottom: 16 }}>
              <div style={{ fontWeight: 600, fontSize: 13, color: 'var(--accent)', marginBottom: 8 }}>📋 Processus de création</div>
              {[
                ['1', 'Téléchargez et envoyez la fiche au client', 'TEMPLATE_FICHE_CLIENT_V2.xlsx'],
                ['2', 'Le client la remplit et vous la retourne'],
                ['3', 'Importez le fichier complété ici'],
                ['4', 'Vérifiez les données et validez la création'],
              ].map(([n, label, link]) => (
                <div key={n} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 6, fontSize: 13 }}>
                  <div style={{ width: 20, height: 20, borderRadius: '50%', background: 'var(--accent)', color: 'white', fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{n}</div>
                  <div>
                    {label}
                    {link && <> — <a href={`${API}/templates/fiche-client-v2`} target="_blank" style={{ color: 'var(--accent)', fontWeight: 500 }}>Télécharger le template →</a></>}
                  </div>
                </div>
              ))}
            </div>

            <div
              style={{ border: '2px dashed var(--border2)', borderRadius: 'var(--radius)', padding: '28px', textAlign: 'center', cursor: 'pointer', background: 'var(--surface2)' }}
              onClick={() => document.getElementById('nc-file-input').click()}
            >
              <div style={{ fontSize: 28, marginBottom: 8 }}>📊</div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>Importer la fiche client complétée</div>
              <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>TEMPLATE_FICHE_CLIENT_V2.xlsx (.xlsx uniquement)</div>
              <input id="nc-file-input" type="file" accept=".xlsx,.xls" style={{ display: 'none' }}
                onChange={e => e.target.files[0] && handleUpload(e.target.files[0])} />
            </div>

            {loading && <div style={{ textAlign: 'center', padding: 16, color: 'var(--text3)', fontSize: 13 }}>Analyse du fichier…</div>}
            {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginTop: 12 }}>{error}</div>}

            <div className="modal-footer">
              <button className="btn" onClick={onClose}>Annuler</button>
            </div>
          </>
        )}

        {/* ── PREVIEW ──────────────────────────────────────────────────────── */}
        {step === 'preview' && parsed && (
          <>
            <div className="modal-title">✅ Vérification du dossier</div>
            <div className="modal-sub">{parsed.nb_champs} champs extraits depuis {file?.name}</div>

            {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 12 }}>{error}</div>}

            {/* Warnings métier */}
            {warnings.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                {warnings.map((w, i) => (
                  <div key={i} style={{
                    padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 6,
                    background: w.level === 'error' ? 'var(--danger-light)' : w.level === 'warn' ? 'var(--warn-light)' : 'var(--info-light)',
                    color: w.level === 'error' ? 'var(--danger)' : w.level === 'warn' ? 'var(--warn)' : 'var(--info)',
                  }}>{w.msg}</div>
                ))}
              </div>
            )}

            {/* Champs manquants */}
            {manquants.length > 0 && (
              <div style={{ background: '#FFF8E1', border: '1px solid #F59E0B', borderRadius: 6, padding: '8px 12px', marginBottom: 14, fontSize: 12 }}>
                <strong>Champs manquants :</strong> {manquants.join(', ')}
              </div>
            )}

            {/* Données extraites */}
            <div style={{ maxHeight: 240, overflowY: 'auto', marginBottom: 14, border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)' }}>
              {Object.entries(cd).filter(([k, v]) => v && k !== 'type_structure' && k !== 'documents_fournis' && k !== 'emails_surveillance').map(([k, v], i) => (
                <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 10px', borderBottom: '1px solid var(--border)', fontSize: 12, background: i % 2 === 0 ? 'var(--surface)' : 'var(--surface2)' }}>
                  <span style={{ color: 'var(--text3)', flexShrink: 0 }}>{LABELS[k] || k}</span>
                  <span style={{ fontWeight: 500, maxWidth: '60%', textAlign: 'right' }}>{String(v)}</span>
                </div>
              ))}
            </div>

            {/* Badge type structure */}
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14, fontSize: 13 }}>
              <span style={{ background: 'var(--accent-light)', color: 'var(--accent)', padding: '4px 10px', borderRadius: 20, fontWeight: 500, fontSize: 12 }}>
                {cd.statut_juridique || cd.type_structure}
              </span>
              {cd.implantation && <span style={{ background: 'var(--info-light)', color: 'var(--info)', padding: '4px 10px', borderRadius: 20, fontSize: 12 }}>{cd.implantation}</span>}
              {cd.categorie && <span style={{ background: 'var(--warn-light)', color: 'var(--warn)', padding: '4px 10px', borderRadius: 20, fontSize: 12 }}>{cd.categorie}</span>}
            </div>

            {/* Option devis audit */}
            <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '10px 12px', marginBottom: 4, fontSize: 13 }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
                <input type="checkbox" checked={devisAudit} onChange={e => setDevisAudit(e.target.checked)} style={{ width: 16, height: 16 }} />
                <div>
                  <div style={{ fontWeight: 500 }}>Générer aussi un devis d'audit (optionnel)</div>
                  <div style={{ fontSize: 11, color: 'var(--text3)' }}>En plus du devis de rendez-vous démarrage (350€), ajouter un devis d'audit complet</div>
                </div>
              </label>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 14, paddingLeft: 2 }}>
              ✅ Un devis de rendez-vous démarrage (350€) sera automatiquement généré.
            </div>

            <div className="modal-footer">
              <button className="btn" onClick={() => { setStep('intro'); setParsed(null); setFile(null); }}>← Recommencer</button>
              <button
                className="btn btn-primary"
                onClick={handleCreate}
                disabled={hasBlocker || loading}
                title={hasBlocker ? 'Corrigez les erreurs bloquantes avant de continuer' : ''}
              >
                {hasBlocker ? '🚫 Erreur bloquante' : 'Créer le dossier →'}
              </button>
            </div>
          </>
        )}

        {/* ── CREATING ─────────────────────────────────────────────────────── */}
        {step === 'creating' && (
          <div className="empty" style={{ padding: '48px 0' }}>
            <div style={{ fontSize: 28, marginBottom: 12 }}>⏳</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Création du dossier en cours…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Génération des Excel + synchronisation Google Drive</div>
          </div>
        )}

        {/* ── DONE ─────────────────────────────────────────────────────────── */}
        {step === 'done' && (
          <div className="empty" style={{ padding: '48px 0' }}>
            <div style={{ fontSize: 28, marginBottom: 12 }}>✅</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Dossier créé avec succès !</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Fichiers Excel générés sur Drive · Devis de démarrage créé</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Modal import Excel ────────────────────────────────────────────────────────

function ImportExcelModal({ slug, onClose, onDone }) {
  const [step, setStep] = useState('upload'); // upload → preview → done
  const [parsed, setParsed] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const isUpdate = !!slug;

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    setError('');
    try {
      const formData = new FormData();
      formData.append('file', file);
      const url = isUpdate
        ? `${API}/import/update-client/${slug}`
        : `${API}/import/parse`;
      const res = await fetch(url, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setParsed(data);
      setStep('preview');
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  async function confirm() {
    setLoading(true);
    try {
      if (isUpdate) {
        // Applique les modifications
        const updates = {};
        Object.entries(parsed.modifications || {}).forEach(([k, v]) => {
          updates[k] = v['après'];
        });
        const res = await fetch(`${API}/clients/${slug}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        if (!res.ok) throw new Error(await res.text());
        const updated = await res.json();
        onDone(updated);
      } else {
        // Crée le client — re-upload le fichier
        const input = document.getElementById('excel-import-input');
        const formData = new FormData();
        formData.append('file', input.files[0]);
        const res = await fetch(`${API}/import/create-client`, { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        onDone(await res.json());
      }
      onClose();
    } catch (e) {
      setError('Erreur : ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  const LABELS = {
    nom_officiel: 'Nom officiel', nom_usuel: 'Nom usuel', siret: 'SIRET',
    ninea: 'NINEA', rccm: 'RCCM', date_creation: 'Date création',
    adresse_siege: 'Adresse', president: 'Président(e)', tresorier: 'Trésorier(e)',
    email_contact: 'Email', telephone: 'Téléphone', licence_type1: 'Licence Type 1',
    numero_urssaf: 'N° URSSAF', numero_guso: 'N° GUSO',
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">{isUpdate ? '📊 Mettre à jour depuis un Excel' : '📥 Créer un client depuis un Excel'}</div>
        <div className="modal-sub">
          {isUpdate
            ? 'Importez une fiche client remplie — les modifications seront prévisualisées avant application.'
            : 'Importez un fichier COLLECTE_CLIENT.xlsx ou STRUCTURE_xxx.xlsx rempli par le client pour créer automatiquement son dossier.'}
        </div>

        {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {step === 'upload' && (
          <div>
            <div style={{
              border: '2px dashed var(--border2)', borderRadius: 'var(--radius)',
              padding: '30px', textAlign: 'center', cursor: 'pointer',
              background: 'var(--surface2)'
            }} onClick={() => document.getElementById('excel-import-input').click()}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>📊</div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>Cliquez pour sélectionner un fichier Excel</div>
              <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>
                FICHE_CLIENT.xlsx, STRUCTURE_xxx.xlsx (.xlsx uniquement)
              </div>
            </div>
            <input id="excel-import-input" type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleFile} />
            {loading && <div style={{ textAlign: 'center', padding: 16, color: 'var(--text3)' }}>Analyse en cours...</div>}
          </div>
        )}

        {step === 'preview' && parsed && (
          <div>
            <div style={{ background: 'var(--accent-light)', padding: '10px 14px', borderRadius: 6, marginBottom: 14, fontSize: 13 }}>
              {isUpdate
                ? <><strong>{parsed.nb_modifications}</strong> modification(s) détectée(s) — source : {parsed.source}</>
                : <><strong>{parsed.champs_importes}</strong> champ(s) importé(s) — source : {parsed.source}</>
              }
            </div>

            {isUpdate && parsed.modifications && Object.keys(parsed.modifications).length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Modifications détectées :</div>
                {Object.entries(parsed.modifications).map(([key, change], i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 12 }}>
                    <span style={{ color: 'var(--text3)', width: 140, flexShrink: 0 }}>{LABELS[key] || key}</span>
                    <span style={{ color: 'var(--danger)', textDecoration: 'line-through', flex: 1 }}>{change.avant || '—'}</span>
                    <span style={{ color: 'var(--accent)', flex: 1, fontWeight: 500 }}>→ {change['après']}</span>
                  </div>
                ))}
              </div>
            )}

            {!isUpdate && parsed.client_data && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', marginBottom: 8 }}>Données extraites :</div>
                {Object.entries(parsed.client_data).slice(0, 8).map(([key, val], i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, padding: '5px 0', borderBottom: '1px solid var(--border)', fontSize: 12 }}>
                    <span style={{ color: 'var(--text3)', width: 160, flexShrink: 0 }}>{LABELS[key] || key}</span>
                    <span style={{ fontWeight: 500 }}>{val}</span>
                  </div>
                ))}
                {parsed.projet_data?.nom_projet && (
                  <div style={{ marginTop: 8, padding: '8px', background: 'var(--info-light)', borderRadius: 6, fontSize: 12 }}>
                    📋 Projet détecté : <strong>{parsed.projet_data.nom_projet}</strong> — sera créé automatiquement
                  </div>
                )}
              </div>
            )}

            {isUpdate && parsed.nb_modifications === 0 && (
              <div style={{ textAlign: 'center', padding: 20, color: 'var(--text3)', fontSize: 13 }}>
                Aucune modification détectée — le dossier est déjà à jour.
              </div>
            )}
          </div>
        )}

        <div className="modal-footer">
          <button className="btn" onClick={() => step === 'preview' ? setStep('upload') : onClose()}>
            {step === 'preview' ? '← Retour' : 'Annuler'}
          </button>
          {step === 'preview' && (isUpdate ? parsed?.nb_modifications > 0 : parsed?.champs_importes > 0) && (
            <button className="btn btn-primary" onClick={confirm} disabled={loading}>
              {loading ? 'Application...' : isUpdate ? `Appliquer ${parsed.nb_modifications} modification(s) →` : 'Créer le dossier →'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function NewProjectModal({ slug, clientMeta, onClose, onCreated }) {
  const [step, setStep] = useState('intro');  // intro | upload | analyse | verdict | creating
  const [file, setFile] = useState(null);
  const [analyse, setAnalyse] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const cd = clientMeta?.client_data || {};
  const nomClient = cd.nom_usuel || cd.nom_officiel || '?';

  async function handleUpload(f) {
    setFile(f);
    setError('');
    setLoading(true);
    setStep('analyse');
    const form = new FormData();
    form.append('file', f);
    form.append('client_slug', slug);
    try {
      const res = await fetch(`${API}/projets/analyse-faisabilite`, {
        method: 'POST', body: form
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      setAnalyse(data);
      setStep('verdict');
    } catch (e) {
      setError(e.message);
      setStep('upload');
    } finally {
      setLoading(false);
    }
  }

  async function handleDecision(decision) {
    // decision : 'accepte' | 'condition' | 'refuse'
    setStep('creating');
    setLoading(true);
    try {
      const form = new FormData();
      form.append('file', file);
      form.append('client_slug', slug);
      form.append('decision', decision);
      form.append('analyse_id', analyse?.id || '');
      const res = await fetch(`${API}/projets/creer-depuis-faisabilite`, {
        method: 'POST', body: form
      });
      if (!res.ok) throw new Error(await res.text());
      onCreated();
      onClose();
    } catch (e) {
      setError(e.message);
      setStep('verdict');
    } finally {
      setLoading(false);
    }
  }

  const VERDICT_COLORS = {
    'FAVORABLE': { bg: '#E8F5E9', color: '#1B5E20', icon: '✅' },
    'SOUS CONDITIONS': { bg: '#FFF3E0', color: '#E65100', icon: '⚠️' },
    'DÉFAVORABLE': { bg: '#FFEBEE', color: '#B71C1C', icon: '🚫' },
  };
  const vc = VERDICT_COLORS[analyse?.verdict] || VERDICT_COLORS['SOUS CONDITIONS'];

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ width: 600 }}>

        {/* ── INTRO ────────────────────────────────────────────────────── */}
        {step === 'intro' && <>
          <div className="modal-title">📋 Nouveau projet</div>
          <div className="modal-sub">La création d'un projet nécessite l'étude de faisabilité complétée.</div>

          <div style={{ background: 'var(--accent-light)', borderRadius: 'var(--radius-sm)', padding: '14px 16px', marginBottom: 16 }}>
            <div style={{ fontWeight: 600, fontSize: 13, color: 'var(--accent)', marginBottom: 8 }}>📋 Processus de création projet</div>
            {[
              ['1', 'Téléchargez le template et envoyez-le au client', true],
              ['2', 'Le client remplit les hypothèses (budget, billetterie, partenaires)'],
              ['3', 'Importez le fichier complété ici'],
              ['4', 'Claude analyse la faisabilité et émet un verdict'],
              ['5', 'Vous décidez : accepter, accepter sous conditions, ou refuser'],
            ].map(([n, label, hasLink]) => (
              <div key={n} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 6, fontSize: 13 }}>
                <div style={{ width: 20, height: 20, borderRadius: '50%', background: 'var(--accent)', color: 'white', fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{n}</div>
                <div>
                  {label}
                  {hasLink && <> — <a href={`${API}/templates/faisabilite-projet`} target="_blank" style={{ color: 'var(--accent)', fontWeight: 500 }}>Télécharger le template →</a></>}
                </div>
              </div>
            ))}
          </div>

          <div
            style={{ border: '2px dashed var(--border2)', borderRadius: 'var(--radius)', padding: '28px', textAlign: 'center', cursor: 'pointer', background: 'var(--surface2)' }}
            onClick={() => document.getElementById('proj-file-input').click()}
          >
            <div style={{ fontSize: 28, marginBottom: 8 }}>📊</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Importer le template de faisabilité complété</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 4 }}>TEMPLATE_FAISABILITE_PROJET.xlsx (.xlsx uniquement)</div>
            <input id="proj-file-input" type="file" accept=".xlsx,.xls" style={{ display: 'none' }}
              onChange={e => e.target.files[0] && handleUpload(e.target.files[0])} />
          </div>

          {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginTop: 12 }}>{error}</div>}

          <div className="modal-footer">
            <button className="btn" onClick={onClose}>Annuler</button>
          </div>
        </>}

        {/* ── ANALYSE ──────────────────────────────────────────────────── */}
        {step === 'analyse' && (
          <div className="empty" style={{ padding: '48px 0' }}>
            <div style={{ fontSize: 28, marginBottom: 12 }}>🧠</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Claude analyse la faisabilité…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Vérification des indicateurs financiers et réglementaires</div>
          </div>
        )}

        {/* ── VERDICT ──────────────────────────────────────────────────── */}
        {step === 'verdict' && analyse && <>
          <div className="modal-title">🔍 Analyse de faisabilité — {analyse.nom_projet}</div>

          {error && <div style={{ background: 'var(--danger-light)', color: 'var(--danger)', padding: '8px 12px', borderRadius: 6, fontSize: 12, marginBottom: 12 }}>{error}</div>}

          {/* Verdict principal */}
          <div style={{ background: vc.bg, borderRadius: 'var(--radius)', padding: '14px 16px', marginBottom: 14, border: `1.5px solid ${vc.color}20` }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: vc.color, marginBottom: 6 }}>{vc.icon} {analyse.verdict}</div>
            <div style={{ fontSize: 13, color: vc.color }}>{analyse.synthese}</div>
          </div>

          {/* Indicateurs */}
          <div style={{ marginBottom: 14, maxHeight: 220, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)' }}>
            {(analyse.indicateurs || []).map((ind, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 10px', borderBottom: '1px solid var(--border)', fontSize: 12, background: i % 2 === 0 ? 'var(--surface)' : 'var(--surface2)' }}>
                <span style={{ fontSize: 14 }}>{ind.statut === 'OK' ? '✅' : ind.statut === 'WARN' ? '⚠️' : ind.statut === 'ERROR' ? '🚫' : '❓'}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 500 }}>{ind.label}</div>
                  <div style={{ color: 'var(--text3)', fontSize: 11 }}>{ind.valeur} — Norme : {ind.norme}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Conditions si applicable */}
          {analyse.conditions?.length > 0 && (
            <div style={{ background: 'var(--warn-light)', borderRadius: 'var(--radius-sm)', padding: '10px 12px', marginBottom: 14, fontSize: 12 }}>
              <div style={{ fontWeight: 600, color: 'var(--warn)', marginBottom: 6 }}>Conditions à remplir :</div>
              {analyse.conditions.map((c, i) => <div key={i} style={{ color: 'var(--warn)' }}>• {c}</div>)}
            </div>
          )}

          {/* Chiffres clés */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
            {[
              ['Budget total', `${(analyse.budget_total || 0).toLocaleString('fr-FR')} €`],
              ['Subventions', `${(analyse.total_subventions || 0).toLocaleString('fr-FR')} €`],
              ['Billetterie', `${(analyse.total_billetterie || 0).toLocaleString('fr-FR')} €`],
              ['Solde prév.', `${(analyse.solde || 0).toLocaleString('fr-FR')} €`],
            ].map(([label, val]) => (
              <div key={label} style={{ flex: 1, background: 'var(--surface2)', borderRadius: 'var(--radius-sm)', padding: '8px', textAlign: 'center' }}>
                <div style={{ fontSize: 10, color: 'var(--text3)', marginBottom: 2 }}>{label}</div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{val}</div>
              </div>
            ))}
          </div>

          {/* Décision */}
          <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 10, textAlign: 'center' }}>
            Votre décision pour ce projet :
          </div>
          <div className="modal-footer" style={{ justifyContent: 'center', gap: 10 }}>
            <button className="btn" style={{ color: 'var(--danger)', borderColor: 'var(--danger)' }}
              onClick={() => handleDecision('refuse')}>
              🚫 Refuser
            </button>
            <button className="btn" style={{ color: 'var(--warn)', borderColor: 'var(--warn)' }}
              onClick={() => handleDecision('condition')}>
              ⚠️ Accepter sous conditions
            </button>
            <button className="btn btn-primary"
              onClick={() => handleDecision('accepte')}>
              ✅ Accepter — Créer le projet
            </button>
          </div>
        </>}

        {/* ── CREATING ─────────────────────────────────────────────────── */}
        {step === 'creating' && (
          <div className="empty" style={{ padding: '48px 0' }}>
            <div style={{ fontSize: 28, marginBottom: 12 }}>⏳</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Création du projet en cours…</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 6 }}>Génération des Excel Drive + fiche de faisabilité</div>
          </div>
        )}
      </div>
    </div>
  );
}
